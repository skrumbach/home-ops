---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

x-env: &env
  disk: "{{.disk}}"
  job: "{{.job}}"
  node: "{{.node}}"
  ceph_image: "{{.CEPH_IMAGE}}"

vars:
  ROOK_SCRIPTS_DIR: "{{.ROOT_DIR}}/.taskfiles/rook/scripts"
  ROOK_TEMPLATES_DIR: "{{.ROOT_DIR}}/.taskfiles/rook/templates"
  ROOK_HELMRELEASE: "{{.ROOT_DIR}}/kubernetes/apps/base/rook-ceph/rook-ceph/cluster/helmrelease.yaml"
  # The wipe Job runs the cluster's Ceph image; Renovate tracks only the HelmRelease pin.
  CEPH_IMAGE:
    sh: yq '.spec.values.cephImage.repository + ":" + .spec.values.cephImage.tag' {{.ROOK_HELMRELEASE}}
  TALOS_NODE_NAMES: [talos-1, talos-2, talos-3]
  TALOS_1_DISKS:
    - /dev/disk/by-id/nvme-Lexar_SSD_NM790_4TB_NME714W100393P2202
    - /dev/disk/by-id/nvme-Samsung_SSD_980_PRO_2TB_S6B0NL0W412707M
  TALOS_2_DISKS:
    - /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7KHNJ0WC55436E
    - /dev/disk/by-id/nvme-Lexar_SSD_NM790_4TB_NME714W101694P2202
  TALOS_3_DISKS:
    - /dev/disk/by-id/nvme-Samsung_SSD_980_PRO_2TB_S69ENL0TC06068B
    - /dev/disk/by-id/nvme-Lexar_SSD_NM790_4TB_NL1948W100519P2202

tasks:

  check-disks:
    desc: Check disk status on all nodes
    cmds:
      - echo "🔍 Checking disk status on all nodes..."
      - for: {var: TALOS_NODE_NAMES}
        task: check-node-disks
        vars:
          node: "{{.ITEM}}"

  check-node-disks:
    desc: Check disk status on specific node
    cmds:
      - echo "🔍 Checking disks on {{.node}}..."
      - |
        kubectl debug node/{{.node}} -it --image=docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4 -- sh -c "
          echo '📀 Block devices:' &&
          ls -la /host/dev/nvme* /host/dev/sd* 2>/dev/null || echo 'No standard block devices found' &&
          echo '💾 Mount points:' &&
          df -h /host &&
          echo '🗂️ Disk by-id (first 10):' &&
          ls -la /host/dev/disk/by-id/ 2>/dev/null | head -10 || echo 'No disk by-id entries'
        " || echo "❌ Failed to check {{.node}}"

  # Run before `just talos upgrade-node`/`reboot-node`/`reset-node` or any OSD restart.
  # Recovery: .agents/skills/incident-runbooks/references/ceph-osd-recovery.md
  check-osd-device-paths:
    desc: Audit OSD deployment device-path drift + reboot-safety gate (Rook #17224)
    cmds:
      - bash {{.ROOK_SCRIPTS_DIR}}/check-osd-device-paths.sh

  reset:
    desc: Reset Rook
    vars: &vars
      disk: "{{.cephdisk}}"
      node: "{{.ITEM}}"
    cmds:
      - for: {var: cephnodes}
        task: reset-data
        vars: *vars
      - for: {var: cephnodes}
        task: reset-disk
        vars: *vars
    requires:
      vars: ["cephnodes", "cephdisk"]

  reset-disk:
    desc: Reset a rook disk on a node
    prompt: Reset rook disk '{{.disk}}' on '{{.node}}' ... continue?
    summary: |
      Args:
        disk: Disk to wipe (required)
        node: Node the disk is on (required)
    cmds:
      - envsubst < <(cat {{.ROOK_TEMPLATES_DIR}}/wipe-disk-job.tmpl.yaml) | kubectl apply -f -
      - kubectl -n default wait job/{{.job}} --for condition=complete --timeout=5m
      - kubectl -n default logs job/{{.job}}
      - kubectl -n default delete job {{.job}}
    env: *env
    requires:
      vars: ["disk", "node"]
    vars:
      job: wipe-disk-{{.node}}-{{now | date "150405"}}
    preconditions:
      - test -f {{.ROOK_TEMPLATES_DIR}}/wipe-disk-job.tmpl.yaml
      - sh: '[[ "{{.CEPH_IMAGE}}" == quay.io/ceph/ceph:v* ]]'
        msg: "Could not read cephImage from {{.ROOK_HELMRELEASE}}"

  reset-data:
    desc: Reset rook data on a node
    prompt: Reset rook data on node '{{.node}}' ... continue?
    summary: |
      Args:
        node: Node the data is on (required)
    cmds:
      - envsubst < <(cat {{.ROOK_TEMPLATES_DIR}}/wipe-data-job.tmpl.yaml) | kubectl apply -f -
      - kubectl -n default wait job/{{.job}} --for condition=complete --timeout=5m
      - kubectl -n default logs job/{{.job}}
      - kubectl -n default delete job {{.job}}
    env: *env
    requires:
      vars: ["node"]
    vars:
      job: wipe-data-{{.node}}-{{now | date "150405"}}
    preconditions:
      - test -f {{.ROOK_TEMPLATES_DIR}}/wipe-data-job.tmpl.yaml

  wipe-all:
    desc: Wipe all disks and data for your Rook cluster
    prompt: This will wipe ALL Rook disks and data on ALL nodes. Are you sure?
    cmds:
      - task: wipe-talos-1
      - task: wipe-talos-2
      - task: wipe-talos-3
      - task: reset-all-data

  reset-all-data:
    desc: Reset rook data on all nodes
    cmds:
      - echo "🔄 Resetting rook data on all nodes..."
      - for: {var: TALOS_NODE_NAMES}
        task: reset-data
        vars:
          node: "{{.ITEM}}"
      - echo "✅ All node data reset complete"

  wipe-talos-1:
    desc: Wipe all disks on talos-1
    cmds:
      - echo "🔄 Wiping disks on talos-1..."
      - for: {var: TALOS_1_DISKS}
        task: reset-disk
        vars:
          node: talos-1
          disk: "{{.ITEM}}"
      - echo "✅ talos-1 disk wipe complete"

  wipe-talos-2:
    desc: Wipe all disks on talos-2
    cmds:
      - echo "🔄 Wiping disks on talos-2..."
      - for: {var: TALOS_2_DISKS}
        task: reset-disk
        vars:
          node: talos-2
          disk: "{{.ITEM}}"
      - echo "✅ talos-2 disk wipe complete"

  wipe-talos-3:
    desc: Wipe all disks on talos-3
    cmds:
      - echo "🔄 Wiping disks on talos-3..."
      - for: {var: TALOS_3_DISKS}
        task: reset-disk
        vars:
          node: talos-3
          disk: "{{.ITEM}}"
      - echo "✅ talos-3 disk wipe complete"

  status:
    desc: Check the status of wipe jobs
    cmds:
      - echo "🔍 Checking wipe job status..."
      - kubectl get jobs -A | grep -E "wipe-disk|wipe-data" || echo "✅ No wipe jobs found"
      - kubectl get pods -A | grep -E "wipe-disk|wipe-data" || echo "✅ No wipe pods found"
