---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

set: [pipefail]
shopt: [globstar]

# Same defaults as .mise.toml: admin kubeconfig and talosconfig unless HOME_OPS_* says otherwise.
env:
  KUBECONFIG: '{{env "HOME_OPS_KUBECONFIG" | default (print (env "HOME") "/.kube/home-ops-admin")}}'
  TALOSCONFIG: '{{env "HOME_OPS_TALOSCONFIG" | default (print (env "HOME") "/.talos/home-ops-admin")}}'

includes:
  flux: .taskfiles/flux
  rook: .taskfiles/rook
  network: .taskfiles/network
  actions-runner: .taskfiles/actions-runner

tasks:

  default: task --list

  setup-dev-env:
    cmds:
      - mise install
      - mise exec -- pre-commit install
      - mise exec -- pre-commit install --hook-type commit-msg
    desc: Setup dev environment and install pre-commit hooks

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux
