---
# Read-only plan. TRUENAS_API_KEY belongs to the local `tofu-read-only` user (group truenas_readonly_administrators, READONLY_ADMIN).
# API keys belong to the user who made them: a key created while logged in as admin is full admin whatever its name.
# vals exec -i -f secrets.vals.yaml -- tofu init, then tofu plan. Apply uses secrets-apply.vals.yaml and needs an explicit go-ahead.

TRUENAS_API_KEY: ref+op://Automation/truenas-terraform/TRUENAS_API_KEY

# Shared R2 state bucket (backend.tofu). AWS_ENDPOINT_URL_S3 must resolve, or the S3 backend dials real AWS.
AWS_ACCESS_KEY_ID: ref+op://Automation/tofu-state-r2/ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+op://Automation/tofu-state-r2/SECRET_ACCESS_KEY
AWS_ENDPOINT_URL_S3: ref+op://Automation/tofu-state-r2/ENDPOINT_URL

# State and plan encryption, separate from the UniFi stack's passphrase.
TF_VAR_state_passphrase: ref+op://Automation/truenas-terraform/TF_STATE_PASSPHRASE
