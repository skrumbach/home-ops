---
# Approved apply only: a saved plan after an explicit, current go-ahead. Never a bare `tofu apply`.
# vals exec -i -f secrets-apply.vals.yaml -- tofu plan -out=truenas.tfplan, review it, then apply that file. Skill `truenas-nas`.

# Key owned by the local `tofu-apply` user (Full Admin). Never copy it into TRUENAS_API_KEY.
TRUENAS_API_KEY: ref+op://Automation/truenas-terraform/TRUENAS_APPLY_API_KEY

# Same as secrets.vals.yaml.
AWS_ACCESS_KEY_ID: ref+op://Automation/tofu-state-r2/ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+op://Automation/tofu-state-r2/SECRET_ACCESS_KEY
AWS_ENDPOINT_URL_S3: ref+op://Automation/tofu-state-r2/ENDPOINT_URL
TF_VAR_state_passphrase: ref+op://Automation/truenas-terraform/TF_STATE_PASSPHRASE
