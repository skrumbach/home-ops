---
# Read-only plan. UNIFI_* is the local `tofu-read-only` UniFi OS user (Network view only); it cannot write and cannot read WLAN passphrases.
# vals exec -i -f secrets.vals.yaml -- tofu init, then tofu plan. Apply uses secrets-apply.vals.yaml and needs an explicit go-ahead. Skill `unifi-network`.

UNIFI_USERNAME: ref+op://Automation/unifi-terraform/UNIFI_USER
UNIFI_PASSWORD: ref+op://Automation/unifi-terraform/UNIFI_PASSWORD

# Owned by 1Password, ignore_changes in wlans.tofu. Read from the UniFi UI once and stored by the owner.
TF_VAR_wlan_passphrase_home: ref+op://Automation/unifi-terraform/WLAN_U7_HOME_PASSPHRASE
TF_VAR_wlan_passphrase_iot: ref+op://Automation/unifi-terraform/WLAN_U7_IOT_PASSPHRASE
TF_VAR_wlan_passphrase_secure: ref+op://Automation/unifi-terraform/WLAN_U7_SECURE_PASSPHRASE

# State in R2 (backend.tofu). Shared bucket token, Object Read & Write on home-ops-tfstate only. AWS_ENDPOINT_URL_S3 must resolve:
# with it unset the S3 backend dials real AWS. The endpoint carries the account ID, so it stays in 1Password.
AWS_ACCESS_KEY_ID: ref+op://Automation/tofu-state-r2/ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+op://Automation/tofu-state-r2/SECRET_ACCESS_KEY
AWS_ENDPOINT_URL_S3: ref+op://Automation/tofu-state-r2/ENDPOINT_URL

# State and plan encryption (backend.tofu). Losing it means rebuilding state from imports.tofu.
TF_VAR_state_passphrase: ref+op://Automation/unifi-terraform/TF_STATE_PASSPHRASE
