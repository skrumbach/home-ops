---
# Approved apply only: a saved plan from a wired machine after an explicit, current go-ahead. Never a bare `tofu apply`.
# vals exec -i -f secrets-apply.vals.yaml -- tofu plan -out=unifi.tfplan, review it, then apply that file.

# Local UniFi OS user `tofu-apply`: Network admin only (no Protect, not Super Admin). Never copy it into UNIFI_USER.
UNIFI_USERNAME: ref+op://Automation/unifi-terraform/UNIFI_APPLY_USER
UNIFI_PASSWORD: ref+op://Automation/unifi-terraform/UNIFI_APPLY_PASSWORD

# Same as secrets.vals.yaml.
TF_VAR_wlan_passphrase_home: ref+op://Automation/unifi-terraform/WLAN_U7_HOME_PASSPHRASE
TF_VAR_wlan_passphrase_iot: ref+op://Automation/unifi-terraform/WLAN_U7_IOT_PASSPHRASE
TF_VAR_wlan_passphrase_secure: ref+op://Automation/unifi-terraform/WLAN_U7_SECURE_PASSPHRASE
AWS_ACCESS_KEY_ID: ref+op://Automation/tofu-state-r2/ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+op://Automation/tofu-state-r2/SECRET_ACCESS_KEY
AWS_ENDPOINT_URL_S3: ref+op://Automation/tofu-state-r2/ENDPOINT_URL
TF_VAR_state_passphrase: ref+op://Automation/unifi-terraform/TF_STATE_PASSPHRASE
