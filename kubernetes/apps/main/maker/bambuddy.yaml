---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bambuddy
spec:
  targetNamespace: maker
  path: ./kubernetes/apps/base/maker/bambuddy/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  dependsOn:
    - name: kopiur-repository
      namespace: system
  components:
    - ../../../../../components/kopiur
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_SCHEDULE_R2: "H 16 * * *"
