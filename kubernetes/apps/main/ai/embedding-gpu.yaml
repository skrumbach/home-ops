---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app embedding-gpu
spec:
  targetNamespace: &namespace ai
  # Deployment, not HelmRelease: an HR healthCheck stays Ready through a crashloop.
  # wait stays false so this list is actually consulted.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/base/ai/embedding-gpu/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 15m
