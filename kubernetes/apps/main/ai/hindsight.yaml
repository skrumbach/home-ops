---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hindsight
spec:
  targetNamespace: &namespace ai
  # The rendered workload, never the HelmRelease.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: hindsight-api
      namespace: *namespace
  dependsOn:
    - name: hindsight-db
      namespace: ai
    - name: onepassword-store
      namespace: security
    - name: cloudnative-pg
      namespace: database
    # litellm owns the key CR and the PushSecret that writes litellm-consumer-hindsight; embedding-cpu
    # serves the embeddings model.
    - name: litellm
      namespace: ai
    - name: embedding-cpu
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/base/ai/hindsight/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Role and database (with the pgvector extension) on the shared postgres-18 Cluster (retain: removing
# this never drops data).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hindsight-db
spec:
  targetNamespace: database
  interval: 1h
  # Without this a failed health check (the 1Password item missing on first deploy) waits out the 1h interval.
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/base/ai/hindsight/db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: postgres-cluster-18
      namespace: database
    - name: onepassword-store
      namespace: security
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: status.applied == true
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: status.applied == true
  wait: true
  postBuild:
    substitute:
      APP: hindsight
      CNPG_ROLE: hindsight
      CNPG_DATABASE: hindsight
