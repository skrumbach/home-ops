---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vllm
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
    - name: onepassword-store
      namespace: security
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  interval: 1h
  path: "./kubernetes/apps/base/ai/vllm/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  # Covers the 30 min startup probe budget (helmrelease.yaml startup failureThreshold 60 x 30s).
  timeout: 30m
  postBuild:
    substituteFrom:
      # CHAT_MODEL_ID: the loaded model's name, defined once in chat-model.yaml.
      - name: chat-model
        kind: ConfigMap
