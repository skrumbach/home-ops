---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-crds
spec:
  targetNamespace: ai
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: "./kubernetes/apps/base/ai/toolhive/crds"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive
spec:
  targetNamespace: &namespace ai
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: "./kubernetes/apps/base/ai/toolhive/app"
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: toolhive-operator
      namespace: *namespace
  dependsOn:
    - name: toolhive-crds
      namespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
