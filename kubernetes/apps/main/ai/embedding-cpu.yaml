---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app embedding-cpu
spec:
  targetNamespace: &namespace ai
  # Deployment, not HelmRelease: an HR healthCheck stays Ready through a crashloop.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/base/ai/embedding-cpu/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Short on purpose: a crash-looping deployment holds the health check open for this long and
  # blocks the next revision (the first rollout lost 15 minutes to it).
  timeout: 5m
