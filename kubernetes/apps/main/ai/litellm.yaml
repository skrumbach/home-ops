---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
spec:
  targetNamespace: &namespace ai
  components:
    - ../../../../../components/dragonfly
  # The operator-rendered Deployment, never the LiteLLMProxy CR.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  # Dragonfly readiness is status.phase; only evaluated for objects in the assessment set.
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
  dependsOn:
    - name: litellm-db
      namespace: ai
    - name: onepassword-store
      namespace: security
    - name: dragonfly-operator
      namespace: database
    # Hard requirement: its webhook rejects LiteLLM CRs at admission while it is down.
    - name: litellm-operator
      namespace: ai
    - name: cloudnative-pg
      namespace: database
    # Ordering only: vllm-app is a backend, not a runtime health dependency.
    - name: vllm
      namespace: ai
  interval: 1h
  path: "./kubernetes/apps/base/ai/litellm/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  postBuild:
    substituteFrom:
      # CHAT_MODEL_ID: the loaded model's name, defined once in chat-model.yaml.
      - name: chat-model
        kind: ConfigMap
    substitute:
      APP: *app
      GATUS_GROUP: ai
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Role and database on the shared postgres-18 Cluster (retain: removing this never
# drops data).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-db
spec:
  targetNamespace: database
  interval: 30m
  timeout: 5m
  path: ./kubernetes/components/cnpg-database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: postgres-cluster-18
      namespace: database
    - name: onepassword-store
      namespace: security
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: status.applied == true
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: status.applied == true
  wait: true
  postBuild:
    substitute:
      APP: litellm
      CNPG_ROLE: litellm
      CNPG_DATABASE: litellm
