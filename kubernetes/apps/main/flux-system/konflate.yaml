---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app konflate
spec:
  targetNamespace: &namespace flux-system
  # No ExternalSecret here. The edge dates from when postBuild substituted
  # cluster-secrets; it keeps konflate after the secrets operator on a cold bootstrap.
  dependsOn:
    - name: external-secrets
      namespace: security
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/base/flux-system/konflate/app
  prune: true
  retryInterval: 2m
  postBuild:
    substitute:
      APP: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
