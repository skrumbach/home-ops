---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app obsidian-livesync
spec:
  targetNamespace: selfhosted
  interval: 30m
  path: "./kubernetes/apps/base/selfhosted/obsidian-livesync/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: kopiur-repository
      namespace: system
  components:
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 2Gi
      # Identity is measured from the files. Do not fall back to 1000.
      KOPIUR_PUID: "5984"
      KOPIUR_PGID: "5984"
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
