---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app changedetection
spec:
  targetNamespace: selfhosted
  path: ./kubernetes/apps/base/selfhosted/changedetection/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: kopiur-repository
      namespace: system
  components:
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: changedetection-config
      # The live claim is 1Gi; the component's 5Gi default would provision a rebuilt claim at 5x that.
      KOPIUR_CAPACITY: 1Gi
      # 2Gi default clears this snapshot. Namespace r2 hour; ceph stays on the component default.
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
  prune: true
  interval: 30m
