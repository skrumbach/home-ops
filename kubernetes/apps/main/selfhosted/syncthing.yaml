---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app syncthing
spec:
  targetNamespace: selfhosted
  interval: 1h
  path: "./kubernetes/apps/base/selfhosted/syncthing/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kopiur-repository
      namespace: system
  components:
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# kopiur backup for the SECOND volume, `syncthing-data` (the synced files). Own Kustomization because Flux allows
# exactly one postBuild.substitute map each, and every kopiur object is named from the APP key.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: syncthing-data-kopiur
spec:
  targetNamespace: &namespace selfhosted
  interval: 1h
  path: "./kubernetes/components/kopiur/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: syncthing
      namespace: *namespace
  postBuild:
    substitute:
      APP: syncthing-data
      KOPIUR_CLAIM: syncthing-data
      KOPIUR_CACHE_CAPACITY: 15Gi
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
