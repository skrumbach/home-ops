---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rsshub
spec:
  targetNamespace: &namespace selfhosted
  components:
    - ../../../../../components/dragonfly
  interval: 1h
  path: ./kubernetes/apps/base/selfhosted/rsshub/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: dragonfly-operator
      namespace: database
    - name: rsshub-playwright
      namespace: *namespace
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rsshub-playwright
spec:
  # No components: browserless is stateless (/config is an emptyDir), so there is no claim to back up.
  interval: 1h
  path: ./kubernetes/apps/base/selfhosted/rsshub/playwright
  postBuild:
    substitute:
      CONFIG_TIMEZONE: America/New_York
  prune: true
  retryInterval: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: dragonfly-operator
      namespace: database
    - name: intel-device-plugin-gpu
      namespace: system
  targetNamespace: selfhosted
