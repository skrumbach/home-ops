---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id
spec:
  targetNamespace: security
  dependsOn:
    - name: pocket-id-operator
      namespace: security
    - name: pocket-id-db
      namespace: security
  # The operator creates the Deployment from the PocketIDInstance.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: pocket-id
      namespace: security
    - # Pocket ID serves an open /setup page while it has no user, so this is
      # not Ready until the owner account exists.
      apiVersion: pocketid.internal/v1alpha1
      kind: PocketIDUser
      name: owner
      namespace: security
  healthCheckExprs:
    - apiVersion: pocketid.internal/v1alpha1
      kind: PocketIDUser
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/base/security/pocket-id/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Role and database on the shared postgres-18 Cluster (retain: removing this never
# drops data).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id-db
spec:
  targetNamespace: database
  dependsOn:
    - name: postgres-cluster-18
      namespace: database
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: status.applied == true
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: status.applied == true
  wait: true
  interval: 1h
  timeout: 5m
  path: ./kubernetes/components/cnpg-database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: pocket-id
      CNPG_ROLE: pocket_id
      CNPG_DATABASE: pocket_id
