---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id-operator
spec:
  targetNamespace: security
  # Ready only after the Helm install, so the CRDs exist before pocket-id applies its CRs.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: pocket-id-operator
      namespace: security
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/base/security/pocket-id-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
