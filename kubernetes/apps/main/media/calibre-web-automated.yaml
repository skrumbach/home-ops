---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre-web-automated
spec:
  targetNamespace: &namespace media
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: keda
      namespace: monitoring
    - name: onepassword-store
      namespace: security
    - name: rook-ceph-cluster
      namespace: rook-ceph
  path: ./kubernetes/apps/base/media/calibre-web-automated/app
  components:
    - ../../../../../components/kopiur/pvc
    - ../../../../../components/keda/nfs-scaler
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  timeout: 3m
  # Workload health signal only. wait stays unset (false): Flux honours healthChecks only then (wait:true assesses the whole inventory instead).
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: calibre-web-automated
      namespace: *namespace
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 20Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calibre-web-automated-kopiur
spec:
  targetNamespace: media
  interval: 30m
  path: "./kubernetes/components/kopiur/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # Deliberately no dependsOn calibre-web-automated (greenfield deadlock).
    # kopiur-repository is the dependency that matters.
    - name: kopiur-repository
      namespace: system
  postBuild:
    substitute:
      APP: calibre-web-automated
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour, outside the kopiur ceph slots (01/05/09/13/17/21).
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
