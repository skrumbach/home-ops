---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tdarr
spec:
  components:
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  dependsOn:
    - name: intel-device-plugin-gpu
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: system
  interval: 1h
  path: ./kubernetes/apps/base/media/tdarr/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: tdarr-config
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      KOPIUR_CACHE_CAPACITY: 10Gi
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
