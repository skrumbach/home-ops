---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # Holds only the Certificate both Gateways serve; the 1Password copy is gone,
  # but renaming this Kustomization would delete and reissue the Certificate.
  name: &app certificates-export
spec:
  dependsOn:
    # Owns the Certificate CRD and the issuer the certificate uses.
    - name: cert-manager
      namespace: cert-manager
  interval: 1h
  path: ./kubernetes/apps/base/network/certificates/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  targetNamespace: network
