---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee2mqtt
spec:
  targetNamespace: home-automation
  interval: 30m
  path: "./kubernetes/apps/base/home-automation/zigbee2mqtt/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: multus-networks
      namespace: kube-system
    - name: onepassword-store
      namespace: security
    - name: emqx-cluster
      namespace: database
    - name: kopiur-repository
      namespace: system
  components:
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: zigbee2mqtt-data
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      KOPIUR_SCHEDULE_R2: "H 10 * * *"
