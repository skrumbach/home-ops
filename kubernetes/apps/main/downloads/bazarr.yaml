---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bazarr
spec:
  targetNamespace: downloads
  interval: 1h
  path: "./kubernetes/apps/base/downloads/bazarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: downloads-pvc
      namespace: downloads
    - name: onepassword-store
      namespace: security
    - name: kopiur-repository
      namespace: system
    - name: keda
      namespace: monitoring
  components:
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
    - ../../../../../components/keda/nfs-scaler
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: bazarr-config
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
