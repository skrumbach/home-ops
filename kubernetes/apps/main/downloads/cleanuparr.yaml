---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cleanuparr
spec:
  targetNamespace: downloads
  interval: 1h
  path: "./kubernetes/apps/base/downloads/cleanuparr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kopiur-repository
      namespace: system
  components:
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substitute:
      APP: *app
      # KOPIUR_CLAIM is omitted: the claim is named after the app.
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
