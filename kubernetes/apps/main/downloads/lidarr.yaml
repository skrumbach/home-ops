---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lidarr
spec:
  components:
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
    - ../../../../../components/keda/nfs-scaler
  dependsOn:
    - name: keda
      namespace: monitoring
    - name: lidarr-db
      namespace: downloads
    - name: downloads-pvc
      namespace: downloads
    - name: onepassword-store
      namespace: security
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/downloads/lidarr/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: lidarr-config
      KOPIUR_CAPACITY: 8Gi
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: downloads
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Role and database on the shared postgres-18 Cluster (retain: removing this never
# drops data).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lidarr-db
spec:
  targetNamespace: database
  interval: 30m
  timeout: 5m
  path: ./kubernetes/components/cnpg-database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: postgres-cluster-18
      namespace: database
    - name: onepassword-store
      namespace: security
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: status.applied == true
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: status.applied == true
  wait: true
  postBuild:
    substitute:
      APP: lidarr
      CNPG_ROLE: lidarr
      CNPG_DATABASE: lidarr
