---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app shelfmark
spec:
  targetNamespace: downloads
  interval: 1h
  path: ./kubernetes/apps/base/downloads/shelfmark/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: downloads-pvc
      namespace: downloads
    - name: onepassword-store
      namespace: security
    - name: keda
      namespace: monitoring
  components:
    - ../../../../../components/keda/nfs-scaler
  postBuild:
    substitute:
      APP: *app
