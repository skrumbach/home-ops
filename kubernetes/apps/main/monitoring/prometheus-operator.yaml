---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-operator-crds
spec:
  targetNamespace: monitoring
  interval: 1h
  timeout: 5m
  path: "./kubernetes/apps/base/monitoring/prometheus-operator/crds"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # CRD gate for kube-prometheus-stack (dependsOn). The path is only a CRD
  # HelmRelease, so wait:true holds Ready until the chart has installed them.
  wait: true
