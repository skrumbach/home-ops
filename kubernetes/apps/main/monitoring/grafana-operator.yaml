---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
spec:
  # ServiceMonitor CRDs must exist before the chart installs.
  dependsOn:
    - name: prometheus-operator-crds
  interval: 1h
  timeout: 5m
  path: ./kubernetes/apps/base/monitoring/grafana-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
  # A gate: the two Kustomizations below need the operator's CRDs.
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator-instance
spec:
  # grafana owns what the instance mounts and reads: ConfigMap grafana-brand, Secrets
  # grafana-admin-secret and grafana-oidc-client.
  dependsOn:
    - name: grafana-operator
    - name: grafana
  interval: 1h
  path: ./kubernetes/apps/base/monitoring/grafana-operator/instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator-renderer
spec:
  interval: 1h
  path: ./kubernetes/apps/base/monitoring/grafana-operator/renderer
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator-app-boards
spec:
  # No targetNamespace: every GrafanaDashboard in app-boards/ names the namespace of the ConfigMap it
  # reads. The folders it names by uid are part of the instance.
  dependsOn:
    - name: grafana-operator-instance
  interval: 1h
  path: ./kubernetes/apps/base/monitoring/grafana-operator/app-boards
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator-boards
spec:
  # The folders a board names in folderRef are part of the instance.
  dependsOn:
    - name: grafana-operator-instance
  interval: 1h
  path: ./kubernetes/apps/base/monitoring/grafana-operator/boards
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
