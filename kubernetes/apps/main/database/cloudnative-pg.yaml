---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
spec:
  dependsOn:
    - name: onepassword-store
      namespace: security
  interval: 30m
  path: ./kubernetes/apps/base/database/cloudnative-pg/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-cloud
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: cert-manager
      namespace: cert-manager
  interval: 30m
  path: ./kubernetes/apps/base/database/cloudnative-pg/barman-cloud
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postgres-cluster-18
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    # Supplies the ObjectStore CRD and the plugin the Cluster archives through.
    - name: barman-cloud
      namespace: database
    - name: rook-ceph
      namespace: rook-ceph
    - name: external-secrets
      namespace: security
    # Instances sit on openebs-hostpath (cluster-18.yaml storageClass).
    - name: openebs-hostpath
      namespace: system
  # Operational health gate: readyInstances + ContinuousArchiving (not the Ready
  # condition, which CNPG can latch False indefinitely even while the cluster
  # serves reads/writes). readyInstances >= 1 is a floor; cluster-18 runs 3.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.readyInstances >= 1 && status.conditions.filter(e, e.type == 'ContinuousArchiving').all(e, e.status == 'True')
      failed: status.readyInstances < 1
  interval: 30m
  path: ./kubernetes/apps/base/database/cloudnative-pg/cluster-18
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  targetNamespace: database
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-dashboard
spec:
  interval: 30m
  path: ./kubernetes/apps/base/database/cloudnative-pg/dashboard
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pgadmin
spec:
  targetNamespace: &namespace database
  components:
    - ../../../../../components/kopiur/pvc
  interval: 30m
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: rook-ceph
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: system
    - name: external-secrets
      namespace: security
  # Workload health signal only. wait stays unset (false): Flux honours healthChecks only then (wait:true assesses the whole inventory instead).
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: pgadmin
      namespace: *namespace
  path: ./kubernetes/apps/base/database/cloudnative-pg/pgadmin
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 2Gi
      # Cache stays at the 2Gi default, which clears this snapshot.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgadmin-kopiur
spec:
  targetNamespace: database
  interval: 30m
  path: "./kubernetes/components/kopiur/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # kopiur-repository, not kopiur: it applies the `ceph` and `r2`
    # ClusterRepository objects these policies reference, and it already
    # dependsOn the operator. The admission webhook is failurePolicy: Fail, so
    # with the operator down the API server REJECTS these CRs outright.
    # Deliberately no dependsOn pgadmin - see header GREENFIELD ORDERING.
    - name: kopiur-repository
      namespace: system
  postBuild:
    substitute:
      APP: pgadmin
      KOPIUR_PUID: "5050"
      KOPIUR_PGID: "5050"
      KOPIUR_SCHEDULE_R2: "H 7 * * *"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Second, OFF-SITE copy of the postgres-18 barman archive (LAN MinIO -> R2).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postgres-offsite-mirror
spec:
  dependsOn:
    # Supplies `cloudnative-pg-secret`, whose aws-access-key-id /
    # aws-secret-access-key are the mirror's SOURCE (LAN MinIO) credentials.
    - name: cloudnative-pg
      namespace: database
    # The R2 half is an ExternalSecret, so ESO must be up for it to resolve.
    - name: external-secrets
      namespace: security
    - name: onepassword-store
      namespace: security
  interval: 30m
  path: ./kubernetes/apps/base/database/cloudnative-pg/offsite-mirror
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  postBuild:
    substitute:
      APP: *app
  # No healthChecks and no wait, matching the fleet's other CronJob-only
  # overlays (kubernetes/apps/main/system/pvc-writable-check.yaml): a CronJob
  # has no meaningful Ready condition, and the job's real health signal is a
  # successful run, which is offsite-mirror/prometheusrule.yaml's alert rather
  # than a Flux gate.
