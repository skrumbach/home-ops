---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app surrealdb
spec:
  targetNamespace: database
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/base/database/surrealdb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  dependsOn:
    - name: external-secrets
      namespace: security
    - name: onepassword-store
      namespace: security
  healthCheckExprs:
    - apiVersion: apps/v1
      kind: Deployment
      current: status.availableReplicas == status.replicas
  postBuild:
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Own Kustomization: the parent uses wait:true, and the standing Restore stays Ready=False until a rebuild.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: surrealdb-kopiur
spec:
  targetNamespace: &namespace database
  interval: 30m
  path: ./kubernetes/apps/base/database/surrealdb/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: surrealdb
      namespace: *namespace
  postBuild:
    substitute:
      APP: surrealdb
      KOPIUR_PUID: "65532"
      KOPIUR_PGID: "65532"
      # Namespace r2 hour (kubernetes/components/kopiur/README.md schedule
      # table).
      KOPIUR_SCHEDULE_R2: "H 7 * * *"
