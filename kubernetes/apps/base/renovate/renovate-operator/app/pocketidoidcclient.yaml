---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
# renovate-operator UI sign-in. Deleting this CR deletes the client in Pocket ID.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: renovate-operator
spec:
  name: Renovate
  # Must match auth.oidc.clientId in helmrelease.yaml. Immutable once created.
  clientID: renovate-operator
  # The cluster-generated value (externalsecret.yaml), which the HelmRelease reads from the same
  # Secret: the operator pushes it to Pocket ID and never generates or rotates one.
  # Same-namespace Secret.
  clientSecretRef:
    name: renovate-operator-oidc-client
    key: client-secret
  # A new value (see the ExternalSecret) leaves the old one valid this long, so sign-in keeps
  # working while the pod restarts with the new one.
  clientSecretOverlap: 1h
  # Path fixed by the operator: <route host>/auth/callback.
  callbackUrls: ["https://renovate.sklab.dev/auth/callback"]
  # The operator's logout sends the redirect URL cut before /auth/ as post_logout_redirect_uri.
  logoutCallbackUrls: ["https://renovate.sklab.dev"]
  # The operator sends an S256 challenge (chart auth.oidc.pkceEnabled defaults to true).
  pkceEnabled: true
  launchUrl: https://renovate.sklab.dev
  # authorization is off in the HelmRelease (every signed-in user is admin), so Pocket ID decides
  # who gets in.
  allowedUserGroups:
    - name: admins
      namespace: security
  logo:
    nameOverride: renovate
  # The app reads its credentials from renovate-operator-oidc-client; no copy is needed.
  secret:
    enabled: false
