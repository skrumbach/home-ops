---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: home-ops
spec:
  schedule: "0 * * * *"
  # Self-update stays a reviewed PR: autoMerge path rule on kubernetes/apps/base/renovate/**.
  image: ghcr.io/renovatebot/renovate:44.239.1@sha256:7dba1a3b916a2cf302ba0df458ddcc8fcbac3c92d0fe9882ac13ba0363de656b
  provider:
    name: github
  # Every repo the App installation can see. requireConfig=required skips repos
  # without a Renovate config, so unconfigured repos and forks stay untouched.
  discoveryFilters:
    - skrumbach/*
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  parallelism: 1
  renovateConfig:
    fileName: config.json
    inline: |
      {
        "onboarding": false,
        "requireConfig": "required",
        "internalChecksFilter": "strict",
        "platformCommit": "enabled",
        "configValidationError": true,
        "binarySource": "install",
        "gitNoVerify": ["commit", "push"]
      }
  extraEnv:
    - name: LOG_LEVEL
      value: info
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
