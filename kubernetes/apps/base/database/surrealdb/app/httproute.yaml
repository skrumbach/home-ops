---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app surrealdb
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Multi-model database
    gethomepage.dev/group: Platform
    gethomepage.dev/name: SurrealDB
    gethomepage.dev/app: *app
    gethomepage.dev/icon: surrealdb.svg
    # Check /health, not `/`: bare `/` redirects to a third-party surrealdb.com
    # page that Gatus follows.
    gatus.home-operations.com/endpoint: |-
      url: https://surrealdb.sklab.dev/health
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - "surrealdb.sklab.dev"
    - "sdb.sklab.dev"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: surrealdb
          namespace: database
          port: 8000
