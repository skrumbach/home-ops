---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app pgadmin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Platform
    gethomepage.dev/name: pgAdmin
    gethomepage.dev/pod-selector: app.kubernetes.io/name=pgadmin
    gethomepage.dev/icon: pgadmin.svg
    gethomepage.dev/siteMonitor: "https://pgadmin.sklab.dev"
    gethomepage.dev/description: PostgreSQL admin
    external-dns.kubernetes.io/target: "internal.sklab.dev"
    gatus.home-operations.com/endpoint: |-
      url: https://pgadmin.sklab.dev/misc/ping
      conditions:
        - "[STATUS] == 200"
      group: database
spec:
  hostnames:
    - "pgadmin.sklab.dev"
    - "pg.sklab.dev"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: pgadmin
          namespace: database
          port: 80
