---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret pgadmin-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      data:
        PGADMIN_DEFAULT_EMAIL: "{{ .PGADMIN_DEFAULT_EMAIL }}"
        PGADMIN_DEFAULT_PASSWORD: "{{ .PGADMIN_DEFAULT_PASSWORD }}"
        # Read only by pocketidoidcclient.yaml (clientSecretRef), which pushes it to Pocket ID: the
        # Pocket ID client shares the Authentik client's secret, so no new 1Password field exists.
        # Not mounted into the pod (persistence.oauth mounts config_local.py and pgpass only).
        POCKET_ID_CLIENT_SECRET: "{{ .PGADMIN_OATUH_CLIENT_SECRET }}"
        # Users are matched by email across both providers (username = email, auth_source oauth2).
        config_local.py: |-
          AUTHENTICATION_SOURCES = ['oauth2', 'internal']
          MASTER_PASSWORD_REQUIRED = False
          OAUTH2_AUTO_CREATE_USER = True
          OAUTH2_CONFIG = [{
              'OAUTH2_NAME': 'authentik',
              'OAUTH2_DISPLAY_NAME': 'authentik',
              'OAUTH2_CLIENT_ID': "{{ .PGADMIN_OATUH_CLIENT_ID }}",
              'OAUTH2_CLIENT_SECRET': "{{ .PGADMIN_OATUH_CLIENT_SECRET }}",
              'OAUTH2_TOKEN_URL': 'https://auth.sklab.dev/application/o/token/',
              'OAUTH2_AUTHORIZATION_URL': 'https://auth.sklab.dev/application/o/authorize/',
              'OAUTH2_USERINFO_ENDPOINT': 'https://auth.sklab.dev/application/o/userinfo/',
              'OAUTH2_SERVER_METADATA_URL': 'https://auth.sklab.dev/application/o/pg-admin/.well-known/openid-configuration',
              'OAUTH2_API_BASE_URL': 'https://auth.sklab.dev/',
              'OAUTH2_SCOPE': 'openid email profile',
              'OAUTH2_BUTTON_COLOR': '#5E93D9',
              'OAUTH2_ICON': 'lock'
          }, {
              # Client: pocketidoidcclient.yaml (client ID pgadmin, admins group only).
              'OAUTH2_NAME': 'pocket-id',
              'OAUTH2_DISPLAY_NAME': 'Pocket ID',
              'OAUTH2_CLIENT_ID': 'pgadmin',
              'OAUTH2_CLIENT_SECRET': "{{ .PGADMIN_OATUH_CLIENT_SECRET }}",
              'OAUTH2_TOKEN_URL': 'https://id.sklab.dev/api/oidc/token',
              'OAUTH2_AUTHORIZATION_URL': 'https://id.sklab.dev/authorize',
              'OAUTH2_USERINFO_ENDPOINT': 'https://id.sklab.dev/api/oidc/userinfo',
              'OAUTH2_SERVER_METADATA_URL': 'https://id.sklab.dev/.well-known/openid-configuration',
              'OAUTH2_API_BASE_URL': 'https://id.sklab.dev/',
              'OAUTH2_SCOPE': 'openid email profile',
              # pgAdmin sends PKCE only when both keys are set; the client sets pkceEnabled.
              'OAUTH2_CHALLENGE_METHOD': 'S256',
              'OAUTH2_RESPONSE_TYPE': 'code',
              'OAUTH2_BUTTON_COLOR': '#5E93D9',
              'OAUTH2_ICON': 'lock'
          }]
        pgpass: |
          postgres-18-rw.database.svc.cluster.local:5432:postgres:postgres:{{.POSTGRES_SUPER_PASS }}
  dataFrom:
    - extract:
        key: cloudnative-pg
