---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/_definitions.json#/definitions/io.k8s.api.core.v1.Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-18-lb
  annotations:
    external-dns.kubernetes.io/hostname: "postgres-18.sklab.dev"
spec:
  type: LoadBalancer
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres-18
    cnpg.io/instanceRole: primary
