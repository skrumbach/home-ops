---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Only rule `app` (the browser UI) is gated, with Pocket ID at Envoy (native OIDC). Rule `api`
# (/api) stays open to Linkwarden's own access-token and session auth: the browser extension and
# mobile app cannot follow an SSO redirect. /oauth2/callback and /oauth2/logout fall in rule `app`
# (PathPrefix /), so the sign-in round trip works on a rule-level policy.
# A policy that fails to translate (e.g. the operator has not written linkwarden-oidc-credentials
# yet) makes the route answer 500, not pass through; a policy whose targetRef matches no route
# leaves that route open.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: linkwarden-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: linkwarden
      sectionName: app
  oidc:
    provider:
      issuer: https://id.sklab.dev
      # Explicit endpoints skip discovery: without them the Envoy Gateway controller fetches
      # the issuer's openid-configuration on every translation, and a failed fetch turns the
      # route into a 500 until the next one.
      authorizationEndpoint: https://id.sklab.dev/authorize
      tokenEndpoint: https://id.sklab.dev/api/oidc/token
      endSessionEndpoint: https://id.sklab.dev/api/oidc/end-session
    # Both from the Secret pocketidoidcclient.yaml generates.
    clientIDRef:
      name: linkwarden-oidc-credentials
    clientSecret:
      name: linkwarden-oidc-credentials
    redirectURL: https://links.sklab.dev/oauth2/callback
    logoutPath: /oauth2/logout
