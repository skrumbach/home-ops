---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app linkwarden
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: linkwarden
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      linkwarden:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46
            env:
              NEXT_SHARP_PATH: /data/node_modules/sharp
              NEXTAUTH_URL: "https://links.sklab.dev"
              NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
              NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
              # Full-page Monolith archive: raise output buffer above the 100MB
              # default (one image-heavy page overflowed it -> partial archive).
              MONOLITH_MAX_BUFFER: "256"
              # AI auto-tagging via LiteLLM with Linkwarden's own virtual key (OPENAI_API_KEY from
              # the secret; chat-local only, rpm 30). chat-local is the local B70 llama.cpp and a
              # terminal alias with no cloud fallback: when the B70 is down tagging just fails.
              CUSTOM_OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              OPENAI_MODEL: "chat-local"
            securityContext:
              allowPrivilegeEscalation: false
              # Playwright launches Chromium with --no-sandbox by default (chromiumSandbox
              # defaults to false), so no setuid sandbox helper or extra capability is needed.
              capabilities:
                drop:
                  - ALL
            envFrom:
              - secretRef:
                  name: linkwarden-secret
            ports:
              - name: http
                containerPort: &port 3000
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 4Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30

    defaultPodOptions:
      # `affinity` NotIn talos-3 is not needed: the talos-3 PreferNoSchedule taint (no toleration here)
      # keeps this app off it via the TaintToleration score.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: linkwarden
        ports:
          http:
            port: *port

    persistence:
      data:
        enabled: true
        existingClaim: ${KOPIUR_CLAIM:-linkwarden}
        globalMounts:
          - path: /data/data
      next-cache:
        type: emptyDir
        globalMounts:
          - path: /data/apps/web/.next/cache

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Apps
          gethomepage.dev/name: Linkwarden
          gethomepage.dev/icon: sh-linkwarden.svg
          gethomepage.dev/description: Bookmarks and page archives
          # Goes through the ungated `api` rule: /api/v1/logins answers unauthenticated with a
          # Linkwarden body field the Pocket ID sign-in page cannot match, and proves /api still
          # bypasses the Envoy OIDC gate.
          gatus.home-operations.com/endpoint: |-
            url: https://links.sklab.dev/api/v1/logins
            conditions:
              - "[STATUS] == 200"
              - "has([BODY].credentialsEnabled) == true"
            group: selfhosted
        hostnames:
          - "links.sklab.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        # Rule names are load-bearing: securitypolicy.yaml gates rule `app` only.
        rules:
          - name: api
            matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - name: linkwarden
                namespace: selfhosted
                port: *port
          - name: app
            backendRefs:
              - name: linkwarden
                namespace: selfhosted
                port: *port
