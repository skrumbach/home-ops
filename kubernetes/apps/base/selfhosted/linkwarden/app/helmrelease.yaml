---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app linkwarden
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: linkwarden
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      linkwarden:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46
            env:
              NEXT_SHARP_PATH: /data/node_modules/sharp
              # Must end in /api/v1/auth, where Linkwarden mounts next-auth (its .env.sample and the
              # SessionProvider basePath). next-auth builds the OIDC redirect_uri from this value, and
              # a bare origin gives /api/auth/callback/oidc, which Linkwarden does not serve. Password
              # sign-in never used the server-side URL, so it kept working with the bare origin.
              NEXTAUTH_URL: "https://links.sklab.dev/api/v1/auth"
              NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
              # Break-glass password form beside the Pocket ID button. Can go ("false") once the
              # owner has signed in through Pocket ID and the account is linked.
              NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
              # Linkwarden's own sign-in with Pocket ID (pocketidoidcclient-app.yaml). First sign-in links an existing local account only when the email matches
              # exactly and Pocket ID sends email_verified=true (ssoEmailVerified.ts); an account
              # whose email is not yet verified in Linkwarden also loses its password then, while a
              # verified one keeps it. An email with no local account creates a new empty account.
              # DISABLE_NEW_SSO_USERS stays unset on purpose: it refuses any identity with no
              # linked Account row, which includes that first sign-in of the existing account (the
              # check runs before the link). It can be set once the owner is linked.
              # A local account with no e-mail cannot be linked on first Pocket ID sign-in: next-auth
              # then tries to create a new user whose username collides (`Unique constraint failed on
              # the fields: (username)`). The local account's `email` must equal the Pocket ID e-mail
              # first, and with mail disabled Linkwarden has no UI or API to set it, only the database.
              NEXT_PUBLIC_OIDC_ENABLED: "true"
              OIDC_CUSTOM_NAME: Pocket ID
              OIDC_WELLKNOWN_URL: https://id.sklab.dev/.well-known/openid-configuration
              # Pocket ID releases email and email_verified with the email scope, so the default
              # "openid email profile" is enough; no groups claim is read.
              OIDC_SCOPES: openid email profile
              # Both from the Secret pocketidoidcclient-app.yaml generates (the pod waits for it).
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-app-oidc-credentials
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-app-oidc-credentials
                    key: client-secret
              # Full-page Monolith archive: raise output buffer above the 100MB
              # default (one image-heavy page overflowed it -> partial archive).
              MONOLITH_MAX_BUFFER: "256"
              # AI auto-tagging via LiteLLM with Linkwarden's own virtual key (OPENAI_API_KEY from
              # the secret; chat-local only, rpm 30). chat-local is the local B70 llama.cpp and a
              # terminal alias with no cloud fallback: when the B70 is down tagging just fails.
              CUSTOM_OPENAI_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              OPENAI_MODEL: "chat-local"
            securityContext:
              allowPrivilegeEscalation: false
              # Playwright launches Chromium with --no-sandbox by default (chromiumSandbox
              # defaults to false), so no setuid sandbox helper or extra capability is needed.
              capabilities:
                drop:
                  - ALL
            envFrom:
              - secretRef:
                  name: linkwarden-secret
            ports:
              - name: http
                containerPort: &port 3000
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 4Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30

    defaultPodOptions:
      # `affinity` NotIn talos-3 is not needed: the talos-3 PreferNoSchedule taint (no toleration here)
      # keeps this app off it via the TaintToleration score.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: linkwarden
        ports:
          http:
            port: *port

    persistence:
      data:
        enabled: true
        existingClaim: ${KOPIUR_CLAIM:-linkwarden}
        globalMounts:
          - path: /data/data
      next-cache:
        type: emptyDir
        globalMounts:
          - path: /data/apps/web/.next/cache

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Apps
          gethomepage.dev/name: Linkwarden
          gethomepage.dev/href: "https://links.sklab.dev"
          gethomepage.dev/icon: sh-linkwarden.svg
          gethomepage.dev/description: Bookmarks and page archives
          # /api/v1/logins answers unauthenticated with a body field (credentialsEnabled) that
          # proves Linkwarden itself is up, not just a sign-in page.
          gatus.home-operations.com/endpoint: |-
            url: https://links.sklab.dev/api/v1/logins
            conditions:
              - "[STATUS] == 200"
              - "has([BODY].credentialsEnabled) == true"
            group: selfhosted
        hostnames:
          - "links.sklab.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: linkwarden
                namespace: selfhosted
                port: *port
