---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
# Linkwarden's own sign-in (generic OIDC provider `oidc`, OIDC_* in helmrelease.yaml), the only
# sign-in on the route. The operator generates the client ID and secret and writes them to Secret `linkwarden-app-oidc-credentials`, which the
# HelmRelease reads directly. Deleting this CR deletes the client in Pocket ID; a re-created client
# has a new secret and Linkwarden only picks it up on its next restart (reloader does that).
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: linkwarden-app
spec:
  name: Linkwarden (app)
  launchUrl: https://links.sklab.dev
  # next-auth builds <NEXTAUTH_URL>/callback/<provider id>, and NEXTAUTH_URL ends in /api/v1/auth.
  callbackUrls: ["https://links.sklab.dev/api/v1/auth/callback/oidc"]
  # No logoutCallbackUrls: Linkwarden's sign-out ends only its own session.
  # genericOidc() sets checks: ["pkce", "state"], so next-auth sends an S256 challenge.
  pkceEnabled: true
  # Linkwarden has no group check; this stops everyone outside admins at Pocket ID.
  allowedUserGroups:
    - name: admins
      namespace: security
  logo:
    autoGenerate: false
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
