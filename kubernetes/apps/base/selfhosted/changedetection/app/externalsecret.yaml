---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Generated once and never refreshed, so the token is stable across ESO refreshes. Deleting this ExternalSecret mints a
# new token; both containers then need a pod restart to pick it up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name changedetection-browser-token
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: *name
