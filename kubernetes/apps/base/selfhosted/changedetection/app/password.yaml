---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Shared secret between the main container (PLAYWRIGHT_DRIVER_URL) and the browser sidecar (TOKEN).
# Alphanumeric only: it travels in a WebSocket query string.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: changedetection-browser-token
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - BROWSER_TOKEN
