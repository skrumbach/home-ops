---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app changedetection
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: changedetection
  maxHistory: 3
  install:
    remediation:
      retries: 3
  values:
    # Identity is declared pod-level like the rest of the fleet; `browser` (browserless/chrome) overrides
    # back to its image's `blessuser` uid 999 (see below). This does NOT earn kopiur's
    # `SecurityContextCompatible` condition: it needs the mover uid to match every container of every pod
    # mounting the claim, and the 999 sidecar suppresses it. The condition is positive-only (absence is not
    # a failure); a whole-volume kopia read is the proof. See `components/kopiur/README.md`.
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.70.3@sha256:47b1e9cc3eff820e6022b655e3fcc948625f60c1770ae8b9c30aa3bf104dc255
            # Identity 1000:1000 (from defaultPodOptions) is measured: the image default is root, every file and
            # setgid directory under /datastore is already group 1000, and it is kopiur's fleet default, so no
            # KOPIUR_PUID/PGID override is needed.
            # List form, not map: $(BROWSER_TOKEN) expands only when BROWSER_TOKEN is defined earlier in this list.
            env:
              - name: BROWSER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: changedetection-browser-token
                    key: BROWSER_TOKEN
              - {name: PORT, value: "5000"}
              - {name: USE_X_SETTINGS, value: "1"}
              # Apprise notification URLs carry credentials and are logged at INFO.
              - {name: LOGGER_LEVEL, value: WARNING}
              - {name: BASE_URL, value: "https://changedetection.${SECRET_DOMAIN}"}
              # The browser sidecar's DevTools socket is token-gated (TOKEN on `browser`); port 3000 is not in the Service.
              - name: PLAYWRIGHT_DRIVER_URL
                value: "ws://localhost:3000/?stealth=1&--disable-web-security=true&--user-data-dir=~/browserless-cache-123&token=$(BROWSER_TOKEN)"
            securityContext:
              allowPrivilegeEscalation: false
              # Writes Python bytecode and temp files outside /datastore.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          browser:
            image:
              repository: docker.io/browserless/chrome
              tag: latest@sha256:57d19e414d9fe4ae9d2ab12ba768c97f38d51246c5b31af55a009205c136012f
              pullPolicy: IfNotPresent
            # Overrides the pod-level 1000:1000 back to the image's `blessuser` (999): at uid 1000 Chrome fails to
            # launch (`chrome_crashpad_handler: --database is required`) while the container still reports Ready,
            # silently breaking every browser-backed watch. It mounts no PVC, so the backup identity is unaffected.
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              # Chrome writes its profile and crash data under the root filesystem.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            env:
              # Same Secret as main's BROWSER_TOKEN. Both containers read it at start, so a rotated Secret needs a pod restart.
              - name: TOKEN
                valueFrom:
                  secretKeyRef:
                    name: changedetection-browser-token
                    key: BROWSER_TOKEN
              - {name: SCREEN_WIDTH, value: "1920"}
              - {name: SCREEN_HEIGHT, value: "1024"}
              - {name: SCREEN_DEPTH, value: "16"}
              - {name: ENABLE_DEBUGGER, value: "false"}
              - {name: PREBOOT_CHROME, value: "true"}
              - {name: CONNECTION_TIMEOUT, value: "300000"}
              - {name: MAX_CONCURRENT_SESSIONS, value: "10"}
              - {name: CHROME_REFRESH_TIME, value: "600000"}
              - {name: DEFAULT_BLOCK_ADS, value: "true"}
              - {name: DEFAULT_STEALTH, value: "true"}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      main:
        ports:
          http:
            port: 5000
    route:
      internal:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Apps
          gethomepage.dev/name: Changedetection
          gethomepage.dev/icon: changedetection.svg
          gethomepage.dev/description: Web page change alerts
          # securitypolicy.yaml gates this route, so a route check would measure the Authentik
          # login page. Probe the Service in-cluster instead.
          gatus.home-operations.com/endpoint: |-
            url: http://changedetection.selfhosted.svc.cluster.local:5000/
            conditions:
              - "[STATUS] == 200"
            group: selfhosted
            ui:
              hide-url: true
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: 5000
    persistence:
      config:
        enabled: true
        # No `:-default`: an undefined KOPIUR_CLAIM renders an EMPTY existingClaim.
        existingClaim: "${KOPIUR_CLAIM}"
        advancedMounts:
          main:
            main:
              - path: /datastore
