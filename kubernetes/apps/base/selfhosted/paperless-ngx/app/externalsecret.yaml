---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-ngx-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
        PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
        # Paperless' own LiteLLM virtual key (CR `paperless-ngx` in ai/litellm, PushSecret-written item
        # litellm-consumer-paperless-ngx): chat-local and embedding-local only, rate-limited. Embeddings
        # reuse it (PAPERLESS_AI_LLM_EMBEDDING_API_KEY unset).
        PAPERLESS_AI_LLM_API_KEY: "{{ .LITELLM_PAPERLESS_API_KEY }}"
        # Pocket ID SSO (django-allauth openid_connect), the only provider since 2026-11-13. The client
        # is pocketidoidcclient.yaml; provider_id "pocket-id" is part of its callback URL, change both
        # together. The secret is the 1Password value paperless-oidc, which the operator pushes to
        # Pocket ID. An account linked to the removed "authentik" provider keeps working by password
        # and is linked to Pocket ID under Profile > Connect.
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
          {"openid_connect": {"OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "pocket-id",
          "name": "Pocket ID", "client_id": "paperless",
          "secret": "{{ .PAPERLESS_OIDC_CLIENT_SECRET }}", "settings": {"server_url":
          "https://id.sklab.dev/.well-known/openid-configuration"}}]}}
        # Read only by pocketidoidcclient.yaml (clientSecretRef), which pushes it to Pocket ID. Not a
        # Paperless setting (envFrom also hands it to the container, which ignores it).
        POCKET_ID_CLIENT_SECRET: "{{ .PAPERLESS_OIDC_CLIENT_SECRET }}"

        # postgres-18-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        # Role and database come from components/cnpg-database.
        PAPERLESS_DBHOST: "postgres-18-rw.database.svc.cluster.local"
        PAPERLESS_DBNAME: "{{ .POSTGRES_DB_NAME }}"
        PAPERLESS_DBUSER: "{{ .POSTGRES_DB_USER_NAME }}"
        PAPERLESS_DBPASS: "{{ .POSTGRES_DB_USER_PASSWORD }}"
  data:
    - secretKey: PAPERLESS_OIDC_CLIENT_SECRET
      remoteRef:
        key: paperless-oidc
        property: client-secret
    - secretKey: LITELLM_PAPERLESS_API_KEY
      remoteRef:
        key: litellm-consumer-paperless-ngx
        property: key
  dataFrom:
    - extract:
        key: paperless-ngx
