---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-ngx-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
        PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
        # Paperless' own LiteLLM virtual key (CR `paperless-ngx` in ai/litellm, PushSecret-written item
        # litellm-consumer-paperless-ngx): chat-local and embedding-local only, rate-limited. Embeddings
        # reuse it (PAPERLESS_AI_LLM_EMBEDDING_API_KEY unset). Skill `litellm-proxy`.
        PAPERLESS_AI_LLM_API_KEY: "{{ .LITELLM_PAPERLESS_API_KEY }}"

        # postgres-18-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        # Role and database come from components/cnpg-database. Skill `databases`.
        PAPERLESS_DBHOST: "postgres-18-rw.database.svc.cluster.local"
        PAPERLESS_DBNAME: "{{ .POSTGRES_DB_NAME }}"
        PAPERLESS_DBUSER: "{{ .POSTGRES_DB_USER_NAME }}"
        PAPERLESS_DBPASS: "{{ .POSTGRES_DB_USER_PASSWORD }}"
  data:
    - secretKey: LITELLM_PAPERLESS_API_KEY
      remoteRef:
        key: litellm-consumer-paperless-ngx
        property: key
  dataFrom:
    - extract:
        key: paperless-ngx
