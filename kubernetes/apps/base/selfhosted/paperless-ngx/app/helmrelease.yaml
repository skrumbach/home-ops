---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-ngx
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless-ngx
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      paperless-ngx:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
            env:
              PAPERLESS_URL: "https://docs.sklab.dev"
              PAPERLESS_PORT: &port 8000
              PAPERLESS_TIME_ZONE: America/New_York
              PAPERLESS_REDIS: "redis://paperless-ngx-dragonfly.selfhosted.svc.cluster.local:6379"
              # ~40% of the library is German (272 of 688 text documents, 2026-11-08); both ship in the image.
              PAPERLESS_OCR_LANGUAGE: deu+eng
              # A PDF/A archive for every document, as the pre-2026 instance had (761 of 792); the default
              # `auto` skips born-digital PDFs.
              PAPERLESS_ARCHIVE_FILE_GENERATION: always
              # dateparser codes, not tesseract ones. Order stays the DMY default: right for German dates; US
              # numeric dates (11/08/2026) can misparse, and the AI created-date suggestion corrects them.
              PAPERLESS_DATE_PARSER_LANGUAGES: de+en
              # Readable layout on disk for new files; existing files move only with `document_renamer`. app-template
              # runs values through Helm tpl, so the Paperless placeholders are wrapped in a raw string.
              PAPERLESS_FILENAME_FORMAT: "{{`{{ created_year }}/{{ correspondent }}/{{ title }}`}}"
              PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
              # E-mail and re-scans re-deliver the same file; drop exact duplicates instead of failing them.
              PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
              # .eml archive: text part first, HTML as fallback.
              PAPERLESS_EMAIL_PARSE_DEFAULT_LAYOUT: "1"
              # Consumer (polling required on Ceph -- no inotify support)
              PAPERLESS_CONSUMER_POLLING: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              PAPERLESS_TASK_WORKERS: "2"
              # Unset, Paperless sizes OCR threads from the node's 20 cores, not the 2 CPU limit: ~20 parallel
              # tesseract jobs OOMKilled the pod at 2Gi during the 792-document re-import (2026-11-08).
              PAPERLESS_THREADS_PER_WORKER: "1"
              # AI suggestions, document chat and RAG on the local models through LiteLLM, with Paperless'
              # own key (PAPERLESS_AI_LLM_API_KEY from paperless-ngx-secret). Role aliases only, never a real
              # model name (kubernetes/apps/base/ai/AGENTS.md).
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_BACKEND: openai-like
              PAPERLESS_AI_LLM_ENDPOINT: "http://litellm.ai.svc.cluster.local:4000/v1"
              PAPERLESS_AI_LLM_MODEL: chat-local
              # Suggestions in English so they match the English tag and type names, also for German
              # documents.
              PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: English
              # The local chat model can think before answering; the 120s default is too short for it.
              PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "300"
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: openai-like
              PAPERLESS_AI_LLM_EMBEDDING_MODEL: embedding-local
              # embedding-local is a 512-token llama-server context; over-length input fails the whole document's
              # embedding ("Context size has been exceeded"). Paperless counts chunk tokens with a different
              # tokenizer than Qwen and llama-index prepends document metadata, so 384 still overflowed ~1 in 20
              # documents (2026-11-08); 256 leaves the margin.
              PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE: "256"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              # Pocket ID SSO (django-allauth openid_connect), the only provider. SSO users are signed up
              # on first login with no permissions; grant them in Paperless. The password form stays as
              # break-glass until the admin account is linked (Profile > Connect).
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              # The client secret, generated in the cluster (externalsecret-oidc.yaml);
              # pocketidoidcclient.yaml pushes the same value to Pocket ID.
              PAPERLESS_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-oidc-client
                    key: client-secret
              # The kubelet fills $(PAPERLESS_OIDC_CLIENT_SECRET) in, which only works for a variable
              # listed before this one (dependsOn orders them). provider_id "pocket-id" is part of the
              # client's callback URL: change both together.
              PAPERLESS_SOCIALACCOUNT_PROVIDERS:
                value: >-
                  {"openid_connect": {"OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "pocket-id",
                  "name": "Pocket ID", "client_id": "paperless",
                  "secret": "$(PAPERLESS_OIDC_CLIENT_SECRET)", "settings": {"server_url":
                  "https://id.sklab.dev/.well-known/openid-configuration"}}]}}
                dependsOn: PAPERLESS_OIDC_CLIENT_SECRET
              PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
              # Office documents (.docx/.xlsx/.doc/.odt/.rtf) and e-mail (.eml) go through the tika and
              # gotenberg sidecars below, over localhost (no Service, no network policy change).
              PAPERLESS_TIKA_ENABLED: "true"
              PAPERLESS_TIKA_ENDPOINT: "http://localhost:9998"
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: "http://localhost:3000"
            envFrom:
              - secretRef:
                  name: paperless-ngx-secret
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: 2000m
                memory: 4Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60

          # Majors follow what paperless-ngx 3.4.2's own compose files pin (gotenberg 8.38, tika 3.3.x).
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: 8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
            # args, not command: keeps the image's tini entrypoint. Flags from paperless' compose: the
            # chromium route renders .eml, so no JavaScript and no fetching of remote content.
            args:
              - gotenberg
              - --chromium-disable-javascript=true
              - --chromium-allow-list=file:///tmp/.*
            securityContext:
              # The image's `gotenberg` user; its HOME holds the chromium and LibreOffice profiles.
              runAsUser: 1001
              runAsGroup: 1001
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &gotenberg-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *gotenberg-probes

          tika:
            image:
              repository: docker.io/apache/tika
              tag: 3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
            securityContext:
              # The image's USER.
              runAsUser: 35002
              runAsGroup: 35002
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &tika-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /tika
                    port: 9998
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *tika-probes

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: paperless-ngx
        ports:
          http:
            port: *port

    persistence:
      data:
        enabled: true
        existingClaim: ${KOPIUR_CLAIM:-paperless-ngx}
        # Only `app` mounts the volumes: paperless reaches tika and gotenberg over
        # HTTP, and tika (uid 35002) cannot write them, which fails pvc-writable-check.
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/data
      media:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: ceph-block
        retain: true
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/media
      consume:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ceph-block
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/consume

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Apps
          gethomepage.dev/name: Paperless-ngx
          gethomepage.dev/icon: sh-paperless-ngx-light.svg
          gethomepage.dev/description: Document archive
          # Goes through the ungated `api` rule: Paperless' own DRF 401 proves Django answers and
          # that /api still bypasses the Envoy OIDC gate (a gated path would end on the 200 Pocket ID
          # sign-in page).
          gatus.home-operations.com/endpoint: |-
            url: https://docs.sklab.dev/api/ui_settings/
            conditions:
              - "[STATUS] == 401"
              - "[BODY].detail == pat(*credentials*)"
            group: selfhosted
        hostnames:
          - "docs.sklab.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        # Rule names are load-bearing: securitypolicy.yaml gates rule `app` only.
        rules:
          - name: api
            matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - name: paperless-ngx
                namespace: selfhosted
                port: *port
          - name: app
            backendRefs:
              - name: paperless-ngx
                namespace: selfhosted
                port: *port
