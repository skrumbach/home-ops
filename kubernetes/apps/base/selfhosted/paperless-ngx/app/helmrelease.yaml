---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-ngx
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      paperless-ngx:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
            env:
              PAPERLESS_URL: "https://docs.${SECRET_DOMAIN}"
              PAPERLESS_PORT: &port 8000
              PAPERLESS_TIME_ZONE: Pacific/Auckland
              PAPERLESS_REDIS: "redis://paperless-ngx-dragonfly.selfhosted.svc.cluster.local:6379"
              PAPERLESS_OCR_LANGUAGE: eng
              # Consumer (polling required on Ceph -- no inotify support)
              PAPERLESS_CONSUMER_POLLING: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              PAPERLESS_TASK_WORKERS: "2"
              # Unset, Paperless sizes OCR threads from the node's 20 cores, not the 2 CPU limit: ~20 parallel
              # tesseract jobs OOMKilled the pod at 2Gi during the 792-document re-import (2026-11-08).
              PAPERLESS_THREADS_PER_WORKER: "1"
              # AI suggestions, document chat and RAG on the local models through LiteLLM, with Paperless'
              # own key (PAPERLESS_AI_LLM_API_KEY from paperless-ngx-secret). Role aliases only, never a real
              # model name (kubernetes/apps/base/ai/AGENTS.md).
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_BACKEND: openai-like
              PAPERLESS_AI_LLM_ENDPOINT: "http://litellm.ai.svc.cluster.local:4000/v1"
              PAPERLESS_AI_LLM_MODEL: chat-local
              # The local chat model can think before answering; the 120s default is too short for it.
              PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "300"
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: openai-like
              PAPERLESS_AI_LLM_EMBEDDING_MODEL: embedding-local
              # embedding-local is a 512-token llama-server context (over-length input is a 400). The 1024
              # default would fail every chunk; 384 leaves margin for tokenizer differences. Skill
              # b70-llm-serving.
              PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE: "384"
              PAPERLESS_WEBSERVER_WORKERS: "2"
            envFrom:
              - secretRef:
                  name: paperless-ngx-secret
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: 2000m
                memory: 4Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: paperless-ngx
        ports:
          http:
            port: *port

    persistence:
      data:
        enabled: true
        existingClaim: ${KOPIUR_CLAIM:-paperless-ngx}
        globalMounts:
          - path: /usr/src/paperless/data
      media:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: ceph-block
        globalMounts:
          - path: /usr/src/paperless/media
      consume:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ceph-block
        globalMounts:
          - path: /usr/src/paperless/consume

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/name: Paperless-ngx
          gethomepage.dev/icon: paperless-ngx.svg
          external-dns.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
          # Goes through the ungated `api` rule: Paperless' own DRF 401 proves Django answers and
          # that /api still bypasses Authentik (a gated path would end on a 200 login page).
          gatus.home-operations.com/endpoint: |-
            url: https://docs.${SECRET_DOMAIN}/api/ui_settings/
            conditions:
              - "[STATUS] == 401"
              - "[BODY].detail == pat(*credentials*)"
            group: selfhosted
        hostnames:
          - "docs.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        # Rule names are load-bearing: securitypolicy.yaml gates rule `app` only.
        rules:
          - name: api
            matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - name: paperless-ngx
                namespace: selfhosted
                port: *port
          - name: app
            backendRefs:
              - name: paperless-ngx
                namespace: selfhosted
                port: *port
