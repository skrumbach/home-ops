---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app playwright
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: playwright
  values:
    controllers:
      playwright:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.63.2@sha256:7611afcfc02e1040c2f0d03515d086e5be89eaf383e77a2370b690162040758a
            env:
              TZ: ${CONFIG_TIMEZONE}
              DATA_DIR: /config/
              ALLOW_GET: true
              SCREEN_WIDTH: 1920
              SCREEN_HEIGHT: 1080
              SCREEN_DEPTH: 24
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                gpu.intel.com/xe: 1
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - SYS_ADMIN
    # `selfhostedPodOptions` is not an app-template key, so Helm silently discarded this block and the
    # pod ran with an EMPTY securityContext (legal YAML, flate passes, HelmRelease green).
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      # browserless keeps no durable state (DATA_DIR held only `lost+found`; metrics go to the /tmp
      # emptyDir below), so there is no PVC and nothing to back up.
      config:
        type: emptyDir
        globalMounts:
          - path: /config/
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      dev-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      var-run:
        type: emptyDir
        globalMounts:
          - path: /var/run
    service:
      app:
        controller: *app
        ports:
          http:
            # No route on purpose: browserless has no token and runs as root with SYS_ADMIN, so a LAN
            # route let any device drive a browser inside the pod network. RSSHub uses this Service.
            port: 3000
