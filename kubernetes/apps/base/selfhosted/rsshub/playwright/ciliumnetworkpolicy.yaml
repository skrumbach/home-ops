---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: playwright
spec:
  # Ingress fence only. browserless runs headless Chrome as root with SYS_ADMIN and no access token,
  # so any pod that reaches :3000 can drive a browser. Only RSSHub may.
  # Egress stays open: the browser loads public pages for RSSHub routes.
  # No gateway rule: the HelmRelease has no HTTPRoute on purpose.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: playwright
      app.kubernetes.io/controller: playwright
  ingress:
    # kubelet probes come from the local host. None are set today; kept so one can be added.
    - fromEntities:
        - host
    # RSSHub (PUPPETEER_WS_ENDPOINT ws://playwright.selfhosted.svc.cluster.local:3000), the only caller.
    # The controller label keeps the operator-managed rsshub-dragonfly pods out.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: selfhosted
            app.kubernetes.io/name: rsshub
            app.kubernetes.io/controller: rsshub
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # DNS replies from CoreDNS. No toPorts on purpose: a reply lands on an ephemeral port, never 53.
    # reply traffic: cilium/cilium#47913, remove toPorts-free rule when fixed
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
