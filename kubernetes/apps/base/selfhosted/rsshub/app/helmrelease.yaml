---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rsshub
spec:
  interval: 1h
  maxHistory: 3
  chartRef:
    kind: OCIRepository
    name: rsshub
  values:
    controllers:
      rsshub:
        annotations:
          reloader.stakater.com/auto: 'true'
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/diygod/rsshub
              tag: latest@sha256:ba8cedbb60524eec64a824ce876f8ae4646096c93415f2c2843357998bac4c37
            env:
              NODE_ENV: production
              CACHE_TYPE: redis
              REDIS_URL: "redis://rsshub-dragonfly:6379"
              PUPPETEER_WS_ENDPOINT: "ws://playwright.selfhosted.svc.cluster.local:3000" # marked
              PORT: &port 80
              LISTEN_INADDR_ANY: 1
              LOG_LEVEL: warning
              NO_LOGFILES: true
              SENTRY: false
              PIXIV_IMG_PROXY: "https://i.yuki.sh"
              HOTLINK_TEMPLATE: "https://rsstt-img-relay-cqf.pages.dev/$${href_ue}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2048Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://rsshub.sklab.dev/healthz
            conditions: ["[STATUS] == 200"]
        hostnames: ["{{ .Release.Name }}.sklab.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
