---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Sized to the synced folders (Documents, Screenshots, Projects, camera-roll headroom) plus buffer.
      # allowVolumeExpansion permits growing later; a PVC cannot shrink.
      storage: 15Gi
  storageClassName: ceph-block
