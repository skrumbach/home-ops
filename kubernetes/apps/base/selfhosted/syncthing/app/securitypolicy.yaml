---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Gates the Syncthing web GUI route (the GUI keeps its own password as an inner layer). Device sync
# uses the `sync` LoadBalancer Service (22000 TCP/UDP), not this route, so pairing and transfers are
# unaffected. The forward_domain proxy provider covers every host, so no Authentik change is needed;
# the cross-namespace backendRef needs the selfhosted entry in security/allow-authentik-access.
# Skill authentik-terraform.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: syncthing-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: syncthing
  extAuth:
    headersToExtAuth:
      - cookie
      - authorization
      - x-forwarded-for
      - x-forwarded-host
      - x-forwarded-proto
      - x-forwarded-uri
    http:
      backendRefs:
        - name: ak-outpost-authentik-embedded-outpost
          namespace: security
          port: 9000
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - set-cookie
        - authorization
        - x-authentik-username
        - x-authentik-email
        - x-authentik-name
        - x-authentik-uid
