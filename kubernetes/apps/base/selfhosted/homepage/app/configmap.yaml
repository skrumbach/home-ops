---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
    - Media:
        - YouTube:
            - href: https://youtube.com/feed/subscriptions
        - Rumble:
            - href: https://rumble.com
    - Tech:
        - HackerNews:
            - href: https://news.ycombinator.com
        - Anandtech:
            - href: https://www.anandtech.com
        - Moronix:
            - href: https://www.phoronix.com
    - Social:
        - Kiwi:
            - href: https://kiwifarms.st
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    ingress: false # default, enable ingress
    traefik: false # enable traefik ingressRoute
    gateway: true
  services.yaml: |
    - Infrastructure:
        - UniFi:
            href: {{HOMEPAGE_VAR_UNIFI_HOST_URL}}
            icon: unifi.svg
            description: Network controller
            widget:
              type: unifi
              url: {{HOMEPAGE_VAR_UNIFI_HOST_URL}}
              key: {{HOMEPAGE_VAR_UNIFI_API_KEY}}
        - TrueNAS:
            href: https://nas.${SECRET_DOMAIN}
            icon: truenas.svg
            description: NAS storage
            widget:
              type: truenas
              url: https://nas.${SECRET_DOMAIN}
              key: {{HOMEPAGE_VAR_TRUENAS_TOKEN}}
              enablePools: true
              nasType: scale
  settings.yaml: |
    title: home-ops
    theme: dark
    color: slate
    # The look is resources/custom.css. It restyles the boxed header and the text
    # status badge, so headerStyle and statusStyle stay at these values.
    headerStyle: boxed
    useEqualHeights: true
    hideVersion: true
    # Group order on the page. Tiles join a group through the gethomepage.dev/group
    # annotation on their HTTPRoute; a group not listed here lands at the bottom.
    layout:
      Home Automation:
        style: row
        columns: 4
      Media:
        style: row
        columns: 4
      Downloads:
        style: row
        columns: 4
      AI:
        style: row
        columns: 4
      Apps:
        style: row
        columns: 4
      Platform:
        style: row
        columns: 4
      Observability:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
  widgets.yaml: |
    - resources:
        backend: kubernetes
        cpu: true
        expanded: true
        memory: true
    - search:
        provider: [brave, bing]
        focus: false
        target: _blank
    - kubernetes:
        cluster:
          cpu: true
          memory: true
          show: true
          showLabel: true
        nodes:
          cpu: true
          memory: true
          show: false
          showLabel: true
    - openmeteo:
        label: Home
        units: metric
        cache: 5
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
