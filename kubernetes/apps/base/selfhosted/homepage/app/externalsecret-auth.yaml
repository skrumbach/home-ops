---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Homepage's session signing key (HOMEPAGE_AUTH_SECRET, read through envFrom in helmrelease.yaml).
# Generated in the cluster, once: nothing is stored in 1Password and nothing rotates it. It only
# changes when this ExternalSecret or its Secret is deleted; every session is then signed out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homepage-auth-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Homepage refuses a secret under 32 characters; 64 alphanumerics.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: homepage-auth-secret
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - HOMEPAGE_AUTH_SECRET
