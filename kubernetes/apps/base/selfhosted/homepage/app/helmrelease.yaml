---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  chartRef:
    kind: OCIRepository
    name: homepage
  interval: 30m
  values:
    controllers:
      homepage:
        annotations:
          secret.reloader.stakater.com/reload: &secret homepage-secret
          configmap.reloader.stakater.com/reload: homepage-config,homepage-theme
        strategy: RollingUpdate
        serviceAccount:
          identifier: myServiceAccount
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
            env:
              - name: HOMEPAGE_ALLOWED_HOSTS
                value: homepage.${SECRET_DOMAIN}
              - name: TZ
                value: ${CONFIG_TIMEZONE}
            ports:
              - name: http
                containerPort: 3000
                protocol: TCP
            envFrom:
              - secretRef:
                  name: *secret
            securityContext:
              allowPrivilegeEscalation: false
              # Next.js writes its cache under the root filesystem.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                # v2.8.0 (Next.js 16) idles near 110Mi but was OOM-killed 7 times at
                # 256Mi on 2026-11-12, on page loads that query every tile at once.
                memory: 512Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 3000
                    path: /api/healthcheck
                    # Must match HOMEPAGE_ALLOWED_HOSTS or the probes are rejected.
                    httpHeaders:
                      - name: Host
                        value: homepage.${SECRET_DOMAIN}
                  initialDelaySeconds: 0
              readiness: *probes
              startup: *probes
    defaultPodOptions:
      # app-template v5 defaults automountServiceAccountToken to false; homepage's
      # Kubernetes integration (cluster widgets, pod-selector status) needs the token.
      automountServiceAccountToken: true
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000

    route:
      homepage:
        labels:
          app.kubernetes.io/name: *app
        annotations:
          gethomepage.dev/description: This dashboard
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Platform
          gethomepage.dev/icon: sh-homepage.svg
          gethomepage.dev/name: Homepage
          gatus.home-operations.com/endpoint: |-
            url: https://homepage.${SECRET_DOMAIN}/api/healthcheck
            conditions:
              - "[STATUS] == 200"
            group: selfhosted
        enabled: true
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                namespace: selfhosted
                port: 3000

    persistence:
      config:
        enabled: true
        type: configMap
        name: homepage-config
        globalMounts:
          - subPath: bookmarks.yaml
            path: /app/config/bookmarks.yaml
          - subPath: docker.yaml
            path: /app/config/docker.yaml
          - subPath: kubernetes.yaml
            path: /app/config/kubernetes.yaml
          - subPath: services.yaml
            path: /app/config/services.yaml
          - subPath: settings.yaml
            path: /app/config/settings.yaml
          - subPath: widgets.yaml
            path: /app/config/widgets.yaml
      theme:
        type: configMap
        name: homepage-theme
        globalMounts:
          - subPath: custom.css
            path: /app/config/custom.css
    serviceAccount:
      myServiceAccount: {}
