---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app excalidraw
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: excalidraw
  values:
    controllers:
      excalidraw:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/excalidraw/excalidraw
              tag: latest@sha256:4542f30bea392b833822d0e7db4fa2220e6706ca962c082add2665159fa91758
            env:
              NODE_ENV: production
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 5m
                memory: 10Mi
              limits:
                memory: 50Mi
        pod:
          # nodeTaintsPolicy: Honor only filters NoSchedule/NoExecute, and the talos-3 taint is PreferNoSchedule,
          # so talos-3 stays in the spread domains; the TaintToleration score keeps this workload off it.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 80
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Apps
          gethomepage.dev/name: Excalidraw
          gethomepage.dev/icon: excalidraw.svg
          gethomepage.dev/description: Whiteboard
          # securitypolicy.yaml gates this route, so a route check would measure the Pocket ID
          # sign-in page it redirects to. Probe the Service in-cluster instead.
          gatus.home-operations.com/endpoint: |-
            url: http://excalidraw.selfhosted.svc.cluster.local/
            conditions:
              - "[STATUS] == 200"
            group: selfhosted
            ui:
              hide-url: true
        hostnames: ["{{ .Release.Name }}.sklab.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
