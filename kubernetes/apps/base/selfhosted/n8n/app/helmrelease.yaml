---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: n8n
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 3.2.2@sha256:c5d94cb443ff3d7b3abd65927fd8c9af1281f026ebfed9b208cf8d0f6b199a94
            env:
              GENERIC_TIMEZONE: America/New_York
              N8N_PORT: &port 80
              N8N_HOST: &hostName "n8n.sklab.dev"
              WEBHOOK_URL: "https://n8n-webhook.sklab.dev/"
              N8N_PROXY_HOPS: 1
              N8N_LOG_LEVEL: info
              N8N_LOG_OUTPUT: console

              N8N_PERSONALIZATION_ENABLED: false
              N8N_VERSION_NOTIFICATIONS_ENABLED: false
              N8N_DIAGNOSTICS_ENABLED: false
              N8N_HIRING_BANNER_ENABLED: false
              N8N_RUNNERS_ENABLED: true

              DB_SQLITE_VACUUM_ON_STARTUP: true
              EXECUTIONS_DATA_PRUNE: true
              # EXECUTIONS_DATA_MAX_AGE is in HOURS: 168 = 7 days.
              EXECUTIONS_DATA_MAX_AGE: 168
              EXECUTIONS_DATA_PRUNE_MAX_COUNT: 50000
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
              N8N_PROTOCOL: "https"

              N8N_PUBLIC_API_DISABLED: false
              N8N_PUBLIC_API_SWAGGERUI_DISABLED: true
              NODE_FUNCTION_ALLOW_BUILTIN: "*"
              N8N_METRICS: true
              N8N_USER_FOLDER: /config
              N8N_EMAIL_MODE: smtp

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            envFrom:
              - secretRef:
                  name: n8n-secret
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                memory: 1000Mi
            probes:
              # /healthz cannot fail, so liveness stays there. Readiness and
              # Gatus use /healthz/readiness. A DB-aware liveness probe would
              # restart the pod on every CNPG switchover.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: false

    defaultPodOptions:
      # `affinity` NotIn talos-3 is not needed: the talos-3 PreferNoSchedule taint (no toleration here)
      # keeps this app off it via the TaintToleration score.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: n8n
        ports:
          http:
            port: *port

    persistence:
      config:
        enabled: true
        existingClaim: ${KOPIUR_CLAIM:-n8n}

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Apps
          gethomepage.dev/name: n8n
          gethomepage.dev/icon: n8n.svg
          gethomepage.dev/description: Workflow automation
          gethomepage.dev/pod-selector: app.kubernetes.io/name=n8n
          # /healthz/readiness, NOT /healthz: /healthz is an unconditional 200 upstream and stayed green
          # through a database outage. See the probes block above.
          gatus.home-operations.com/endpoint: |-
            url: https://n8n.sklab.dev/healthz/readiness
            conditions:
              - "[STATUS] == 200"
            group: selfhosted
        hostnames:
          - "n8n.sklab.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: n8n
                namespace: selfhosted
                port: *port
      webhooks:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Apps
          gethomepage.dev/description: Inbound webhook endpoint
          gethomepage.dev/name: n8n Webhook
          gethomepage.dev/icon: "mdi-webhook-#22D8F0"
          gethomepage.dev/pod-selector: app.kubernetes.io/name=n8n
          gatus.home-operations.com/endpoint: |-
            url: https://n8n-webhook.sklab.dev/webhook/any
            conditions:
              - "[STATUS] == 404"
              - "[BODY].code == 404"
            group: selfhosted
        hostnames:
          - "n8n-webhook.sklab.dev"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /webhook
            backendRefs:
              - name: n8n
                port: 80
          - matches:
              - path:
                  type: PathPrefix
                  value: /rest/oauth2-credential
            backendRefs:
              - name: n8n
                port: 80
