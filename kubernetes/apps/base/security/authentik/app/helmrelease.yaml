---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: authentik
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 2026.8.5
  url: oci://ghcr.io/goauthentik/helm-charts/authentik
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  # Opts out of the cluster-apps HelmRelease defaults (kubernetes/clusters/main/apps.yaml),
  # so install/upgrade below are the whole policy. Migrations are one-way: a rollback runs
  # the old server on the migrated schema. A failed upgrade stalls for a human (no retry,
  # no rollback). Skill `authentik-terraform` upgrade-checklist.md.
  labels:
    home-ops.io/helm-remediation: manual
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 30m
  timeout: 20m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
    timeout: 20m
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    strategy:
      name: RemediateOnFailure
    timeout: 20m
    cleanupOnFail: true
    remediation:
      retries: 0
      remediateLastFailure: false
  values:
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: &secret authentik-secret
      env:
        - name: AUTHENTIK_STORAGE__MEDIA__BACKEND
          value: s3
        - name: AUTHENTIK_STORAGE__MEDIA__S3__USE_SSL
          value: "false"
        - name: AUTHENTIK_STORAGE__MEDIA__S3__SECURE_URLS
          value: "false"
        - name: AUTHENTIK_STORAGE__MEDIA__S3__ENDPOINT
          value: http://$(BUCKET_HOST)
        - name: AUTHENTIK_STORAGE__MEDIA__S3__ACCESS_KEY
          value: $(AWS_ACCESS_KEY_ID)
        - name: AUTHENTIK_STORAGE__MEDIA__S3__SECRET_KEY
          value: $(AWS_SECRET_ACCESS_KEY)
        - name: AUTHENTIK_STORAGE__MEDIA__S3__BUCKET_NAME
          value: $(BUCKET_NAME)
        - name: AUTHENTIK_STORAGE__MEDIA__S3__CUSTOM_DOMAIN
          value: $(BUCKET_HOST):$(BUCKET_PORT)/$(BUCKET_NAME)
        - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
          value: "false"
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
      envFrom:
        - configMapRef:
            name: authentik-media
        - secretRef:
            name: authentik-media
        - secretRef:
            name: *secret
      resources:
        requests:
          cpu: 50m
          memory: 500Mi
        limits:
          memory: 800Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    worker:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 500Mi
        limits:
          memory: 1200Mi
    authentik:
      log_level: info
      redis:
        host: authentik-dragonfly.security.svc.cluster.local
      session_storage: db
      web:
        # AUTHENTIK_WEB__BASE_URL seeds the Base URL system setting only while it is empty; 2026.11 refuses to start without one. Skill `authentik-terraform`.
        base_url: https://auth.${SECRET_DOMAIN}
      worker:
        # Replaces the deprecated worker.concurrency (1:1: Dramatiq threads per worker process; processes stays at its default of 1).
        threads: 4
    prometheus:
      rules:
        # Leave the chart rule bundle enabled. rules.enabled is all-or-nothing, and disabling it drops the rules that do fire. Several shipped rules name metrics this server does not emit; they cannot false-fire.
        # PendingMigrations and FailedSystemTasks are not expressible from the live series. Skill `observability`.
        enabled: true
    server:
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
