---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Authentik's clean_expired_models deletes expired Sessions and channels Messages one row at a time
# inside a 10 minute task limit. Once it falls behind it never catches up: by 2026-11-08 the DB was
# 6.26 GB, 99% expired sessions (1.0M) and channels messages (9.5M) back to 2026-05-27, all of it in
# every daily base backup and the R2 archive mirror. Live data is a few hundred MB.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: authentik-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: authentik.rules
      rules:
        - alert: AuthentikDatabaseBloated
          annotations:
            description: >-
              The authentik database on postgres-18 is {{ $value | humanize1024 }}B, over 2 GiB.
              Almost always expired rows the clean_expired_models task stopped getting through
              (authentik_core_session, django_channels_postgres_message). They inflate every
              base backup and the R2 mirror. Check the task in Admin > System Tasks, then run the
              bulk cleanup in scripts/authentik-db-cleanup.sh.
            summary: The authentik database is over 2 GiB; expired-row cleanup has fallen behind.
          expr: max(cnpg_pg_database_size_bytes{namespace="database", datname="authentik"}) > 2 * 1024 ^ 3
          for: 6h
          labels:
            severity: warning
