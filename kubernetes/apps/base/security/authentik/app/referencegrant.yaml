---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-authentik-access
  namespace: security
spec:
  from:
    # home-automation/esphome-auth and zigbee2mqtt-auth (hass-code-auth is on Pocket ID).
    # network left with echo-auth, now on Pocket ID.
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: home-automation
    # ai/opencode (and any future ai-namespace extAuth SecurityPolicy)
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: ai
    # flux-system/headlamp. Without this entry the SecurityPolicy is still
    # accepted, but its cross-namespace ext_authz backendRef resolves to
    # nothing.
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: flux-system
    # kube-system/hubble-auth (Hubble UI route).
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: kube-system
    # monitoring/alertmanager-auth (Alertmanager UI route).
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: monitoring
    # selfhosted/paperless-ngx-auth, linkwarden-auth (browser UI rules only), syncthing-auth,
    # changedetection-auth and excalidraw-auth.
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: selfhosted
  to:
    - group: ""
      kind: Service
      name: ak-outpost-authentik-embedded-outpost
