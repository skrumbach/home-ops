---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-authentik-access
  namespace: security
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: home-automation
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: network
    # ai/opencode (and any future ai-namespace extAuth SecurityPolicy)
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: ai
    # flux-system/headlamp. Without this entry the SecurityPolicy is still
    # accepted, but its cross-namespace ext_authz backendRef resolves to
    # nothing.
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: flux-system
    # kube-system/hubble-auth (Hubble UI route).
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: kube-system
    # monitoring/alertmanager-auth (Alertmanager UI route).
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: monitoring
    # selfhosted/paperless-ngx-auth and selfhosted/linkwarden-auth (browser UI rules only).
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: selfhosted
  to:
    - group: ""
      kind: Service
      name: ak-outpost-authentik-embedded-outpost
