---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidinstance_v1alpha1.json
# The operator creates Deployment and Service `pocket-id` (port 1411) and the Secret
# `pocket-id-static-api-key` it calls the API with. Stateless: Postgres holds the data and
# the uploaded files, the data volume is an emptyDir.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  # Operator 0.16.x supports Pocket ID >=v2.14.0 <v3.0.0 and crash-loops outside that range:
  # a v3 bump waits for an operator release that supports it.
  image: ghcr.io/pocket-id/pocket-id:v2.19.2-distroless@sha256:a21166a4eb513d2ffcbf815398480998d996a9e719cfba029395517658626f9e
  appUrl: https://id.sklab.dev
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: ENCRYPTION_KEY
  databaseUrl:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: DB_CONNECTION_STRING
  fileBackend: database
  # Any userManagement field also sets UI_CONFIG_DISABLED: settings live here, not in the UI.
  userManagement:
    # Coder rejects email_verified=false.
    emailsVerified: true
    allowUserSignups: disabled
  # The route is ours (httproute.yaml), so the operator's default trust does not apply.
  # The Envoy pods sit in the pod CIDR.
  trustedProxies:
    enabled: true
    cidrs: ["10.42.0.0/16"]
  analyticsDisabled: true
  versionCheckDisabled: true
