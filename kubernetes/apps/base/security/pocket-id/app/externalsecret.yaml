---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pocket-id-secret
    template:
      data:
        # Encrypts data at rest in the database. Never rotate or lose it: the database is
        # unreadable without it.
        ENCRYPTION_KEY: "{{ .ENCRYPTION_KEY }}"
        # Role and database come from components/cnpg-database (pocket-id-db), which reads
        # the same POSTGRES_DB_USER_PASSWORD field. The password sits in a URL unescaped.
        DB_CONNECTION_STRING: "postgresql://pocket_id:{{ .POSTGRES_DB_USER_PASSWORD }}@postgres-18-rw.database.svc.cluster.local:5432/pocket_id"
        # Read by pocketiduser.yaml so no username or email is in Git.
        OWNER_USERNAME: "{{ .OWNER_USERNAME }}"
        OWNER_EMAIL: "{{ .OWNER_EMAIL }}"
  dataFrom:
    - extract:
        key: pocket-id
