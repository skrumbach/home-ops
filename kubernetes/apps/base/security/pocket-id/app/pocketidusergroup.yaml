---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidusergroup_v1alpha1.json
# Deleting this CR deletes the group in Pocket ID. The operator owns the group's claims:
# claims added in the UI are removed on the next reconcile.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: admins
spec:
  friendlyName: Admins
  customClaims:
    - key: litellm_role
      value: proxy_admin
  users:
    userRefs:
      - name: owner
