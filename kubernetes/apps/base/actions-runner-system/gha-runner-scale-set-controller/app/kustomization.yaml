---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
  - files:
      - resources/arc-dashboard.json
    name: arc-dashboard
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    grafana_folder: CI
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "true"
kind: Kustomization
namespace: actions-runner-system
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pdb.yaml
  - ./podmonitor.yaml
  - ./prometheusrule.yaml
  - ./priorityclass.yaml
