---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/talos.dev/serviceaccount_v1alpha1.json
# No Kubernetes RoleBinding: the scale set uses the chart no-permission SA and automountServiceAccountToken false. Do not reintroduce a shared cluster-admin binding.
# Talos actions-runner is os:operator, the least role that can image-pull, and only the home-ops runner mounts it.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: actions-runner
spec:
  roles:
    - os:operator
