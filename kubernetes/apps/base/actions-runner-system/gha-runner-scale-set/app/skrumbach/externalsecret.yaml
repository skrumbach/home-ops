---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skrumbach-runner-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: skrumbach-runner-secret
    template:
      data:
        github_app_id: "{{ .ACR_AVIATOR_CODING_APP_ID }}"
        github_app_installation_id: "{{ .ACR_AVIATOR_CODING_INSTALLATION_ID }}"
        github_app_private_key: "{{ .ACR_AVIATOR_CODING_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: github
  data:
    - secretKey: ACR_AVIATOR_CODING_PRIVATE_KEY
      remoteRef:
        key: github-acr-all-repositories
        property: "private key"
