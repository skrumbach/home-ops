---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  annotations:
    # Survives a Kustomization delete; prune: false on the Kustomization does not (deletionPolicy WaitForTermination).
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  releaseName: rook-ceph
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  values:
    crds:
      enabled: true
    csi:
      # CSI controller placement is not settable from this repo. The Driver CR belongs to the internal ceph-csi-drivers release.
      # Kernel mount options live on the CephCluster.
      enableCephfsDriver: true
      enableCephfsSnapshotter: true
      enableLiveness: true
      # Stays off. No pod carries app=csi-metrics, and the Driver CRD has no metrics field.
      serviceMonitor:
        enabled: false
    enableDiscoveryDaemon: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    # Explicit 1Gi. limits: {} does not clear the chart default 512Mi, which OOMKilled the operator.
    resources:
      requests:
        memory: 128Mi
        cpu: 300m
      limits:
        memory: 1Gi
    # Discover DaemonSet toleration. PreferNoSchedule makes it hygiene for a future hard taint.
    discover:
      tolerations:
        - key: home-operations.com/dedicated
          operator: Exists
          effect: PreferNoSchedule
