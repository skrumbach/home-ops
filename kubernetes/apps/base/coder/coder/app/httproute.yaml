---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app coder
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Platform
    gethomepage.dev/name: Coder
    gethomepage.dev/icon: coder-light.svg
    gethomepage.dev/description: Dev workspaces
    gethomepage.dev/pod-selector: app.kubernetes.io/name=coder
    external-dns.kubernetes.io/target: "internal.sklab.dev,external.sklab.dev"
    gatus.home-operations.com/endpoint: |-
      url: https://coder.sklab.dev/healthz
      conditions:
        - "[STATUS] == 200"
      group: coder
spec:
  hostnames:
    - "coder.sklab.dev"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: coder
          namespace: coder
          port: 80
