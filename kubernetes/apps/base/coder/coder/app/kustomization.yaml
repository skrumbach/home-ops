---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pocketidoidcclient.yaml
  - ./servicemonitor.yaml
  - ./httproute.yaml
  - ./rules
configMapGenerator:
  - name: coder-dashboards
    # Five GrafanaDashboard objects (monitoring/grafana-operator, app-boards/) read this ConfigMap.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ./dashboards/coderd.json
      - ./dashboards/provisionerd.json
      - ./dashboards/status.json
      - ./dashboards/workspace_detail.json
      - ./dashboards/workspaces.json
  - name: coder-runbooks
    options:
      labels:
        runbook_docs: "true"
      annotations:
        runbook_folder: "coder"
    files:
      - ./runbooks/coderd.md
      - ./runbooks/provisionerd.md
generatorOptions:
  disableNameSuffixHash: true
