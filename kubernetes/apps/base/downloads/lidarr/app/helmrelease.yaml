---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lidarr
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: lidarr
  values:
    controllers:
      lidarr:
        # Left off the Deployment: KEDA owns it (components/keda/nfs-scaler).
        replicas: null
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"

        initContainers:
          init-dirs:
            image:
              repository: alpine
              tag: 3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            command:
              - sh
              - -c
              - |
                mkdir -p /data/nas-media/Music
                echo "Created directories successfully"
            securityContext:
              runAsUser: 2000
              runAsGroup: 2000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

        containers:
          app:
            image:
              repository: ghcr.io/brunnels/lidarr-develop
              tag: 3.1.3.4975@sha256:bb27472a0c1f951f9793406ae0993a21c5e9fb623729f483c0c00d2edf3adac5
            env:
              LIDARR__APP__INSTANCENAME: Lidarr
              LIDARR__APP__THEME: dark
              LIDARR__AUTH__METHOD: External
              LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
              LIDARR__LOG__DBENABLED: "False"
              LIDARR__LOG__LEVEL: info
              LIDARR__SERVER__PORT: &port 8080
              LIDARR__UPDATE__BRANCH: develop
            envFrom:
              - secretRef:
                  name: lidarr-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: lidarr-config

      add-ons:
        type: emptyDir

      tmp:
        type: emptyDir

      downloads:
        existingClaim: shared-downloads
        advancedMounts:
          lidarr:
            init-dirs:
              - path: /data/downloads
            app:
              - path: /data/downloads

      media:
        type: nfs
        server: nas.sklab.dev
        path: /mnt/storage/Media
        globalMounts:
          - path: /data/nas-media

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Lidarr
          gethomepage.dev/description: Music
          gethomepage.dev/icon: lidarr.svg
          # Goes through the ungated `api` rule: Lidarr's own {"status": "OK"} body proves the app
          # answers and that /ping still bypasses the Envoy OIDC gate (a gated path would end on the
          # Pocket ID sign-in page).
          gatus.home-operations.com/endpoint: |-
            url: https://lidarr.sklab.dev/ping
            conditions:
              - "[STATUS] == 200"
              - "[BODY].status == OK"
            group: downloads

        hostnames:
          - lidarr.sklab.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        # Rule names are load-bearing: securitypolicy.yaml gates rule `app` only.
        rules:
          - name: api
            matches:
              - path:
                  type: PathPrefix
                  value: /api
              # Calendar feed (/feed/v1/calendar/lidarr.ics), API key in the query string.
              - path:
                  type: PathPrefix
                  value: /feed
              - path:
                  type: Exact
                  value: /ping
            backendRefs:
              - name: *app
                port: *port
          - name: app
            backendRefs:
              - name: *app
                port: *port
