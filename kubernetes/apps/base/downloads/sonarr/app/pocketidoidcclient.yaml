---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
# Envoy Gateway's OIDC client for rule `app` of the sonarr route (securitypolicy.yaml). The
# operator generates the client ID and secret and writes them to Secret
# `sonarr-oidc-credentials` in this namespace. Deleting this CR deletes the client in Pocket ID.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sonarr
spec:
  name: Sonarr
  launchUrl: https://sonarr.sklab.dev
  callbackUrls: ["https://sonarr.sklab.dev/oauth2/callback"]
  # Envoy's logout sends post_logout_redirect_uri=<scheme>://<host>/ to the end-session endpoint.
  logoutCallbackUrls: ["https://sonarr.sklab.dev/"]
  # Envoy's OAuth2 filter always sends an S256 challenge; this makes Pocket ID require it.
  pkceEnabled: true
  # Pocket ID refuses the authorization for anyone outside the group.
  allowedUserGroups:
    - name: admins
      namespace: security
  logo:
    autoGenerate: false
  secret:
    # The key names Envoy Gateway reads (clientIDRef `client-id`, clientSecret `client-secret`).
    keys:
      clientID: client-id
      clientSecret: client-secret
