---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sonarr
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      sonarr:
        # Left off the Deployment: KEDA owns it (components/keda/nfs-scaler).
        replicas: null
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.3041@sha256:ec7797f30e65cc411fba6768ed575337a5787de7d06c382173df610f2d23a317
            env:
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__APP__THEME: dark
              # Native OIDC (Sonarr v5.0.0.2997, AuthenticationType.Oidc = 4) behind the Envoy gate
              # (securitypolicy.yaml), which stays: it is the fallback if this login misbehaves.
              # Back out: set METHOD to External (then OIDC* and TRUSTEDNETWORKS do nothing; drop them
              # and pocketidoidcclient-app.yaml in a follow-up). Names come from AuthOptions.cs, bound
              # from config section Sonarr:Auth / Sonarr:Server (Bootstrap.cs), `__` = `:`.
              SONARR__AUTH__METHOD: Oidc
              # Enabled, not DisabledForLocalAddresses: with TRUSTEDNETWORKS below Sonarr rewrites the
              # remote IP from X-Forwarded-For (a LAN address, or one the client spoofs), and
              # DisabledForLocalAddresses (UiAuthorizationHandler.cs) would skip the login for it.
              # API consumers send X-Api-Key (scheme "API"), which this setting does not affect.
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__AUTH__OIDCAUTHORITY: https://id.sklab.dev
              # Without all of authority, client id, client secret, user and `openid` in the scopes
              # (IsOidcConfigured, AuthenticationConfigurationExtensions.cs) Sonarr falls back to Forms.
              SONARR__AUTH__OIDCCLIENTID:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-app-oidc-credentials
                    key: client-id
              SONARR__AUTH__OIDCCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-app-oidc-credentials
                    key: client-secret
              # SONARR__AUTH__OIDCUSERIDENTIFIER (the one allowed user) is not here: it is the owner's
              # e-mail, so it comes from 1Password through sonarr-secret (externalsecret.yaml). Sonarr
              # accepts the e-mail only when Pocket ID sends email_verified=true, which needs the
              # email scope.
              SONARR__AUTH__OIDCSCOPES: openid email
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &port 8989
              # Trust X-Forwarded-Proto/Host from the pod network (Envoy): without it Sonarr builds
              # redirect_uri as http://sonarr.sklab.dev/signin-oidc, which Pocket ID rejects.
              # Must change together with the pod CIDR (10.42.0.0/16) and the client's callbackUrls.
              SONARR__SERVER__TRUSTEDNETWORKS: 10.42.0.0/16
              SONARR__UPDATE__BRANCH: develop
            envFrom:
              - secretRef:
                  name: sonarr-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 384Mi
              # Imports copy CephFS -> NFS (no hardlink across filesystems); the copy fills the
              # page cache and 2Gi stalled sonarr in reclaim (2026-11-14 Talos OOM kills).
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}

    defaultPodOptions:
      # nodeTaintsPolicy: Honor only filters NoSchedule/NoExecute taints. The talos-3
      # dedicated taint is PreferNoSchedule, so talos-3 stays in the spread domains and
      # the TaintToleration score penalty keeps this workload off it.
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sonarr

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: sonarr-config
      add-ons:
        type: emptyDir
      tmp:
        type: emptyDir
      downloads:
        existingClaim: shared-downloads
        globalMounts:
          - path: /data/downloads
      media:
        type: nfs
        server: nas.sklab.dev
        path: /mnt/storage/Media
        globalMounts:
          - path: /data/nas-media

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Sonarr
          gethomepage.dev/href: "https://sonarr.sklab.dev"
          gethomepage.dev/icon: sonarr.svg
          gethomepage.dev/description: TV shows
          gethomepage.dev/pod-selector: app.kubernetes.io/name=sonarr
          # Goes through the ungated `api` rule: a gated path would end on the 200 Pocket ID sign-in
          # page, which the body condition cannot match.
          gatus.home-operations.com/endpoint: |-
            url: https://sonarr.sklab.dev/ping
            conditions:
              - "[STATUS] == 200"
              - "[BODY].status == OK"
            group: downloads
        hostnames:
          - sonarr.sklab.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        # Rule names are load-bearing: securitypolicy.yaml gates rule `app` only.
        rules:
          - name: api
            matches:
              - path:
                  type: PathPrefix
                  value: /api
              # Calendar feed (/feed/v3/calendar/sonarr.ics), API key in the query string.
              - path:
                  type: PathPrefix
                  value: /feed
              - path:
                  type: Exact
                  value: /ping
            backendRefs:
              - name: *app
                port: *port
          - name: app
            backendRefs:
              - name: *app
                port: *port
