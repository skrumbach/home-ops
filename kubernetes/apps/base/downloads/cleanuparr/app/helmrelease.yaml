---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cleanuparr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cleanuparr
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      cleanuparr:
        annotations:
          reloader.stakater.com/auto: "true"

        # Single replica with an RWO config PVC: Recreate avoids a Multi-Attach
        # deadlock during rollouts.
        strategy: Recreate

        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/cleanuparr/cleanuparr
              tag: 2.11.0@sha256:1898c3219e7e7ecaf9fcb8474691b6d67d56d0798b01b85690975bae14df11b5
            env:
              # Only the port is set here. Instances, the SABnzbd client and the queue rules
              # live in Cleanuparr's own database (UI/REST API), backed up by kopiur.
              PORT: &port 11011
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 15m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: cleanuparr
        ports:
          http:
            port: *port

    persistence:
      config:
        # Created here (app-template names it after the release: cleanuparr) and backed up
        # by components/kopiur. A second persistentVolumeClaim entry renames this claim to
        # cleanuparr-config and orphans the backed-up one.
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        # helm.sh/resource-policy: keep, so a HelmRelease uninstall or rename does not
        # delete the only live copy of this born-kopiur claim.
        retain: true
        advancedMounts:
          cleanuparr:
            app:
              - path: /config

      temp:
        type: emptyDir
        advancedMounts:
          cleanuparr:
            app:
              - path: /tmp

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Cleanuparr
          gethomepage.dev/icon: cleanuparr.png
          gethomepage.dev/description: Clears stalled downloads
          gethomepage.dev/pod-selector: app.kubernetes.io/name=cleanuparr
          gatus.home-operations.com/endpoint: |-
            url: https://cleanuparr.sklab.dev/health
            conditions:
              - "[STATUS] == 200"
              - "[BODY] == healthy"
            group: downloads
        hostnames:
          - cleanuparr.sklab.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: cleanuparr
                port: *port
