---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app shelfmark
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: shelfmark
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
    controllers:
      shelfmark:
        # Left off the Deployment: KEDA owns it (components/keda/nfs-scaler).
        replicas: null
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/calibrain/shelfmark-lite
              tag: v1.7.2@sha256:41cdbbf9ff0d568b9fbbcb70a4d996d01f0e5f28fb7b04a97276fbd9fd50638e
            env:
              # List form: app-template mangles bare PUID/PGID map keys (see the CWA release).
              - name: PUID
                value: "2000"
              - name: PGID
                value: "2000"
              - name: FLASK_PORT
                value: "8084"
              - name: INGEST_DIR
                value: /cwa-book-ingest
              - name: LOG_ROOT
                value: /var/log
              - name: LOG_LEVEL
                value: info
              - name: BOOK_LANGUAGE
                value: en
              - name: USE_BOOK_TITLE
                value: "true"
              # Usenet path (no torrents): Prowlarr finds releases, SABnzbd downloads them to the
              # shared volume at the same path SABnzbd reports. Direct HTTP downloads are below.
              - name: PROWLARR_ENABLED
                value: "true"
              - name: PROWLARR_URL
                value: http://prowlarr.downloads.svc.cluster.local:9696
              - name: PROWLARR_USENET_CLIENT
                value: sabnzbd
              - name: SABNZBD_URL
                value: http://sabnzbd.downloads.svc.cluster.local:8080
              - name: SABNZBD_CATEGORY
                value: books
              # Lite image has no Chromium; Cloudflare challenges go to FlareSolverr.
              - name: USING_EXTERNAL_BYPASSER
                value: "true"
              - name: EXT_BYPASSER_URL
                value: http://flaresolverr.network.svc.cluster.local:8191
              - name: EXT_BYPASSER_PATH
                value: /v1
              - name: EXT_BYPASSER_TIMEOUT
                value: 60000
              - name: USE_CF_BYPASS
                value: "true"
              # Direct download via Anna's Archive. annas-archive.is is deliberately absent: it is
              # an impostor that answers 200 with a different page layout, so the parser finds no
              # results. The real mirrors sit behind Cloudflare and go through FlareSolverr.
              - name: DIRECT_DOWNLOAD_ENABLED
                value: "true"
              - name: AA_BASE_URL
                value: auto
              - name: AA_MIRROR_URLS
                value: https://annas-archive.gl,https://annas-archive.pk,https://annas-archive.gd
              - name: LIBGEN_SEARCH_ENABLED
                value: "true"
              # Metadata providers; their API keys must come from the secret, not from here.
              - name: HARDCOVER_ENABLED
                value: "true"
              - name: GOOGLEBOOKS_ENABLED
                value: "true"
              - name: MOLY_ENABLED
                value: "true"
              # Output: renamed files into the CWA ingest folder.
              - name: BOOKS_OUTPUT_MODE
                value: folder
              - name: DESTINATION
                value: /cwa-book-ingest
              - name: FILE_ORGANIZATION
                value: rename
              - name: TEMPLATE_RENAME
                value: "{Author} - {Title} ({Year})"
              # Sign-in with Pocket ID (pocketidoidcclient.yaml). Environment wins over the settings
              # UI (config.py: ENV > config file > default), so nothing is clicked. Without it
              # AUTH_METHOD is "none" and every LAN visitor is an admin. Only /api/health answers
              # without a session, which is why the probes and Gatus use it.
              - name: AUTH_METHOD
                value: oidc
              - name: OIDC_DISCOVERY_URL
                value: https://id.sklab.dev/.well-known/openid-configuration
              - name: OIDC_BUTTON_LABEL
                value: Pocket ID
              # Members of this group become admin on every sign-in (role is synced from the claim).
              # Shelfmark adds the group claim's scope (`groups`, which Pocket ID needs to release
              # it) by itself while an admin group is set; OIDC_SCOPES keeps its default.
              - name: OIDC_ADMIN_GROUP
                value: admins
              # The Secret the operator writes; the pod waits for it. The state under /config is an
              # emptyDir (users.db, session key), so every pod start signs everyone out and the
              # next sign-in auto-provisions the account again. There is no local admin: env
              # settings skip the UI's "local admin required" check, and AUTH_METHOD=oidc stays
              # closed (never anonymous) when Pocket ID is down. Reverting this block restores
              # open access; DISABLE_LOCAL_AUTH is deliberately not set.
              - name: OIDC_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: shelfmark-oidc-credentials
                    key: client-id
              - name: OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: shelfmark-oidc-credentials
                    key: client-secret
            envFrom:
              - secretRef:
                  name: shelfmark-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  # /api/health needs no session (system_routes.py); the other /api paths do.
                  httpGet:
                    path: /api/health
                    port: 8084
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8084
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 150Mi
              limits:
                memory: 500Mi
            securityContext:
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              allowPrivilegeEscalation: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8084
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: sh-shelfmark.svg
          gethomepage.dev/name: Shelfmark
          gethomepage.dev/group: Downloads
          gethomepage.dev/description: Book search and download
          # /api/health is the one path that answers without a session.
          gatus.home-operations.com/endpoint: |-
            url: https://books.sklab.dev/api/health
            conditions:
              - "[STATUS] == 200"
            group: media
        hostnames: ["books.sklab.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: 8084
            timeouts:
              request: 0s
    persistence:
      # /app/downloaded_files is a symlink into /tmp/shelfmark, so it is deliberately not mounted:
      # a mount there makes the runtime create /tmp/shelfmark root-owned.
      # One emptyDir per path: subPath directories are created root-owned and ignore fsGroup,
      # which left the non-root entrypoint unable to write /tmp/shelfmark.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/shelfmark
      # Writable scratch for the app's own state; settings come from env, so nothing here
      # needs to survive a restart (the old release failed on a missing /config).
      app-state:
        type: emptyDir
        globalMounts:
          - path: /config
      downloads:
        existingClaim: shared-downloads
        globalMounts:
          - path: /data/downloads
      ingest:
        type: nfs
        server: nas.sklab.dev
        path: /mnt/storage/Media/ebooks/calibre/ingest
        globalMounts:
          - path: /cwa-book-ingest
      # Read-only view of the CWA library so Shelfmark can see which books already exist.
      library:
        type: nfs
        server: nas.sklab.dev
        path: /mnt/storage/Media/ebooks/calibre/library
        globalMounts:
          - path: /calibre-library
            readOnly: true
