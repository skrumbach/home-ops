---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./externalsecret.yaml
# Applies to the SnapshotPolicies the overlay's kopiur component adds (sabnzbd-ceph, sabnzbd-r2).
# An overlay spec.patches is dropped by cluster-apps, so the patch lives here. nzb-backup is ~2.4 GiB
# of .nzb copies SABnzbd re-fetches from the indexer. An explicit list replaces kopiur's default
# rules, so the five defaults are repeated.
patches:
  - target:
      kind: SnapshotPolicy
    patch: |
      - op: add
        path: /spec/files
        value:
          ignoreRules:
            - /lost+found
            - System Volume Information
            - $RECYCLE.BIN
            - "@eaDir"
            - .snapshot
            - /nzb-backup/
            - /logs/
