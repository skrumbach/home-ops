---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Gates the whole zigbee2mqtt route with Pocket ID at Envoy (native OIDC): the /code/ editor runs
# code-server with --auth none, and the frontend has no login of its own and can permit-join or
# remove devices. Home Assistant talks to Zigbee2MQTT over MQTT, not this route.
# A policy that fails to translate (e.g. the operator has not written zigbee2mqtt-oidc-credentials
# yet) makes the route answer 500, not pass through; a policy whose targetRef matches no route
# leaves that route open.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: zigbee2mqtt-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: zigbee2mqtt
  oidc:
    provider:
      issuer: https://id.sklab.dev
      # Explicit endpoints skip discovery: without them the Envoy Gateway controller fetches
      # the issuer's openid-configuration on every translation, and a failed fetch turns the
      # route into a 500 until the next one.
      authorizationEndpoint: https://id.sklab.dev/authorize
      tokenEndpoint: https://id.sklab.dev/api/oidc/token
      endSessionEndpoint: https://id.sklab.dev/api/oidc/end-session
    # Both from the Secret pocketidoidcclient.yaml generates.
    clientIDRef:
      name: zigbee2mqtt-oidc-credentials
    clientSecret:
      name: zigbee2mqtt-oidc-credentials
    redirectURL: https://zigbee2mqtt.sklab.dev/oauth2/callback
    logoutPath: /oauth2/logout
