# hass-oidc-auth settings, included from /config/configuration.yaml as
#   auth_oidc: !include auth_oidc.yaml
# Public client + PKCE, so there is no secret here. The Pocket ID side is
# pocketidoidcclient-app.yaml; client_id must match its spec.clientID.
client_id: home-assistant
discovery_url: https://id.sklab.dev/.well-known/openid-configuration
display_name: Pocket ID
# No `features.automatic_user_linking`: it was on for the owner's first Pocket ID login on
# 2026-11-13, which linked the owner account. Left on, any later Pocket ID admin whose username
# equals a local Home Assistant login would take that account over on first sign-in. A new
# local account needs it again for one login: the match is on the exact, lowercase username.
roles:
  # Pocket ID sends group names in `groups` (the groups scope is requested by default).
  # Setting `user` to the same group means any other account is rejected instead of landing
  # as a plain HA user. Applies to new users only; a linked user keeps its HA group.
  admin: admins
  user: admins
