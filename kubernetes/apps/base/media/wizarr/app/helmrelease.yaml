---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wizarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: wizarr
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      wizarr:
        annotations:
          reloader.stakater.com/auto: "true"

        # Single replica with an RWO database PVC: Recreate avoids a Multi-Attach deadlock.
        strategy: Recreate

        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        initContainers:
          # Writes the admin, Plex server, Seerr link and Hermes API key rows that Wizarr's setup wizard would.
          # Runs on the exact app image so it always matches the DB schema.
          seed:
            image: &image
              repository: ghcr.io/wizarrrr/wizarr
              tag: v2026.10.1@sha256:08f2c6de534ec7d36d39a4f55b7c5c379021ca881dc519c702aad0ddafbdc67a
            command: ["/bin/sh", "-c"]
            args:
              - >-
                uv run --frozen --no-dev flask db upgrade &&
                uv run --frozen --no-dev python /seed/seed.py
            env:
              TZ: America/New_York
              FLASK_SKIP_SCHEDULER: "true"
              PYTHONPATH: /app
              WIZARR_ADMIN_USERNAME: admin
              PLEX_URL: http://plex.media.svc.cluster.local:32400
              SEERR_URL: http://seerr.media.svc.cluster.local:5055
              PLEX_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: wizarr-seed-secret
                    key: PLEX_TOKEN
              SEERR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: seerr-api-key
                    key: SEERR_API_KEY
              WIZARR_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: wizarr-generated
                    key: WIZARR_ADMIN_PASSWORD
              WIZARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: wizarr-generated
                    key: WIZARR_API_KEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

        containers:
          app:
            image: *image
            env:
              TZ: America/New_York
              PORT: &port 5690
              PUID: "2000"
              PGID: "2000"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: wizarr
        ports:
          http:
            port: *port

    persistence:
      config:
        # components/kopiur/pvc owns this claim (restore-on-create). Invites, servers and libraries
        # live in this SQLite database. Born chart-owned; the live claim keeps
        # helm.sh/resource-policy: keep, so Helm did not delete it on the switch.
        existingClaim: wizarr
        advancedMounts:
          wizarr:
            app:
              - path: /data/database
            seed:
              - path: /data/database
      temp:
        type: emptyDir
        advancedMounts:
          wizarr:
            app:
              - path: /tmp
              - path: /.cache
            seed:
              - path: /tmp
              - path: /.cache
      seed:
        type: configMap
        name: wizarr-seed
        advancedMounts:
          wizarr:
            seed:
              - path: /seed
                readOnly: true

    route:
      # The only route since the public invite host (join.sklab.dev) went 2026-11-13: LAN only.
      # forceRename keeps the name the route had while there were two.
      admin:
        forceRename: wizarr-admin
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Wizarr
          gethomepage.dev/icon: wizarr.svg
          gethomepage.dev/description: Plex invitations
          gethomepage.dev/pod-selector: app.kubernetes.io/name=wizarr
          gatus.home-operations.com/endpoint: |-
            url: https://wizarr.sklab.dev/health
            conditions:
              - "[STATUS] == 200"
            group: media
        hostnames:
          - wizarr.sklab.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: wizarr
                port: *port
