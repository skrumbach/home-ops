---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./helmrelease.yaml
  - ./pvc.yaml
  - ./externalservice.yaml
# Applies to the SnapshotPolicies the overlay's kopiur component adds (tdarr-ceph, tdarr-r2). An overlay
# spec.patches is dropped by cluster-apps, so the patch lives here. Tdarr/Backups is Tdarr's own rolling
# zip backups of DB2; kopiur already keeps DB2's history. An explicit list replaces kopiur's default
# rules, so the five defaults are repeated.
patches:
  - target:
      kind: SnapshotPolicy
    patch: |
      - op: add
        path: /spec/files
        value:
          ignoreRules:
            - /lost+found
            - System Volume Information
            - $RECYCLE.BIN
            - "@eaDir"
            - .snapshot
            - /Tdarr/Backups/
