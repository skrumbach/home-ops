---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-temp
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  # Disposable transcode scratch on the RWX class. The default `csi`
  # subvolumegroup is broken by Ceph Tentacle v20.2.1 subvolume corruption,
  # so this claim stays on `ceph-filesystem-rwx` until a fixed Ceph release
  # lands and the subvolumegroup is re-checked. Skill rook-ceph.
  storageClassName: ceph-filesystem-rwx
