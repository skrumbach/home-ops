---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./deployment.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pushsecret.yaml
  - ./service.yaml
  - ./servicemonitor.yaml
  - ./ingress.yaml
# Applies to the SnapshotPolicies the overlay's kopiur component adds (plex-ceph, plex-r2). An overlay
# spec.patches is dropped by cluster-apps, so the patch lives here. Skipped: what Plex rebuilds or
# re-downloads on its own (cache, logs, crash reports, codecs, GPU drivers, updates). Metadata and Media
# stay: re-matching a library and regenerating artwork takes hours. An explicit list replaces kopiur's
# default rules, so the five defaults are repeated.
patches:
  - target:
      kind: SnapshotPolicy
    patch: |
      - op: add
        path: /spec/files
        value:
          ignoreRules:
            - /lost+found
            - System Volume Information
            - $RECYCLE.BIN
            - "@eaDir"
            - .snapshot
            - /Library/Application Support/Plex Media Server/Cache/
            - /Library/Application Support/Plex Media Server/Logs/
            - /Library/Application Support/Plex Media Server/Crash Reports/
            - /Library/Application Support/Plex Media Server/Codecs/
            - /Library/Application Support/Plex Media Server/Drivers/
            - /Library/Application Support/Plex Media Server/Updates/
