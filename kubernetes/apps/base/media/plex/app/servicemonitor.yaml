---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: plex-exporter
  namespace: media
spec:
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  selector:
    matchLabels:
      # Matches only the plex-exporter Service (service.yaml). The chart's main
      # `plex` Service carries app.kubernetes.io/name: plex, so it is not selected.
      app.kubernetes.io/name: plex-exporter
  namespaceSelector:
    matchNames:
      - media
