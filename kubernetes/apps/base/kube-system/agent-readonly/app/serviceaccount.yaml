---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount.json
# Identity for agent sessions (Claude Code, later Hermes). scripts/agent-credentials.sh
# mints a token for it into ~/.kube/home-ops-agent, outside the repo. Read-only, no Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-readonly
