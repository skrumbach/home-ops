---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Internal only, behind Pocket ID at Envoy (./securitypolicy.yaml): Hubble UI has
# no login of its own and shows every flow in the cluster. The Gatus check goes
# to the in-cluster Service, because the OIDC gate answers 302 before the
# backend and would stay green through an outage.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app hubble
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Cilium network flows
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: cilium.svg
    gethomepage.dev/name: Hubble
    gethomepage.dev/app: *app
    gethomepage.dev/pod-selector: k8s-app=hubble-ui
    external-dns.kubernetes.io/target: "internal.sklab.dev"
    gatus.home-operations.com/endpoint: |-
      url: http://hubble-ui.kube-system.svc.cluster.local/
      conditions: ["[STATUS] == 200"]
      ui:
        hide-url: true
spec:
  hostnames:
    - "hubble.sklab.dev"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hubble-ui
          namespace: kube-system
          port: 80
