---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  chartRef:
    kind: OCIRepository
    name: multus
  interval: 1h
  # Chart mergeOverwrite drops values tolerations. This JSON6902 add is the only in-repo path. Effect must stay PreferNoSchedule.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: DaemonSet
              name: multus
            patch: |-
              - op: add
                path: /spec/template/spec/tolerations/-
                value:
                  key: home-operations.com/dedicated
                  operator: Exists
                  effect: PreferNoSchedule
  values:
    cni:
      binPath: /opt/cni/bin
      netPath: /etc/cni/net.d
    multus:
      resources:
        requests:
          cpu: 10m
          # Explicit request. A limit with no request reserves the whole limit.
          memory: 64Mi
        limits:
          memory: 512Mi
