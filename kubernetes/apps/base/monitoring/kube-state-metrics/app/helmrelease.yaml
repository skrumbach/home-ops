---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
  values:
    fullnameOverride: kube-state-metrics

    # Was BestEffort (first evicted under node pressure). Live working set ~74Mi; no memory
    # limit on purpose so a sharded/large cluster is never OOM-killed by a limit.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi

    prometheus:
      monitor:
        enabled: true
        honorLabels: true

    # KSM's own health (list/watch errors, sharding) is a separate telemetry port (8081),
    # not the 8080 "http" port. Without the container port, Service port and second
    # ServiceMonitor endpoint the KubeStateMetrics* rules can never fire.
    selfMonitor:
      enabled: true
