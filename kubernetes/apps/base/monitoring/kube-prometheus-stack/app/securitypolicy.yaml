---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Gates the whole route (UI and /api/v1/*) with Pocket ID at Envoy (native OIDC). Prometheus has no
# login. Grafana, KEDA, Homepage and the other consumers reach it through the in-cluster Service
# (kube-prometheus-stack-prometheus.monitoring:9090), which this policy does not touch.
# The route name is the chart's (<release>-prometheus), not the release name.
# A policy that fails to translate (e.g. the operator has not written kube-prometheus-stack-oidc-credentials
# yet) makes the route answer 500, not pass through; a policy whose targetRef matches no route
# leaves that route open.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kube-prometheus-stack-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kube-prometheus-stack-prometheus
  oidc:
    provider:
      issuer: https://id.sklab.dev
      # Explicit endpoints skip discovery: without them the Envoy Gateway controller fetches
      # the issuer's openid-configuration on every translation, and a failed fetch turns the
      # route into a 500 until the next one.
      authorizationEndpoint: https://id.sklab.dev/authorize
      tokenEndpoint: https://id.sklab.dev/api/oidc/token
      endSessionEndpoint: https://id.sklab.dev/api/oidc/end-session
    # Both from the Secret pocketidoidcclient.yaml generates.
    clientIDRef:
      name: kube-prometheus-stack-oidc-credentials
    clientSecret:
      name: kube-prometheus-stack-oidc-credentials
    redirectURL: https://kube-prometheus-stack.sklab.dev/oauth2/callback
    logoutPath: /oauth2/logout
