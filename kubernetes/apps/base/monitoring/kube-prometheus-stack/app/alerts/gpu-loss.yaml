---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Both prior B70 losses (2026-06, 2026-08) went unnoticed.
# kube-state-metrics already emits kube_node_status_allocatable per extended resource,
# no allowlist change needed: resource="devic_es_b70" (99 on talos-3 only) and
# resource="gpu_intel_com_xe" (99 per node, iGPU via allowIDs 0xa7a0). Names are ksm's
# sanitized form of devic.es/b70 and gpu.intel.com/xe (non-alnum -> "_").
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-loss
spec:
  groups:
    - name: gpu-loss.rules
      rules:
        # talos-3 is the only node with the discrete B70; pinned rather than
        # generic since it is single-node hardware, not a fleet-wide resource.
        - alert: B70GpuLost
          expr: kube_node_status_allocatable{resource="devic_es_b70", node="talos-3"} == 0
          for: 5m
          annotations:
            summary: >-
              talos-3 allocatable devic.es/b70 has been 0 for 5m: the Arc Pro B70
              left the PCIe bus. The dock has its own PSU, so a host reboot does not
              bring it back. Recovery: power talos-3 fully off, switch the dock PSU on
              first, wait 5-10s until fans spin and the LED is lit, only then power the
              host (never host-first, never both at once). Confirm with
              `kubectl get nodes -o custom-columns=NAME:.metadata.name,B70:.status.allocatable.devic\.es/b70`
              (expect 99 on talos-3).
          labels:
            severity: critical
        # Deliberately not pinned to a node: ksm emits this series for every
        # node advertising gpu.intel.com/xe (all three iGPUs; allowIDs 0xa7a0),
        # so the alert covers any node that registers the resource.
        - alert: XeGpuLost
          expr: kube_node_status_allocatable{resource="gpu_intel_com_xe"} == 0
          for: 5m
          annotations:
            summary: >-
              {{ $labels.node }} allocatable gpu.intel.com/xe has been 0 for
              5m — the node's xe-bound iGPU dropped off the bus or the device
              plugin stopped reporting it. Check GPU pods for Pending status.
          labels:
            severity: critical
