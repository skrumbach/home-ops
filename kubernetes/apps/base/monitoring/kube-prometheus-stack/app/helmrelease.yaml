---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  # The cluster-apps HelmRelease patch overrides both to CreateReplace; values.crds.enabled
  # false is what keeps this chart from shipping CRDs (prometheus-operator/crds owns them).
  install:
    crds: Skip
  upgrade:
    crds: Skip
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    crds:
      enabled: false
    cleanPrometheusOperatorObjectNames: true

    # `defaultRules.disabled` switches a chart rule off so a replacement under ./alerts/
    # owns the name. Each keeps upstream's name, severity, `for` and runbook_url and
    # changes exactly one thing.
    defaultRules:
      disabled:
        # Latched with no recency bound while the failed Job object is retained.
        # Replaced by ./alerts/kubernetes-apps-recency.yaml.
        KubeJobFailed: true
        # Fires on containers of terminal (phase=Failed) pods, which wait on nothing.
        # Replaced by ./alerts/kubernetes-apps-recency.yaml.
        KubeContainerWaiting: true
        # rate()/increase() over [1m] with a 1m scrape interval returns no
        # series at all. Replaced by ./alerts/apiserver-aggregation.yaml.
        KubeAggregatedAPIErrors: true

      # Reported ~5M silently discarded samples over 8 days and was ignored while every alert
      # had the same urgency. Discarded samples degrade every alert over the target, so this is
      # a monitoring-system failure: critical, Pushover priority 2.
      additionalRuleAnnotations:
        PrometheusDuplicateTimestamps:
          # The counter is global and unlabelled, so the offending target can
          # only be named from Prometheus's own log - which is lost when the pod
          # is replaced. Promtail ships it to Loki, so read it there first.
          attribution: >-
            The dropped samples are attributable ONLY from Prometheus's own log,
            not from any metric label. Capture it before the pod is replaced:
            LogQL `{namespace="monitoring", pod=~"prometheus-.*"} |= "different
            value but same timestamp"` names the scrape_pool, the target URL and
            num_dropped per scrape. Last occurrence: rook-ceph-exporter on
            talos-2 (http://10.10.10.12:9926/metrics), 90 samples per 10s scrape
            = 540/min, from 2026-09-06 until it cleared at 2026-09-14T21:29Z.

    customRules:
      PrometheusDuplicateTimestamps:
        severity: critical

    alertmanager:
      enabled: false

    kubeApiServer:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)

    kubeControllerManager:
      enabled: false

    # Talos runs etcd as a host service, not a pod, and serves its metrics as plain http on
    # :2381 (`listen-metrics-urls` in talos/machineconfig.yaml.j2). Scrape the node IPs,
    # never the VIP. The chart's default serviceMonitor.authorization is a Bearer header with
    # the Prometheus ServiceAccount token; `null` stops it being sent in cleartext to etcd.
    # Inert chart rule: etcdGRPCRequestsSlow needs grpc_server_handling_seconds, which etcd
    # only exports with `metrics: extensive` (Talos runs the default `basic`).
    kubeEtcd:
      enabled: true
      endpoints: ["10.10.10.11", "10.10.10.12", "10.10.10.13"]
      service:
        port: 2381
        targetPort: 2381
      serviceMonitor:
        scheme: http
        authorization: null
        # Node name as instance, matching node-exporter, so alerts can say instance="talos-1".
        relabelings:
          - action: replace
            sourceLabels: ["__address__"]
            regex: 10\.10\.10\.11:\d+
            targetLabel: instance
            replacement: talos-1
          - action: replace
            sourceLabels: ["__address__"]
            regex: 10\.10\.10\.12:\d+
            targetLabel: instance
            replacement: talos-2
          - action: replace
            sourceLabels: ["__address__"]
            regex: 10\.10\.10\.13:\d+
            targetLabel: instance
            replacement: talos-3

    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            sourceLabels: ["__name__"]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)

    kubeProxy:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeStateMetrics:
      enabled: false

    # node_memory_* / node_pressure_* come from here (the victoria-metrics stack is off).
    # The alerts in ./alerts/node-memory-pressure.yaml depend on them.
    nodeExporter:
      enabled: true
      # Only gates the AIX and macOS dashboard ConfigMaps (no such nodes); the DaemonSet is unchanged.
      operatingSystems:
        aix:
          enabled: false
        darwin:
          enabled: false

    prometheus-node-exporter:
      # hostNetwork listener, pinned at the chart default: cilium ciliumclusterwidenetworkpolicy.yaml
      # world-denies 9100; keep the two in sync.
      service:
        port: 9100
      prometheus:
        monitor:
          enabled: true
          relabelings:
            # Use the node name as the instance label (instead of pod IP:9100)
            # so alerts can target instance="talos-1" directly.
            - action: replace
              regex: (.+)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: instance
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          annotations:
            grafana_folder: Kubernetes

    prometheusOperator:
      resources:
        requests:
          cpu: 35m
          memory: 273M
        limits:
          memory: 326M

      prometheusConfigReloader:
        # resource config for prometheusConfigReloader
        resources:
          requests:
            cpu: 5m
            memory: 32M
          limits:
            memory: 32M

    prometheus:
      prometheusSpec:
        alertingEndpoints:
          - namespace: monitoring
            name: alertmanager
            port: 9093
            apiVersion: v2
        enableAdminAPI: false
        enableFeatures:
          - auto-gomaxprocs
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        replicas: 1
        # Adds an external label `__replica__` to every series. No Thanos Query runs in this
        # cluster; removing this value would add a `prometheus_replica` label to every alert.
        replicaExternalLabelName: "__replica__"
        resources:
          requests:
            cpu: 100m
            memory: 3Gi
          # 3Gi OOMKilled the pod during TSDB head compaction (self-reinforcing
          # crash loop). Node has ample headroom; 8Gi absorbs the compaction spike.
          limits:
            memory: 8Gi
        retention: 14d
        retentionSize: 50GB
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeInterval: 1m # Must match interval in Grafana Helm chart
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            metadata:
              name: storage-prometheus-db
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 55Gi
        walCompression: true

      route:
        main:
          enabled: true
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/icon: prometheus
            gethomepage.dev/name: Prometheus
            gethomepage.dev/group: Observability
            gethomepage.dev/app: prometheus
            gethomepage.dev/description: Monitoring Scrape Service
            gethomepage.dev/widget.type: prometheus
            gethomepage.dev/widget.url: http://kube-prometheus-stack-prometheus.monitoring:9090
          hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
