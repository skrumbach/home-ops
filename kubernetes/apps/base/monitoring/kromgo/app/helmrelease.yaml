---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kromgo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kromgo
  values:
    controllers:
      kromgo:
        replicas: 2
        strategy: RollingUpdate
        # One of the two badge replicas stays up through a node drain.
        podDisruptionBudget:
          minAvailable: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # kashalls/kromgo moved to home-operations/kromgo (tags without the v prefix).
              repository: ghcr.io/home-operations/kromgo
              tag: 0.16.4@sha256:f55f7b5590a394e3ea47f5debf8c75e01898c3f915331aa28568b6fd8d426310
            env:
              KROMGO_PROMETHEUS_URL: http://prometheus-operated.monitoring.svc.cluster.local:9090
              KROMGO_SERVER_PORT: &port 8080
              # No /metrics listener: nothing scrapes it, and the main port is the only one served.
              KROMGO_METRICS_ENABLED: "false"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                # ~4x the 14d peak (x2 replicas). Limit 64Mi.
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # maxSkew 1 so one drain cannot take both replicas. Honor does not see the talos-3 PreferNoSchedule taint.
      # The chart defaults labelSelector to this controller's pods.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
    service:
      app:
        ports:
          http:
            port: *port
    # LAN only since 2026-11-13, no auth. Only /badges/ is routed (no gallery, graphs
    # or health paths) and kromgo answers only the fixed queries in resources/config.yaml.
    # Access-Control-Allow-Origin: * lets the documentation site (another origin) read the badges
    # from a browser on the LAN; that is safe because the data is fixed and anonymous.
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://kromgo.sklab.dev/badges/cluster_node_count?format=json
            conditions: ["[STATUS] == 200", "[BODY].id == cluster_node_count"]
        hostnames: ["{{ .Release.Name }}.sklab.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /badges/
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Access-Control-Allow-Origin
                      value: "*"
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      config-file:
        type: configMap
        name: kromgo-configmap
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
