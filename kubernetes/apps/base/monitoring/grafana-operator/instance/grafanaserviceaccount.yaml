---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanaserviceaccount_v1beta1.json
# The Viewer account of ai/grafana-mcp. The operator writes the token to Secret
# grafana-mcp-viewer-token, key `token`, and pushsecret.yaml publishes it to 1Password.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: grafana-mcp-viewer
spec:
  instanceName: grafana
  name: grafana-mcp-viewer
  # Viewer only, never Editor or Admin (the rule of the grafana-mcp ExternalSecret).
  role: Viewer
  tokens:
    - name: grafana-mcp
      secretName: grafana-mcp-viewer-token
