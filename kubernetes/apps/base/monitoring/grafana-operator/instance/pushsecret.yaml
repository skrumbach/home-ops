---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Publishes the token of GrafanaServiceAccount grafana-mcp-viewer to 1Password item grafana-mcp,
# where ExternalSecret mcp-grafana (namespace ai) reads it for the Grafana MCP server. The two
# namespaces share no Secret, so 1Password is the hand-over point.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-mcp-viewer-token
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      name: grafana-mcp-viewer-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: grafana-mcp
          property: GRAFANA_SERVICE_ACCOUNT_TOKEN
