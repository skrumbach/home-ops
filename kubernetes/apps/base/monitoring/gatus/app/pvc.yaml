---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-gatus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # Sqlite history for ~60 endpoints stays well under 50Mi. A PVC cannot shrink in
      # place, so do not size this down later without a delete + recreate.
      storage: 512Mi
  storageClassName: ceph-block
