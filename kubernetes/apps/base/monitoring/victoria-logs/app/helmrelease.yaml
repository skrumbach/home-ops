---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    global:
      image:
        registry: quay.io
    server:
      # Service and StatefulSet `victoria-logs`, claim `server-volume-victoria-logs-0`. Not the 2025
      # release `victorialogs`: its orphan claim server-volume-victorialogs-victoria-logs-single-server-0
      # still exists in monitoring and must not be picked up again.
      fullnameOverride: victoria-logs
      # Mirrors Loki (limits_config.retention_period 14d on a 50Gi ceph-block claim). The disk cap
      # drops the oldest days first if 14 days ever outgrow the claim, instead of filling it.
      retentionPeriod: 14d
      retentionDiskSpaceUsage: 45GiB
      # Not backed up: logs are kept only 14 days, so a lost claim loses at most those days.
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      # On first start the three collectors send every existing log file at once, 14 daily
      # partitions deep. At 2Gi on a 20-core node the server was OOM-killed 12s after each start
      # (2026-11-12). GOMAXPROCS keeps its per-core buffers in proportion to the memory limit.
      env:
        - name: GOMAXPROCS
          value: "4"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 4Gi
      podSecurityContext:
        enabled: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      serviceMonitor:
        enabled: true
