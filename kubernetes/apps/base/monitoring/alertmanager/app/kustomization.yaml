---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./servicemonitor.yaml
  - ./pocketidoidcclient.yaml
  - ./securitypolicy.yaml
configMapGenerator:
  - name: alertmanager
    files:
      - resources/alertmanager.yml
  # The alertmanager-mixin board (prometheus/alertmanager doc/alertmanager-mixin, generated JSON from
  # monitoring-mixins/website at 4a8f73ea, assets/alertmanager/dashboards/alertmanager-overview.json).
  # kube-prometheus-stack ships it only with its own Alertmanager, which is off here. Vendored, not a
  # url: board of grafana-operator: that repository's branch is master and the Renovate manager for
  # url: boards follows main. GrafanaDashboard `alertmanager` (monitoring/grafana-operator) reads it.
  - name: alertmanager-dashboard
    files:
      - resources/alertmanager-overview.json
    options:
      disableNameSuffixHash: true
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - kustomizeconfig.yaml
