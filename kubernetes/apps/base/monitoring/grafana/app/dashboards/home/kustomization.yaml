---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The landing board. GrafanaDashboard `home` (monitoring/grafana-operator/boards) reads this
# ConfigMap, and the Grafana CR names its uid in spec.preferences.homeDashboardUid.
#
# Its header is resources/sklab-header.svg, served from Grafana's own static directory. A text panel
# keeps an <img> only when the src starts with "/", and drops object-fit from its style.
configMapGenerator:
  - name: grafana-home-dashboard
    files:
      - home.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # $__rate_interval is a Grafana variable, not a Flux var.
    kustomize.toolkit.fluxcd.io/substitute: disabled
