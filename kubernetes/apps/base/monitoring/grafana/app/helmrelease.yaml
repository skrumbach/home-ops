---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  chartRef:
    kind: OCIRepository
    name: grafana
  interval: 1h
  timeout: 20m
  values:
    admin:
      existingSecret: grafana-admin-secret

    annotations:
      # grafana-brand is mounted by subPath, which never updates in place.
      configmap.reloader.stakater.com/reload: grafana,grafana-brand
      secret.reloader.stakater.com/reload: grafana-admin-secret,grafana-oidc-client

    # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (externalsecret-oidc.yaml, generated in the cluster;
    # pocketidoidcclient.yaml pushes the same value to Pocket ID). Grafana's env override beats
    # grafana.ini, so the secret stays out of the ConfigMap and no Grafana variable-expansion token
    # has to survive Flux envsubst.
    # Not optional: an optional Secret that appears after the pod started is never picked up
    # (Reloader ignores creation). ESO generates it without 1Password, so it adds no dependency
    # the pod does not already have through grafana-admin-secret.
    envFromSecrets:
      - name: grafana-oidc-client

    replicas: 1

    # Read-only root. /var/lib/grafana (the chart's `storage` emptyDir, persistence is off) holds
    # grafana.db, the plugins dir and the downloaded dashboards; /var/lib/grafana-search is the
    # chart's `search` emptyDir. /tmp is the only extra writable path.
    containerSecurityContext:
      readOnlyRootFilesystem: true

    extraEmptyDirMounts:
      - name: tmp
        mountPath: /tmp
      # Grafana's static image directory, copied and branded by the `brand` init container.
      - name: brand-static
        mountPath: /usr/share/grafana/public/build/static/img

    # The SKLAB look (app/resources/). Grafana OSS has no white-label setting and no custom theme,
    # so the brand files go over Grafana's own. Two places hold them:
    # - public/img/ has fixed names (loading mark, favicon, touch icon): three subPath mounts. The
    #   chart names each volume after its entry, so every mount needs its own entry.
    # - public/build/static/img/ is what the UI loads (menu logo, sign-in logo and background), under
    #   names with a build hash that changes with every Grafana release. The init container copies
    #   that directory into an emptyDir and overwrites the files by pattern, so a Grafana bump keeps
    #   the brand; a file upstream renames falls back to Grafana's own picture.
    extraConfigmapMounts:
      - name: brand-icon
        configMap: grafana-brand
        mountPath: /usr/share/grafana/public/img/grafana_icon.svg
        subPath: grafana_icon.svg
        readOnly: true
      - name: brand-favicon
        configMap: grafana-brand
        mountPath: /usr/share/grafana/public/img/fav32.png
        subPath: fav32.png
        readOnly: true
      - name: brand-touch-icon
        configMap: grafana-brand
        mountPath: /usr/share/grafana/public/img/apple-touch-icon.png
        subPath: apple-touch-icon.png
        readOnly: true

    extraInitContainers:
      - name: brand
        # The Grafana image itself: the directory it copies must match the running version.
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        # $f and $t have no braces, so Flux leaves them alone.
        command:
          - /bin/sh
          - -ec
          - |
            cp -R /usr/share/grafana/public/build/static/img/. /static/
            for f in grafana_icon g8_login_dark; do
              for t in /static/$f.*.svg; do
                if [ -e "$t" ]; then cp "/brand/$f.svg" "$t"; fi
              done
            done
            cp /brand/sklab-header.svg /static/
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
          - name: brand-static
            mountPath: /static
          - name: brand-icon
            mountPath: /brand
            readOnly: true

    # The landing board (app/dashboards/home/), mounted as the directory of the `home` provider.
    dashboardsConfigMaps:
      home: grafana-home-dashboard

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          # One provider per folder, eight folders. A board that an app ships as a ConfigMap joins
          # a folder by naming its title in the grafana_folder annotation. The landing board is
          # alone in General.
          - name: home
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: false
            options:
              path: /var/lib/grafana/dashboards/home
          - name: kubernetes
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: platform
            orgId: 1
            folder: Platform
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/platform
          - name: network
            orgId: 1
            folder: Network
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/network
          - name: storage
            orgId: 1
            folder: Storage
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/storage
          - name: databases
            orgId: 1
            folder: Databases
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/databases
          - name: ai
            orgId: 1
            folder: AI
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/ai
          - name: apps
            orgId: 1
            folder: Apps
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/apps
          - name: observability
            orgId: 1
            folder: Observability
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/observability

    # Every board here had live series behind most of its panels on 2026-11-22. Before adding one,
    # check that this Prometheus publishes what it queries: Ollama, Qdrant and SMARTctl boards sat
    # here with no such workload in the cluster.
    dashboards:
      kubernetes:
        # The API server, CoreDNS, etcd, kubelet and compute-resource boards come from
        # kube-prometheus-stack as ConfigMaps, also into this folder.
        node-exporter-full:
          # renovate: depName="Node Exporter Full"
          gnetId: 1860
          revision: 46
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-views-global:
          # renovate: depName="Kubernetes / Views / Global"
          gnetId: 15757
          revision: 43
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-views-namespaces:
          # renovate: depName="Kubernetes / Views / Namespaces"
          gnetId: 15758
          revision: 46
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-views-nodes:
          # renovate: depName="Kubernetes / Views / Nodes"
          gnetId: 15759
          revision: 40
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-views-pods:
          # renovate: depName="Kubernetes / Views / Pods"
          gnetId: 15760
          revision: 41
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-volumes:
          # renovate: depName="K8s / Storage / Volumes / Cluster"
          gnetId: 11454
          revision: 14
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

      platform:
        # Flux Operator's own boards read flux_resource_info, which the operator exports. The
        # flux2-monitoring-example cluster.json was dropped: it reads gotk_resource_info, a
        # kube-state-metrics custom-resource metric this cluster does not configure.
        flux-performance:
          url: https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/cb3cc0de38df84c359d24f6a6663d515c42b3f57/config/monitoring/dashboards/flux-performance.json
          datasource: Prometheus

        flux-k8s-api-performance:
          url: https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/cb3cc0de38df84c359d24f6a6663d515c42b3f57/config/monitoring/dashboards/flux-k8s-api-performance.json
          datasource: Prometheus

        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/control-plane.json
          datasource: Prometheus

        cert-manager:
          url: https://grafana.com/api/dashboards/20842/revisions/3/download
          datasource: Prometheus

        keda:
          url: https://raw.githubusercontent.com/kedacore/keda/48cd1105b579723c637d6ee6e0f245634541bedc/config/grafana/keda-dashboard.json
          datasource: Prometheus

      network:
        # The Cilium and Hubble boards come from the cilium HelmRelease (kube-system/cilium-dashboard).
        # Do not re-add gnetId 16611: same UID as the chart's and it locks sidecarProvider out of
        # writes.
        external-dns:
          # renovate: depName="External-DNS"
          gnetId: 15038
          revision: 3
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        cloudflare-tunnels:
          url: https://grafana.com/api/dashboards/17457/revisions/6/download
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        envoy-gateway:
          url: https://raw.githubusercontent.com/envoyproxy/gateway/v1.10.0/charts/gateway-addons-helm/dashboards/envoy-gateway-global.json
          datasource: Prometheus

        envoy-proxy:
          url: https://raw.githubusercontent.com/envoyproxy/gateway/v1.10.0/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
          datasource: Prometheus

        # PDU Insights (grafana.com 23027) is not imported: this Prometheus
        # has no unpoller_device_outlet_* series, so every panel would be empty.
        unifi-insights:
          # renovate: depName="UniFi-Poller: Client Insights - Prometheus"
          gnetId: 11315
          revision: 9
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
            # A few panels still reference the upstream input name.
            - name: DS_UNIFI_POLLER
              value: Prometheus

        unifi-network-sites:
          # renovate: depName="UniFi-Poller: Network Sites - Prometheus"
          gnetId: 11311
          revision: 5
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
            - name: DS_UNIFI_POLLER
              value: Prometheus
        unifi-usw:
          # renovate: depName="UniFi-Poller: USW Insights - Prometheus"
          gnetId: 11312
          revision: 9
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
            - name: DS_UNIFI_POLLER
              value: Prometheus
        unifi-uap:
          # renovate: depName="UniFi-Poller: UAP Insights - Prometheus"
          gnetId: 11314
          revision: 10
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
            - name: DS_UNIFI_POLLER
              value: Prometheus
      storage:
        # Ceph Usage and Ceph Hosts Overview are ConfigMaps (app/dashboards/ceph/); the kopiur board
        # comes from its chart.
        ceph-cluster:
          # renovate: depName="Ceph Cluster"
          gnetId: 2842
          revision: 18
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        ceph-osd:
          # renovate: depName="Ceph - OSD (Single)"
          gnetId: 5336
          revision: 9
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        ceph-pools:
          # renovate: depName="Ceph - Pools"
          gnetId: 5342
          revision: 9
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

      databases:
        # CloudNativePG (cloudnative-pg-dashboard chart) and the Dragonfly operator install their
        # own dashboards; gnetIds 15944/15945/21053/21054 are the unrelated Dragonfly P2P project.
        # Do not duplicate them here (UID collision).
        #
        # EMQX: the two rule-engine boards are left out, no rule exists and their series are absent.
        emqx-overview:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/dc299c941cbd80f9e02b6e9f2abed9a220479a3a/grafana-dashboard/template/emqx-5/overview.json
          datasource: Prometheus

        emqx-authentication:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/dc299c941cbd80f9e02b6e9f2abed9a220479a3a/grafana-dashboard/template/emqx-5/authentication.json
          datasource: Prometheus

        emqx-authorization:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/dc299c941cbd80f9e02b6e9f2abed9a220479a3a/grafana-dashboard/template/emqx-5/authorization.json
          datasource: Prometheus

        emqx-client-events:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/dc299c941cbd80f9e02b6e9f2abed9a220479a3a/grafana-dashboard/template/emqx-5/client-events.json
          datasource: Prometheus

        emqx-messages:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/dc299c941cbd80f9e02b6e9f2abed9a220479a3a/grafana-dashboard/template/emqx-5/messages.json
          datasource: Prometheus

      ai:
        # LiteLLM (app/dashboards/litellm/) and the GPU node board (ai/gpu-node-dashboard) are ConfigMaps.
        toolhive-mcp-gateway:
          url: https://raw.githubusercontent.com/stacklok/toolhive/42cd9b7e497bfc77dc67a1e73037675247d405b1/examples/otel/grafana-dashboards/toolhive-mcp-grafana-dashboard-otel-scrape.json
          datasource: Prometheus

      apps:
        plex-media-server-exporter:
          # renovate: depName="plex-media-server-exporter"
          gnetId: 17891
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        n8n:
          # renovate: depName="n8n System Health Overview"
          gnetId: 24474
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

      observability:
        gatus:
          # renovate: depName="Gatus"
          gnetId: 24379
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        # Alertmanager / Overview is a ConfigMap of the alertmanager app.
        victoria-logs:
          # renovate: depName="VictoriaLogs - single-node"
          gnetId: 22084
          revision: 12
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        # Replaces Flux's Loki-only logs.json. Flux controllers: Namespace flux-system, Container
        # manager, then the Filter variable kubernetes.pod_labels.app = <controller>. Its Level
        # panels read `log.level`; zap-logging controllers (Flux) write `level`, so they show
        # "unknown" there.
        victoria-logs-explorer:
          # renovate: depName="VictoriaLogs - Explorer for Kubernetes logs"
          gnetId: 25747
          revision: 1
          datasource:
            - name: DS_VICTORIALOGS
              value: VictoriaLogs

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - access: proxy
            name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            isDefault: true
            jsonData:
              prometheusType: Prometheus
              # Must match scrapeInterval in kube-prometheus-stack. Unset, Grafana assumes 15s and
              # $__rate_interval resolves to 1m, one scrape, so rate() panels are empty.
              timeInterval: 1m
          # The only log store; needs the victoriametrics-logs-datasource plugin below. Never list
          # it under deleteDatasources.
          - access: proxy
            name: VictoriaLogs
            type: victoriametrics-logs-datasource
            uid: victoria-logs
            url: http://victoria-logs.monitoring.svc.cluster.local:9428
          - name: Alertmanager
            type: alertmanager
            access: proxy
            url: http://alertmanager.monitoring.svc.cluster.local:9093
            jsonData:
              implementation: prometheus

        deleteDatasources:
          - name: Alertmanager
            orgId: 1
          - name: Prometheus
            orgId: 1

    env:
      GF_ANALYTICS_CHECK_FOR_UPDATES: false
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false
      GF_ANALYTICS_REPORTING_ENABLED: false
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_AUTH_BASIC_ENABLED: false
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
      # Do not set GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH. It overrides
      # grafana.ini dashboards.default_home_dashboard_path, and the sidecar
      # directory (/tmp/dashboards) has no home.json, so every visit to
      # /api/dashboards/home returns 500. dashboardsConfigMaps mounts the
      # landing board at the path grafana.ini already names.
      GF_EXPLORE_ENABLED: true
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
      GF_LOG_MODE: console
      GF_NEWS_NEWS_FEED_ENABLED: false
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SERVER_ROOT_URL: "https://{{ .Release.Name }}.sklab.dev"

    grafana.ini:
      # Pocket ID SSO. Client: pocketidoidcclient.yaml. The local admin form stays as
      # break-glass (disable_login_form is not set); retire it only after SSO is proven.
      auth.generic_oauth:
        enabled: true
        name: Pocket ID
        icon: signin
        # Must match spec.clientID in pocketidoidcclient.yaml.
        client_id: grafana
        # Pocket ID releases the `groups` claim (group names) only with the groups scope.
        # offline_access is kept for the refresh token use_refresh_token needs.
        scopes: openid email profile groups offline_access
        auth_url: https://id.sklab.dev/authorize
        token_url: https://id.sklab.dev/api/oidc/token
        api_url: https://id.sklab.dev/api/oidc/userinfo
        use_pkce: true
        use_refresh_token: true
        allow_sign_up: true
        # Only the Pocket ID admins group signs in, as server admins. Everyone else gets '' and
        # role_attribute_strict denies the login instead of landing as Viewer.
        role_attribute_path: contains(groups[*], 'admins') && 'GrafanaAdmin' || ''
        role_attribute_strict: true
        allow_assign_grafana_admin: true
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      dashboards:
        default_home_dashboard_path: /var/lib/grafana/dashboards/home/home.json
      news:
        news_feed_enabled: false
      # Core-plugin auto-update writes outside the plugins dir and fails on a read-only rootfs.
      plugins:
        preinstall_auto_update: false
      # Tron is the built-in theme closest to the SKLAB palette (near-black navy, cyan accent).
      # Each user can still pick another one in their profile.
      users:
        default_theme: tron
    imageRenderer:
      enabled: true
      # Pinned to the digest the chart's floating `latest` was running on 2026-11-13. Idles at
      # about 6Mi; Chromium spikes while it renders a panel.
      image:
        registry: docker.io
        repository: grafana/grafana-image-renderer
        tag: v5.12.11@sha256:cfa6c8f63e6d626f90208f2880f15bd5facc279daec1b9bb642af07aa850d95e
        pullPolicy: IfNotPresent
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 64Mi

    persistence:
      enabled: false

    plugins:
      - grafana-clock-panel
      # "<id> <version>", space not @: Grafana 12 reads GF_INSTALL_PLUGINS entries as id, then
      # an optional space-separated version. Renovate tracks it through .renovate/customManagers.json5; 0.34.0 needs Grafana >=10.4.
      - victoriametrics-logs-datasource 0.34.0

    rbac:
      pspEnabled: false

    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: grafana.svg
          gethomepage.dev/name: Grafana
          gethomepage.dev/group: Observability
          gethomepage.dev/description: Dashboards
          # No homepage widget: it only speaks basic auth, and GF_AUTH_BASIC_ENABLED is false.
          gatus.home-operations.com/endpoint: |-
            url: https://grafana.sklab.dev/api/health
            conditions:
              - "[STATUS] == 200"
              - "[BODY].database == ok"
            group: monitoring
        enabled: true
        hostnames: ["{{ .Release.Name }}.sklab.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    serviceAccount:
      create: true
      autoMount: true

    serviceMonitor:
      enabled: true

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
        labelValue: ""

    testFramework:
      enabled: false

    # nodeTaintsPolicy: Honor - no toleration for the talos-3 taint, which is PreferNoSchedule,
    # so Honor does not exclude talos-3 from the spread domains; the TaintToleration score
    # penalty keeps this workload off it.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
