---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# What the Grafana instance needs from outside itself: the admin login, the Pocket ID client and its
# secret, the brand files, the landing board and two sets of board JSON. Grafana runs from
# monitoring/grafana-operator (Grafana `grafana`), which mounts and reads these by name.
resources:
  - ./externalsecret.yaml
  - ./externalsecret-oidc.yaml
  - ./pocketidoidcclient.yaml
  - ./dashboards/ceph
  - ./dashboards/home
  - ./dashboards/litellm
# The SKLAB look: Grafana OSS has no white-label setting, so the Grafana CR puts these files over
# Grafana's own (logo, favicon, touch icon, sign-in background). Every file keeps the name Grafana
# gives it; sklab-header.svg is the header of the landing board.
#
# The two PNGs are stored as .bin: Flux's GitRepository leaves *.png (and *.jpg, *.gif) out of the
# artifact by default, and the build would fail on the missing file. The key gives them their name back.
configMapGenerator:
  - name: grafana-brand
    files:
      - apple-touch-icon.png=resources/apple-touch-icon.bin
      - fav32.png=resources/fav32.bin
      - resources/g8_login_dark.svg
      - resources/grafana_icon.svg
      - resources/sklab-header.svg
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
