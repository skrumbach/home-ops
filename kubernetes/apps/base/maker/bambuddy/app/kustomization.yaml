---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pocketidoidcclient.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: bambuddy-dashboard
    files:
      - resources/bambuddy.json
    options:
      disableNameSuffixHash: true
      annotations:
        # The board JSON holds ${DS_PROMETHEUS}, which Flux would otherwise try to substitute.
        kustomize.toolkit.fluxcd.io/substitute: disabled
# GrafanaDashboard bambuddy (monitoring/grafana-operator, app-boards/) reads this ConfigMap by name and key.
