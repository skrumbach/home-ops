---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
# Bambuddy's own sign-in (env-managed OIDC provider, BAMBUDDY_OIDC_* in helmrelease.yaml). The operator
# generates the client ID and secret and writes them to Secret `bambuddy-oidc-credentials`, which the
# HelmRelease reads directly. Deleting this CR deletes the client in Pocket ID; a re-created client has a
# new secret and Bambuddy picks it up on its next restart (reloader does that).
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: bambuddy
spec:
  name: Bambuddy
  launchUrl: https://bambuddy.sklab.dev
  callbackUrls: ["https://bambuddy.sklab.dev/api/v1/auth/oidc/callback"]
  # Bambuddy sends an S256 code_challenge on every authorization; this makes Pocket ID require it.
  pkceEnabled: true
  # Bambuddy has no group check here; this stops everyone outside admins at Pocket ID.
  allowedUserGroups:
    - name: admins
      namespace: security
  logo:
    autoGenerate: false
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
