---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm
spec:
  interval: 1h
  # The chat pod downloads its GGUF on first start (about 16 GiB, over 5 minutes) and the startup
  # probe allows 30. The default 5m Helm timeout rolled the Q3_K_M swap back mid-download, so
  # this matches the probe.
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: vllm
  maxHistory: 2
  values:
    # Placement is the devic.es/b70 request, not hostname affinity. KV at ctx
    # 262144 is 2720 MiB at q8_0 (10 of 40 layers are full attention), about twice that at f16.
    controllers:
      # Chat stays llama.cpp SYCL. This GPTQ cannot finish vLLM warmup on one B70
      # (intel/llm-scaler#382). The controller name stays vllm so the Service does not move.
      vllm:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          terminationGracePeriodSeconds: 60
          # Outranks the CI runners (1000000) so the 8-CPU request below is always schedulable on
          # talos-3 and a runner burst cannot preempt chat.
          priorityClassName: chat-gpu-high
          # The llama.cpp server-intel image has no USER (runs as root) and the /models PVC and the
          # GPU nodes are root-owned, so runAsNonRoot is not set. No fsGroup: it would re-own /models.
          # Same root + RuntimeDefault + drop ALL shape as the tdarr GPU worker.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          # talos-3 PreferNoSchedule: this pod can only land there, so it tolerates the penalty.
          tolerations:
            - key: home-operations.com/dedicated
              operator: Exists
              effect: PreferNoSchedule
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              # Re-measure the next tag with -ub 4096 before bumping. The two compound.
              tag: server-intel-b10820@sha256:35037559d99a90963d479b6e6e79764b138c76dc657341292aac6ad41d627c9f
            args:
              - -hf
              # Q3_K_M of the official distill, not the IQ3_XXS APEX build: same quality on the
              # graded suite and +28% decode (81 vs 63 t/s), because K-quants dequantize faster
              # than IQ-quants on SYCL. Q4_K_M decodes 99 t/s but leaves 1.5 GiB of VRAM at 262K.
              # Not abliterated. mmproj auto-loads.
              # The alias is the loaded model's real name, from ConfigMap chat-model
              # (apps/main/ai/chat-model.yaml). Change both together on a swap.
              - empero-ai/Qwen3.8-35B-A3B-Distill-GGUF:Q3_K_M
              - --alias
              - ${CHAT_MODEL_ID}
              - --host
              - "0.0.0.0"
              - --port
              - "8000"
              - --ctx-size
              # Model max. Do not pin --parallel or --kv-unified: an explicit pin collapses decode.
              - "262144"
              - -ngl
              - "99"
              - --jinja
              - --metrics
              - --flash-attn
              - "on"
              # f16, not q8_0: decode is +12-16% at 16K+ context and VRAM stays ~9 GiB free.
              # The oneDNN pin below stays. The servicemonitor kv label must match.
              - --cache-type-k
              - f16
              - --cache-type-v
              - f16
              - --cache-reuse
              # No-op while mmproj is loaded. Dropping mmproj removes vision.
              - "256"
              - --cache-ram
              # Absence restores the silent 8192 MiB default. A memory limit cannot stop that leak
              # (kernel SIGKILL at page fault). 4096, not 0. Pairs with GLIBC_TUNABLES. --no-mmap is not this fix.
              - "4096"
              - --no-mmap
              # -ub 4096 with -b 8192: prefill +14% at 16K and +11% at 64K, decode unchanged, and
              # 4 concurrent 16K requests finished 6% sooner with per-request decode 10.4 vs 6.7 t/s.
              # The earlier rejection did not reproduce.
              - -b
              - "8192"
              - -ub
              - "4096"
              # Drafts from n-grams already in the context, so there is no draft model and no VRAM cost.
              # Neutral on novel text (64.4 vs 64.3 t/s), faster only when the output copies the prompt.
              # draft-mtp was slower at short context and worse under concurrency. Do not swap it in
              # without re-measuring it.
              - --spec-type
              - ngram-mod
              # Unset, llama.cpp spawns one thread per hardware thread (20 on talos-3) and the
              # spin-waiting extras thrash when tdarr holds cores. Matches the cpu request below.
              - -t
              - "8"
            env:
              LLAMA_CACHE: /models/llama
              ONEAPI_DEVICE_SELECTOR: level_zero:0
              ZES_ENABLE_SYSMAN: "1"
              UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
              SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS: "1"
              # Second half of --cache-ram. Pins mmap_threshold so glibc returns large chunks.
              # Do not ship one without the other.
              GLIBC_TUNABLES: glibc.malloc.mmap_threshold=131072
              # Numeric only. "false" or "off" parse as the default and leave the leak on.
              # Lift only when this tag bounds fattn-onednn.cpp.
              GGML_SYCL_FA_ONEDNN: "0"
            envFrom:
              - secretRef:
                  name: vllm-secret
            # readOnlyRootFilesystem stays off: llama.cpp, the SYCL/Level Zero runtime and glibc
            # write caches under /tmp and $HOME that are not on a volume.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                # Equal to -t. The request is the CFS weight against tdarr on the same node.
                cpu: "8"
                # 12Gi = ~1232 MiB baseline + 2.7x the 4096 MiB cache. Below the working set this
                # pod is evicted first. Do not raise it to silence VLLMMemoryRetainedAboveBound.
                memory: 12Gi
                devic.es/b70: 1
              limits:
                # A limit cannot stop the host leak. Leave it above the request so a prefill
                # spike is not an OOMKill.
                memory: 48Gi
                devic.es/b70: 1
            probes:
              # First boot downloads ~15GB (default GGUF + mmproj); allow 30 min
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness: *probe

    # suffix pins the names vllm-app and vllm-models. With one service and one claim the
    # chart would name both `vllm`, and Helm would delete the 50Gi model cache.
    service:
      app:
        suffix: app
        controller: vllm
        ports:
          http:
            port: 8000

    persistence:
      models:
        suffix: models
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 50Gi
        advancedMounts:
          vllm:
            app:
              - path: /models
