---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item hindsight. Fields: POSTGRES_DB_USER_PASSWORD (letters and digits only: it sits inside a
# DSN, so @ / : # parse as a bad credential), HINDSIGHT_TENANT_API_KEY (long random).
# The LiteLLM key is written by the litellm app's PushSecret into item litellm-consumer-hindsight.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hindsight-secret
    template:
      data:
        # postgres-18-rw pinned by per-manifest hardcode. Role and database come from the
        # hindsight-db Kustomization (components/cnpg-database).
        HINDSIGHT_API_DATABASE_URL: "postgresql://hindsight:{{ .POSTGRES_DB_USER_PASSWORD }}@postgres-18-rw.database.svc.cluster.local:5432/hindsight"
        # One tenant key: it is read and write on every bank, so treat it as admin. Recalled memories
        # are injected into agent prompts, so a planted memory is a prompt-injection channel.
        HINDSIGHT_API_TENANT_API_KEY: "{{ .HINDSIGHT_TENANT_API_KEY }}"
        HINDSIGHT_CP_DATAPLANE_API_KEY: "{{ .HINDSIGHT_TENANT_API_KEY }}"
        # Hindsight's own LiteLLM key (CR `hindsight`): claude-haiku-5-5-metered, chat-local, embedding-cpu.
        # LLM_1 is the chat-local failover member; an indexed member does not inherit the primary's key.
        HINDSIGHT_API_LLM_API_KEY: "{{ .LITELLM_HINDSIGHT_API_KEY }}"
        HINDSIGHT_API_LLM_1_API_KEY: "{{ .LITELLM_HINDSIGHT_API_KEY }}"
        HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: "{{ .LITELLM_HINDSIGHT_API_KEY }}"
  data:
    - secretKey: LITELLM_HINDSIGHT_API_KEY
      remoteRef:
        key: litellm-consumer-hindsight
        property: key
  dataFrom:
    - extract:
        key: hindsight
