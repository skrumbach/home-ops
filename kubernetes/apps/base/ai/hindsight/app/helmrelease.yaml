---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# Long-term memory for the agents. State lives in the `hindsight` database on postgres-18 (CNPG backs it
# up), so there is no PVC and no kopiur claim. The API runs the worker in-process on one replica.
#
# LLM (fact extraction, consolidation, reflect): claude-haiku-5-5-metered through LiteLLM, chat-local as the
# failover, so memory content goes to Anthropic (owner decision 2026-11-21, Hermes bank included). Embeddings: embedding-local (the B70) through LiteLLM (1024 dims, fixed once a memory is stored; changing it
# needs `hindsight-admin reembed`). Reranker: local cross-encoder on CPU, bundled in the full image.
# Use the full image (no -slim): the slim one has no local reranker. Do NOT mount a volume at
# /home/hindsight/.cache: it shadows the models baked into the image.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hindsight
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      api:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/vectorize-io/hindsight-api
              tag: 1.3.0@sha256:c054765e9196fb1fe63497be06bcb55256c9024cc9314f951dc59858985ab242
            env:
              HINDSIGHT_API_HOST: 0.0.0.0
              HINDSIGHT_API_PORT: &apiPort 8888
              # Stable id for the in-process worker's task claims.
              HINDSIGHT_API_WORKER_ID: hindsight
              # Auth: one bearer key (HINDSIGHT_API_TENANT_API_KEY from the Secret).
              HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
              # LLM through LiteLLM, provider `openai` + base URL + the key from the Secret. Primary: Haiku 5.5
              # on the metered key (`anthropic` native has no reasoning-effort control, so not that provider).
              # chat-local on the B70 took 1-4 min a call and starved page refreshes during a bank seed.
              HINDSIGHT_API_LLM_PROVIDER: openai
              HINDSIGHT_API_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              HINDSIGHT_API_LLM_MODEL: claude-haiku-5-5-metered # gitleaks:allow (model name, not a key)
              HINDSIGHT_API_LLM_REASONING_EFFORT: low
              # Haiku 5.5 rejects a non-default temperature; `none` omits it on every operation.
              HINDSIGHT_API_LLM_TEMPERATURE: none
              # Failover member 1: chat-local, thinking off (the chat-local-classifier switch, sent per request
              # so chat-local stays one alias). A member that fails sits out 60s (cooldown_seconds default).
              HINDSIGHT_API_LLM_STRATEGY: '{"mode": "failover"}'
              HINDSIGHT_API_LLM_1_PROVIDER: openai
              HINDSIGHT_API_LLM_1_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              HINDSIGHT_API_LLM_1_MODEL: chat-local
              HINDSIGHT_API_LLM_1_EXTRA_BODY: '{"chat_template_kwargs": {"enable_thinking": false}}'
              # No startup test call: it would couple boot to LiteLLM and Anthropic.
              HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
              # One cap for every member: under failover all of it lands on the B70, shared with Hermes chat.
              HINDSIGHT_API_LLM_MAX_CONCURRENT: "4"
              # Sized for the chat-local member; Haiku answers in seconds.
              HINDSIGHT_API_LLM_TIMEOUT: "600"
              # Bounds a whole mental-model refresh, queue time included (default 300s). A failed refresh
              # pauses that page's automatic refreshes until one succeeds.
              HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "1200"
              # Embeddings through LiteLLM. Dimensions are set so no billable startup probe runs.
              HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
              HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: embedding-local
              HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: "1024"
              # LiteLLM caps embedding-local at 8 in flight and 60 requests a minute for every key together, and
              # 429s the rest at once. The default is 8 in flight
              # per encode() and 15s of retries, so 4 concurrent tasks failed retains and page refreshes.
              # One request per encode and a longer retry window.
              HINDSIGHT_API_EMBEDDINGS_MAX_CONCURRENT_REQUESTS: "1"
              # Texts per request. 8 of the longest memory units (~330 tokens) took 27s on the iGPU twin; the B70
              # was ~9x faster on short texts, so ~3s is an estimate to verify after rollout against the 5s
              # per-attempt LiteLLM timeout. The default 100 would not fit.
              HINDSIGHT_API_EMBEDDINGS_OPENAI_BATCH_SIZE: "8"
              # embedding-gpu has a 2048-token context shared by two slots (~1000 per input) and answers 400 above
              # it (TEI used to cut silently). Mental pages embed name + content, up to ~6000 tokens. Hindsight
              # counts with o200k, which reads about 13% fewer tokens than Qwen, so 800 stays under 1000. Tested
              # on the iGPU twin: 6 pages at 800 in one request, and 4 parallel requests, all ok.
              HINDSIGHT_API_EMBEDDINGS_MAX_INPUT_TOKENS: "800"
              HINDSIGHT_API_EMBEDDINGS_MAX_RETRIES: "10"
              HINDSIGHT_API_EMBEDDINGS_RETRY_BUDGET: "45"
              # Default pool max is 100 against the shared postgres-18; one pod needs far fewer.
              HINDSIGHT_API_DB_POOL_MIN_SIZE: "2"
              HINDSIGHT_API_DB_POOL_MAX_SIZE: "12"
            envFrom:
              - secretRef:
                  name: hindsight-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health/live, port: *apiPort}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # Loads the local reranker and runs migrations on first boot.
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health/live, port: *apiPort}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: *apiPort}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
      controlplane:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/vectorize-io/hindsight-control-plane
              tag: 1.2.3@sha256:29c8fd38a6408b76f08219badc1e506b1b3bb77264d8e1cdfc327e4f955d99f8
            env:
              NODE_ENV: production
              HINDSIGHT_CP_HOSTNAME: 0.0.0.0
              HINDSIGHT_CP_PORT: &uiPort "3000"
              HINDSIGHT_CP_DATAPLANE_API_URL: http://hindsight-api:8888
            # HINDSIGHT_CP_DATAPLANE_API_KEY. No HINDSIGHT_CP_ACCESS_KEY: Pocket ID gates the route at Envoy.
            envFrom:
              - secretRef:
                  name: hindsight-secret
            probes:
              liveness: &uiProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *uiProbe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      api:
        controller: api
        ports:
          http:
            port: *apiPort
      controlplane:
        controller: controlplane
        ports:
          http:
            port: 3000
    route:
      # Control plane only. The API (/v1, /mcp) has its own manifest, httproute-api.yaml: a second route
      # here would rename this one to hindsight-ui and detach the SecurityPolicy.
      # The control plane has no auth of its own here; securitypolicy.yaml adds Pocket ID.
      ui:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://hindsight.sklab.dev/
            conditions:
              # Envoy 302s an unauthenticated request to Pocket ID.
              - "[STATUS] == any(200, 302)"
            group: ai
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: Hindsight
          gethomepage.dev/icon: sh-hindsight.svg
          gethomepage.dev/description: Agent memory
          gethomepage.dev/pod-selector: app.kubernetes.io/name=hindsight
        hostnames:
          - hindsight.sklab.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: controlplane
                port: http
