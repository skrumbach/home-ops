---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# API door for clients outside the cluster (Claude Code and Obsidian on a LAN or VPN device, any MCP
# client). The Pocket ID SecurityPolicy (securitypolicy.yaml) targets only the HTTPRoute `hindsight`, so
# this route has no OIDC: these clients send a bearer token and cannot follow a browser redirect. The
# guard is the tenant key (HINDSIGHT_API_TENANT_API_KEY), which every /v1 and /mcp call must carry.
# Internal only: envoy-internal is the sole parentRef, never envoy-external. In-cluster clients keep
# using Service hindsight-api directly.
# Only the client paths are routed, so the unauthenticated /metrics and /docs stay inside the cluster.
# A separate manifest, not a second app-template route: two routes there rename the first one to
# hindsight-ui, which the SecurityPolicy would no longer match (an unmatched policy leaves the UI open).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-api
  annotations:
    gatus.home-operations.com/endpoint: |-
      url: https://hindsight-api.sklab.dev/health
      conditions: ["[STATUS] == 200"]
      group: ai
spec:
  hostnames:
    - "hindsight-api.sklab.dev"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
        - path: {type: PathPrefix, value: /mcp}
        - path: {type: PathPrefix, value: /health}
        - path: {type: PathPrefix, value: /version}
      backendRefs:
        - name: hindsight-api
          namespace: ai
          port: 8888
