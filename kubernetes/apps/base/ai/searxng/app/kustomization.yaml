---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
  - files:
      - ./resources/limiter.toml
      - ./resources/settings.yml
    name: searxng-configmap
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # settings.yml and limiter.toml carry no Flux variables. Keep them out of postBuild substitution so a future literal ${...} cannot fail the Kustomization.
    kustomize.toolkit.fluxcd.io/substitute: disabled
kind: Kustomization
namespace: ai
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
