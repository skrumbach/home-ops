---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-mcp
---
# Read-only on purpose: Flux applies as cluster-admin, so any write grant here lets a gateway-token holder apply anything.
# Reuses kubectl-mcp-readonly (secrets excluded); keep mcpserver.yaml --read-only too.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai
