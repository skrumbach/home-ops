---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: grafana-mcp-server
spec:
  proxyRef: litellm
  alias: grafana
  transport: http
  workload:
    automountServiceAccountToken: false
    image: docker.io/grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
    # Reloader rolls the Deployment when the re-minted token lands (ExternalSecret mcp-grafana, 5m).
    podAnnotations:
      secret.reloader.stakater.com/reload: mcp-grafana-secret
    args:
      - -t
      - streamable-http
      - --allowed-hosts
      - "*"
      # The Viewer-scoped service account token already enforces read-only at the Grafana API layer;
      # --disable-write is belt-and-suspenders in case the token is ever widened.
      - --disable-write
    port: 8000
    path: /mcp
    env:
      - name: GRAFANA_URL
        value: http://grafana-service.monitoring.svc.cluster.local:3000
    envFrom:
      - secretRef:
          name: mcp-grafana-secret
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The token must be a Grafana service account with the Viewer role only - never Editor/Admin. Uses
# 1Password item `grafana-mcp`, field `GRAFANA_SERVICE_ACCOUNT_TOKEN`, written by the grafana-operator
# PushSecret grafana-mcp-viewer-token (monitoring).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana
spec:
  # 5m, not the 1h default: the PushSecret publishes a re-minted token on the same cadence, and a 1h
  # refresh here would leave the token dead for up to an hour after a fresh one is already in 1Password.
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcp-grafana-secret
    template:
      data:
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .GRAFANA_SERVICE_ACCOUNT_TOKEN }}"
  dataFrom:
    - extract:
        key: grafana-mcp
