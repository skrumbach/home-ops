---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Read-only: --read-only plus the mcp-readonly ClusterRole (no core Secrets; rbac-mcp.yaml).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubectl-mcp
spec:
  proxyRef: litellm
  alias: kubectl
  transport: http
  workload:
    image: docker.io/rohitghumare64/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
    serviceAccountName: mcp-kubectl
    args:
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --read-only
    port: 8000
    path: /mcp
    env:
      - name: MCP_K8S_PROVIDER
        value: in-cluster
      # 2.0.0 stats $HOME/.config/kubectl-mcp-server/config.toml at startup; point HOME at the tmp
      # volume (the CRD has no workingDir, so ./.env is read from the image's own WORKDIR as uid 10001).
      - name: HOME
        value: /tmp
      # 2.0.0 refuses a non-loopback bind without auth, and LiteLLM reaches the pod IP, so loopback is
      # no option. Exposure: any pod in the cluster can reach this Service (no ingress policy yet), but the service account is read-only and core Secrets are
      # not granted.
      - name: MCP_ALLOW_UNAUTHENTICATED
        value: "true"
      - name: PYTHONUNBUFFERED
        value: "1"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      # The image's own user; its WORKDIR and home are readable by it only.
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
