---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# kubesearch.dev is a public read-only index of Flux/Argo home-ops repos, downloaded as SQLite
# databases (~44MB) and queried locally - no credential of any kind. GITHUB_TOKEN would only raise
# the rate limit of the daily release check, which one instance never needs.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: kubesearch-mcp
spec:
  proxyRef: litellm
  alias: kubesearch
  transport: http
  workload:
    automountServiceAccountToken: false
    image: ghcr.io/perfectra1n/kubesearch-mcp:1.3@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
    port: 3000
    path: /mcp
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - name: data
        mountPath: /data
    volumes:
      # Cached databases and the repo_clone tools' ephemeral git clones. Not persisted: the daily
      # refresh (KUBESEARCH_REFRESH_HOURS=24) re-downloads anyway, a restart costs one cold download.
      - name: data
        emptyDir:
          sizeLimit: 2Gi
