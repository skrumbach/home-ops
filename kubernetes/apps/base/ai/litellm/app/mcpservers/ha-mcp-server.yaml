---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Home Assistant control, including write tools (call_service, restart, remove_*). Only team mcp-home
# lists this alias (../litellmteam-mcp-home.yaml), held by the hermes-ha key alone.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: ha-mcp-server
spec:
  proxyRef: litellm
  alias: ha
  transport: http
  workload:
    automountServiceAccountToken: false
    image: ghcr.io/homeassistant-ai/ha-mcp:9.3.0@sha256:8da893a58da84be7c6e2a8057dfac4fc74821bc5bf17676b5223e439e914db2b
    command:
      - ha-mcp-web
    port: 8086
    path: /mcp
    env:
      - name: HOMEASSISTANT_URL
        value: http://home-assistant.home-automation:8123
      - name: MCP_PORT
        value: "8086"
      # The URL path stays the plain default; only LiteLLM may reach this pod (ciliumnetworkpolicy-mcp.yaml).
      - name: MCP_SECRET_PATH
        value: /mcp
    envFrom:
      - secretRef:
          name: mcp-ha-secret
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Requires the 1Password item `home-assistant` to carry a HOMEASSISTANT_TOKEN field (a Home Assistant
# long-lived access token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-ha
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcp-ha-secret
    template:
      data:
        HOMEASSISTANT_TOKEN: "{{ .HOMEASSISTANT_TOKEN }}"
  dataFrom:
    - extract:
        key: home-assistant
