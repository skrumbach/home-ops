---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# ai/opencode's workspace key: auto, plus chat-local so the B70 model can be picked directly (zero-priced,
# terminal, no cloud fallback). Budget = cloud-tier USD only (auto's COMPLEX/REASONING tiers); local volume
# is bounded by rpm/tpm. venice/* (every Venice model) is unpriced in the cost map: it logs $0, so only rpm/tpm bound it. tpmLimit must clear one full agent turn at opencode.json's limits.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: opencode
spec:
  proxyRef: litellm
  keyAlias: opencode
  secretName: litellm-key-opencode
  secretKey: key
  # Team mcp-agents is this key's entitlement to the MCP servers (../litellmteam.yaml).
  teamID: mcp-agents
  models:
    - auto
    - chat-local
    - embedding-local
    - venice/*
  maxBudget: "10.00"
  budgetDuration: 30d
  rpmLimit: 8
  tpmLimit: 200000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-opencode
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-opencode
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-opencode
          property: key
