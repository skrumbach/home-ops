---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# ai/hindsight's one key. INVARIANT: exactly the three models its memory comes from. claude-haiku-5-5-metered
# does the LLM work (household-metered ANTHROPIC_API_KEY, so maxBudget is the real cap); chat-local is
# Hindsight's own failover member, chosen in Hindsight and not by a LiteLLM fallback. embedding-cpu is the vector
# space of every stored memory, so never add another embedder (its vectors would rank silently wrong).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hindsight
spec:
  proxyRef: litellm
  keyAlias: hindsight
  secretName: litellm-key-hindsight
  secretKey: key
  models:
    - chat-local
    - claude-haiku-5-5-metered
    - embedding-cpu
  # The busiest 6 h of a bank seed (2026-11-21, ~320k in / 215k out on the B70) is ~$0.15 at Haiku 5.5 prices.
  maxBudget: "15.00"
  budgetDuration: 30d
  rpmLimit: 120
  tpmLimit: 600000
  metadata:
    purpose: memory LLM calls and embeddings for the ai/hindsight agent memory
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-hindsight
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-hindsight
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-hindsight
          property: key
