---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The LiteLLM UI's Pocket ID client secret (GENERIC_CLIENT_SECRET in litellmproxy.yaml).
# Generated in the cluster, once: nothing is stored in 1Password and nothing rotates it. It only
# changes when this ExternalSecret or its Secret is deleted; pocketidoidcclient.yaml then pushes the
# new value to Pocket ID and keeps the old one valid for clientSecretOverlap while the pod restarts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm-oidc-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: *name
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Alphanumeric only: Pocket ID takes printable ASCII, and the value is pasted into JSON and Python.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: litellm-oidc-client
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - client-secret
