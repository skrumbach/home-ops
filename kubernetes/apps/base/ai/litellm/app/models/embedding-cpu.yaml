---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# CPU embedder (ai/embedding-cpu, Qwen3-Embedding-0.6B, 1024 dims): the same vector space as embedding-local
# but off the shared B70, so it carries no 1 req/s cap. Not a fallback for embedding-local.
# INVARIANT: no prices, no cloud fallback; params.model must name what the backend serves.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: embedding-cpu
spec:
  modelName: embedding-cpu
  proxyRef: litellm
  params:
    model: openai/Qwen/Qwen3-Embedding-0.6B
    apiBase: http://embedding-cpu.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed" # TEI runs with no --api-key
    additional:
      # In-flight cap so a retain burst queues at LiteLLM, not on the CPU.
      max_parallel_requests: 4
      timeout: 20
  info:
    mode: embedding
    maxInputTokens: 32768
