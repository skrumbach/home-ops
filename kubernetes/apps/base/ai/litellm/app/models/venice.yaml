---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Venice AI (OpenAI-compatible, https://api.venice.ai/api/v1) as ONE wildcard registration: every Venice model
# is callable as `venice/<model-id>` with no per-model CR. LiteLLM's native `veniceai` provider supplies the base
# URL; its default key env is VENICE_AI_API_KEY, so the key is named explicitly.
# Registration only: a key must allow-list `venice/*` (hermes, opencode today).
# INVARIANT: the cost map has no Venice prices, so a model that only this wildcard matches logs $0 and a key's
# maxBudget does NOT bound it (only rpm/tpm do). The priced `venice/<id>` CRs in ../models-generated (refreshed daily
# by .github/workflows/litellm-models.yaml) take that role for every listed model; this wildcard is the catch-all
# for a model Venice added since the last refresh.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: venice
spec:
  modelName: venice/*
  proxyRef: litellm
  params:
    model: veniceai/*
    apiKey: os.environ/VENICE_API_KEY
