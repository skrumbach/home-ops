---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmproxy_v1alpha1.json
# The LiteLLM proxy, rendered by litellm-operator.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # `file` keeps Git the source of truth; `api` would turn store_model_in_db on.
  applyMode: file
  image: ghcr.io/berriai/litellm-non_root:v1.109.1@sha256:e9e15fe17b66fc8cda6ff7e18914e1d452785ca404fa20336ec447152f86daba
  # ^ Floor v1.93.0 (auto-router LLM classifier; below it the config is silently
  # ignored). Enforced by .renovate/overrides.json5.
  replicas: 1

  service:
    type: ClusterIP
    port: 4000

  # NO spec.route, ever: httproute-internal.yaml is the route, and the operator
  # would create a second one.

  envFrom:
    # Master/salt key, DATABASE_URL and the provider keys. Models resolve provider
    # keys via `apiKey: os.environ/<VAR>`.
    - secretRef:
        name: litellm-secret

  # UI SSO through Pocket ID (pocketidoidcclient.yaml). Only the client secret is
  # secret: externalsecret-oidc.yaml generates it in the cluster and
  # pocketidoidcclient.yaml pushes the same value to Pocket ID, so nothing here
  # waits on the operator.
  env:
    # Per-string cap on stored prompt/response bodies (default 2048 chars).
    - name: MAX_STRING_LENGTH_PROMPT_IN_DB
      value: "1000000"
    # Must match spec.clientID in pocketidoidcclient.yaml.
    - name: GENERIC_CLIENT_ID
      value: litellm
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: client-secret
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://id.sklab.dev/authorize
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://id.sklab.dev/api/oidc/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://id.sklab.dev/api/oidc/userinfo
    # Redirect URI is <PROXY_BASE_URL>/sso/callback: change it only together
    # with callbackUrls in pocketidoidcclient.yaml.
    - name: PROXY_BASE_URL
      value: https://litellm.sklab.dev
    # Must include profile: Pocket ID releases the admins group's custom claim
    # litellm_role only with it (userinfo and ID token), or first login lands as
    # INTERNAL_USER_VIEW_ONLY. Pocket ID has no litellm_role scope.
    - name: GENERIC_SCOPE
      value: openid email profile
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    # Master-key browser login moves to /fallback/login.
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
    # The UI sends no id_token_hint, so Pocket ID redirects to its /logout
    # confirmation page instead of back to LiteLLM.
    - name: PROXY_LOGOUT_URL
      value: https://id.sklab.dev/api/oidc/end-session

  # The operator mints and syncs virtual keys through the admin API with this.
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY

  generalSettings:
    # Git stays the only source of truth for models and keys (never UI edits).
    store_model_in_db: false

    # Full prompt/response capture into the Postgres spend log; the prompt lands
    # in proxy_server_request, not messages. 30d matches the postgres-18 Barman
    # window ("30d", never "1mo").
    store_prompts_in_spend_logs: true
    maximum_spend_logs_retention_period: "30d"

    # INVARIANT: provider pass-throughs are admin-only (no virtual key may reach
    # a shared credential). ORDER IS LOAD-BEARING: each exact entry above its
    # dead-loopback catch-all; never set forward_headers. Jev decisions use the
    # native /v1/decisions route, not a pass-through.
    pass_through_endpoints:
      - path: /openrouter
        target: http://127.0.0.1:9/openrouter-pass-through-locked
        include_subpath: true
        auth: true
      - path: /anthropic/v1/messages
        target: https://api.anthropic.com/v1/messages
        methods: ["POST"]
        auth: true
        headers:
          x-api-key: os.environ/ANTHROPIC_API_KEY
          anthropic-version: "2023-06-01"
          Content-Type: application/json
      - path: /anthropic/v1/messages/count_tokens
        target: https://api.anthropic.com/v1/messages/count_tokens
        methods: ["POST"]
        auth: true
        headers:
          x-api-key: os.environ/ANTHROPIC_API_KEY
          anthropic-version: "2023-06-01"
          Content-Type: application/json
      - path: /anthropic
        target: http://127.0.0.1:9/anthropic-pass-through-locked
        include_subpath: true
        auth: true

  litellmSettings:
    callbacks: ["prometheus"] # labels only, never content; exposes /metrics
    # Exact-match response cache on litellm-dragonfly, 300s TTL.
    cache: true
    cache_params:
      type: redis
      host: litellm-dragonfly.ai.svc.cluster.local
      port: 6379
      ttl: 300
    # OpenCode Go rejects any request without x-opencode-session (HTTP 400 MissingSessionID) and
    # wants one stable value per conversation. Forward the caller's x-* headers for these model
    # groups ONLY (never general_settings: that would forward to every provider). The caller (Hermes,
    # providers.litellm.session_affinity_header) supplies the value.
    model_group_settings:
      forward_client_headers_to_llm_api:
        - go-deepseek-v4-flash
        - go-glm-5.1
        - go-kimi-k2.6
    # The ONLY way a model reaches the AI Hub (UI "make public" 500s here). A new
    # model is unpublished until added; discovery only, grants nothing.
    public_model_groups:
      - auto
      - chat-ha
      - chat-local
      - claude-fable-5
      - claude-fable-5-1
      - claude-fable-5-1-metered
      - claude-haiku-4-5-20251001
      - claude-haiku-4-5-20251001-metered
      - claude-haiku-5-5
      - claude-opus-4-5-20251101
      - claude-opus-4-6
      - claude-opus-4-7
      - claude-opus-4-8
      - claude-opus-5
      - claude-opus-5-5
      - claude-opus-5-metered
      - claude-sonnet-4-5-20250929
      - claude-sonnet-4-6
      - claude-sonnet-5
      - claude-sonnet-5-5
      - claude-sonnet-5-metered
      - cliproxy-claude
      - deepseek-v4-flash
      - deepseek-v4-flash-0731
      - deepseek-v4-pro
      - deepseek-v4-pro-0813
      - embedding-local
      - gemini-3.1-pro
      - gemini-3.5-flash-lite
      - gemini-3.6-flash
      - gemini-3.7-flash
      - gemma-4-31b
      - glm-5.2
      - glm-5.3
      - go-deepseek-v4-flash
      - go-glm-5.1
      - go-kimi-k2.6
      - gpt-5.6-luna
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-6-astra
      - gpt-6-astra-pro
      - gpt-oss-20b
      - grok-4.5
      - grok-4.6
      - kimi-k3
      - minimax-m3
      - muse-glimmer-30b
      - nemotron-3.5-lightning
      - qwen/qwen3-embedding-8b
      - qwen3.6-27b
      - qwen3.8-2.4t-a95b
      - qwen3.8-27b

  # Free-form passthrough to router_settings: the API server validates nothing.
  routerSettings:
    # Shared counters across LiteLLM's workers; without it D4 limits and budgets
    # are per worker and overshoot (replicas: 1 does not help).
    redis_host: litellm-dragonfly.ai.svc.cluster.local
    redis_port: 6379
    # Pinned so least-busy cannot creep in.
    routing_strategy: simple-shuffle
    # Makes a deployment's rpm a hard limit (429 before the backend); without it rpm only weights
    # routing. Only embedding-local sets rpm today.
    optional_pre_call_checks:
      - enforce_model_rate_limits
    # INVARIANT: a config fallback bypasses the caller's allow-list, so only
    # cloud-entitled aliases may appear here, targeting the -metered CR (never a
    # terminal local alias).
    fallbacks:
      - chat-ha: ["claude-sonnet-5-metered"]
      - auto: ["claude-sonnet-5-metered"]
    # Retry-only for the vector store's embedding model: OpenRouter returns
    # transient HTTP 400 (code 20015) and the router never retries a 400 unless a
    # policy names it. NEVER add a fallback embedding model: a second model writes
    # vectors incompatible with the pgvector index.
    model_group_retry_policy:
      # embedding-local: never retry a 429 or timeout. The router sleeps to the end of the rpm
      # window (~60s) and retries a 429, and multiplies the timeout by 3.
      embedding-local:
        RateLimitErrorRetries: 0
        TimeoutErrorRetries: 0
      qwen/qwen3-embedding-8b:
        BadRequestErrorRetries: 3
        InternalServerErrorRetries: 3
        TimeoutErrorRetries: 3
        RateLimitErrorRetries: 3
    # Separate axis: local 262k window -> cloud 1M; no reverse entry.
    context_window_fallbacks:
      - chat-ha: ["claude-sonnet-5-metered"]
      - auto: ["claude-sonnet-5-metered"]

  # Vector store under extraConfig, never the CRD's vectorStoreRegistry (object vs
  # list). Open to every key: non-sensitive content only.
  extraConfig:
    vector_store_registry:
      - vector_store_name: default
        litellm_params:
          vector_store_id: default
          custom_llm_provider: pg_vector
          vector_store_description: >-
            Household pgvector store. Non-sensitive content only (never
            personal documents or credentials) - open to every virtual key.
            Chunks are embedded with qwen/qwen3-embedding-8b (OpenRouter) at
            2000 dimensions.
          api_base: http://litellm-pgvector.ai.svc.cluster.local:8000
          # NEVER PG_VECTOR_API_KEY: that fallback name would open every store id to every key.
          api_key: os.environ/LITELLM_PGVECTOR_API_KEY

  # No startupProbe field: a 240s delay emulates the old 300s boot budget.
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 4000
    initialDelaySeconds: 240
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      # Also checks the DB connection.
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  podAnnotations:
    # Reloader falls back to pod-template annotations, covering secret rotation.
    reloader.stakater.com/auto: "true"

  resources:
    requests:
      cpu: 10m
      memory: 1280Mi
    limits:
      # A bare GET /spend/logs OOM-killed the proxy at 2Gi.
      memory: 4Gi
