---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# CPU twin of ai/embedding-gpu: the same Qwen3-Embedding-0.6B at the same 1024 dimensions, served by
# Text Embeddings Inference on CPU, so no B70 load and no shared-GPU rate cap. It is a separate model
# alias (embedding-cpu), not a fallback for embedding-local: never let one index mix both.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app embedding-cpu
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: embedding-cpu
  values:
    controllers:
      embedding-cpu:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/huggingface/text-embeddings-inference
              tag: cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
            args:
              - --model-id
              - Qwen/Qwen3-Embedding-0.6B
              - --port
              - "8080"
              # Over-length input is cut instead of failing the caller.
              - --auto-truncate
              - --max-client-batch-size
              - "16"
              # The default 16384-token warmup batch OOM-killed the pod at 3Gi. Memory scales with this.
              - --max-batch-tokens
              - "4096"
            env:
              HUGGINGFACE_HUB_CACHE: /data
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: &port 8080}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # First start downloads about 1.2GB of weights.
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: *port}
                  periodSeconds: 15
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /health, port: *port}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 500m
                # CPU candle loads the 0.6B weights as float32 (about 2.4GB) before any batch.
                memory: 3Gi
              limits:
                memory: 6Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      # Re-downloadable weights. Not backed up. Without the claim every start re-fetches them.
      models:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 5Gi
        advancedMounts:
          embedding-cpu:
            app:
              - path: /data
