---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/persistentvolumeclaim.json
# Mac-authoritative XML corpus. ceph-filesystem-rwx. Unbacked on purpose.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-xml
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ceph-filesystem-rwx
