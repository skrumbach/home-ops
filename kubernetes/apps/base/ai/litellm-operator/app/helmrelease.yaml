---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: litellm-operator
  # crds CreateReplace and remediation are injected by the cluster-apps Kustomization.
  values:
    controller:
      logLevel: info
      leaderElection:
        enabled: true

    # Explicit so a chart-default flip cannot silently drop the admission webhook (failurePolicy Fail for every LiteLLM kind).
    webhook:
      enabled: true

    # LLMKube is not installed here; a chart-default flip must not mint undeclared LiteLLMModels.
    llmkube:
      autoRegister: false
    # Operator pod hardening comes from the chart. The proxy pod it renders has none (CRD gap).
    # Its webhook is failurePolicy Fail for every LiteLLM kind.
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
    # Soft Go heap cap below the 256Mi limit so GC runs before the kernel OOM-kills the pod.
    # Live working set is about 143Mi; an OOM takes the admission webhook (failurePolicy Fail) down.
    env:
      - name: GOMEMLIMIT
        value: 200MiB
