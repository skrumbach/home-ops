---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: gpu-node-dashboard
    files:
      - resources/gpu-node.json
# GrafanaDashboard gpu-node (monitoring/grafana-operator, app-boards/) reads this ConfigMap by name
# and key, and sets the folder.
generatorOptions:
  disableNameSuffixHash: true
