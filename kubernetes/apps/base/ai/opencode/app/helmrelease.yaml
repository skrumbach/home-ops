---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: opencode
  maxHistory: 2
  values:
    defaultPodOptions:
      # No talos-3 toleration. PreferNoSchedule keeps it off that node. A hostname deny-list fails open.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}

    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/opencode
              tag: 2.3.2@sha256:0ddd274f4d006235d5434ff8c380d3f7f389e572347c0eefb9243e99aed7b016
            command: ["/etc/opencode/entrypoint.sh"]
            env:
              HOME: &homepath /home/opencode
              OPENCODE_CONFIG: /etc/opencode/opencode.json
              TZ: America/New_York
              # Hindsight memory plugin (resources/entrypoint.sh unpacks it, opencode.json loads it). The plugin
              # reads these as fallbacks for ~/.hindsight/coding-agent.json, which is not written here.
              # HINDSIGHT_API_TOKEN (the tenant key) comes from the Secret. One bank per git repository
              # (`coding-agent::<repo>`), shared with Claude Code on a laptop that uses the same package.
              HINDSIGHT_SERVER_MODE: self-hosted
              HINDSIGHT_API_URL: http://hindsight-api.ai.svc.cluster.local:8888
              # The copy on the PVC is pinned by checksum in entrypoint.sh; no self-update from npm.
              HINDSIGHT_AUTO_UPDATE: "false"
              # First-prompt injection by retrieval only. The default (`reflect`) is an LLM synthesis with
              # a 20 s timeout, on the chat-local that the session itself is using.
              HINDSIGHT_AUTO_INJECT: recall
              # Page refresh is one chat-local synthesis per page: nightly (UTC), not the hourly default.
              HINDSIGHT_PAGE_TRIGGER_CRON: "H 8 * * *"
              # Hindsight runs 2 LLM calls at a time (HINDSIGHT_API_LLM_MAX_CONCURRENT); do not queue 10.
              HINDSIGHT_MAX_PARALLEL_RETAINS: "2"
            envFrom:
              - secretRef:
                  name: opencode
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi

    persistence:
      home:
        existingClaim: ${KOPIUR_CLAIM:-opencode}
        globalMounts:
          - path: *homepath
      config:
        type: configMap
        name: opencode-config
        defaultMode: 0755
        globalMounts:
          - path: /etc/opencode

    service:
      app:
        controller: opencode
        # Service is opencode-app, never `opencode`: in ns ai, the DNS search path turns the
        # provider host opencode.ai into opencode.ai.svc.cluster.local, which would be this
        # Service and black-holes every OpenCode Go call from LiteLLM.
        suffix: app
        ports:
          http:
            port: *port
