---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# API door for the OpenCode desktop app and `opencode attach`. The Pocket ID SecurityPolicy
# (securitypolicy.yaml) targets only the HTTPRoute `opencode`, so this route has no OIDC: a client that
# cannot follow a browser redirect to id.sklab.dev (the desktop app's fetch, its CORS preflight) would
# otherwise get a 302 and show the server as down. The guard here is OPENCODE_PASSWORD (HTTP Basic,
# user `opencode`, fixed by the v2 server); do not remove it from the ExternalSecret.
# Internal only: envoy-internal is the sole parentRef. The hostname attaches to this gateway alone.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode-api
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 401"]
spec:
  hostnames:
    - "opencode-api.sklab.dev"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        # opencode-app, not opencode: see service.app.suffix in helmrelease.yaml.
        - name: opencode-app
          namespace: ai
          port: 4096
