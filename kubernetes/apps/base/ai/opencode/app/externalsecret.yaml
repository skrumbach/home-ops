---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# GITHUB_TOKEN reuses the EXISTING `hermes` 1Password item's `HOMELAB_GH_TOKEN`
# field (public_repo scope: read+write to public repos) - no new prerequisite.
# OpenCode is now the only consumer of this write field: Hermes renders its own
# HOMELAB_GH_TOKEN from the read-only field HOMELAB_GH_READ_TOKEN. opencode is an
# internal-only, Pocket ID-gated interactive workspace for the captain, which is
# why it may push to home-ops/etc.
# See this app's README.md for why this differs from repo-wiki's read-only key.
# MCP_GATEWAY_TOKEN is 1Password item mcp-gateway, written by ai/toolhive.
# OPENCODE_PASSWORD is 1Password item `opencode` (owner-created). Without it opencode generates a
# random server password at every start and prints it to the log (VictoriaLogs).
# LITELLM_API_KEY is NOT a captain prerequisite - see the README.
# LITELLM_PROJECTS_API_KEY is litellm-consumer-litellm-consume-projects (field key).
# Both items store the secret under `key`, so this one is a named data entry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        LITELLM_API_KEY: "{{ .key }}"
        LITELLM_PROJECTS_API_KEY: "{{ .LITELLM_PROJECTS_API_KEY }}"
        GITHUB_TOKEN: "{{ .HOMELAB_GH_TOKEN }}"
        MCP_GATEWAY_TOKEN: "{{ .MCP_GATEWAY_TOKEN }}"
        MCP_GATEWAY_URL: "https://mcp.sklab.dev/mcp"
        OPENCODE_PASSWORD: "{{ .OPENCODE_PASSWORD }}"
  data:
    - secretKey: LITELLM_PROJECTS_API_KEY
      remoteRef:
        key: litellm-consumer-litellm-consume-projects
        property: key
  dataFrom:
    - extract:
        key: litellm-consumer-opencode
    - extract:
        key: hermes
    - extract:
        key: mcp-gateway
    - extract:
        key: opencode
