---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Gates the opencode UI route with Pocket ID at Envoy (native OIDC). No second, unauthenticated API
# route: nothing here needs programmatic access. OPENCODE_PASSWORD (basic auth) stays the inner
# layer: with forwardAccessToken off, Envoy Gateway keeps the client's Authorization header
# (preserve_authorization_header), so do not turn it on. See this app's README.md.
# A policy that fails to translate (e.g. the operator has not written opencode-oidc-credentials yet)
# makes the route answer 500, not pass through; a policy whose targetRef matches no route leaves
# that route open.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: opencode-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: opencode
  oidc:
    provider:
      issuer: https://id.sklab.dev
      # Explicit endpoints skip discovery: without them the Envoy Gateway controller fetches
      # the issuer's openid-configuration on every translation, and a failed fetch turns the
      # route into a 500 until the next one.
      authorizationEndpoint: https://id.sklab.dev/authorize
      tokenEndpoint: https://id.sklab.dev/api/oidc/token
      endSessionEndpoint: https://id.sklab.dev/api/oidc/end-session
    # Both from the Secret pocketidoidcclient.yaml generates.
    clientIDRef:
      name: opencode-oidc-credentials
    clientSecret:
      name: opencode-oidc-credentials
    redirectURL: https://opencode.sklab.dev/oauth2/callback
    logoutPath: /oauth2/logout
