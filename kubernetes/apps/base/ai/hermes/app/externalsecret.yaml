---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Agent secrets. The dashboard login is Pocket ID (pocketidoidcclient-dashboard.yaml), not a password here.
# 1Password item hermes. Field list: kubernetes/apps/base/ai/hermes/README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        # OpenAI-compatible API server bearer key (API_SERVER_ENABLED in helmrelease).
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        # homelab-commit-watcher skill: GitHub PAT (public_repo) + Discord webhook.
        # Named HOMELAB_GH_TOKEN (not GH_TOKEN) - Hermes scrubs provider-cred names. Rendered from the
        # fine-grained READ-ONLY field: the agent's terminal can see this variable, and the old
        # HOMELAB_GH_TOKEN field can create issues and commit files to home-ops (OpenCode's only now).
        HOMELAB_GH_TOKEN: "{{ .HOMELAB_GH_READ_TOKEN }}"
        DISCORD_WEBHOOK: "{{ .DISCORD_WEBHOOK }}"
        # Telegram bot: BotFather token + comma-separated allowed numeric user ids.
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        TELEGRAM_ALLOWED_USERS: "{{ .TELEGRAM_ALLOWED_USERS }}"
        # Discord bot (dedicated channel). Gated twice: these allowed user ids, and discord.allowed_channels in
        # config.yaml. DISCORD_BOT_TOKEN is on Hermes' terminal-env scrub list, like the Telegram one.
        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN }}"
        DISCORD_ALLOWED_USERS: "{{ .DISCORD_ALLOWED_USERS }}"
        # Hermes' own LiteLLM virtual key (CR `hermes`, PushSecret-written item
        # litellm-consumer-hermes). Also its MCP credential (config.yaml mcp_servers.litellm: LiteLLM
        # serves the MCP tools to the team mcp-agents). Not OPENAI_API_KEY, GH_TOKEN or
        # LITELLM_API_KEY: Hermes scrubs built-in provider cred names.
        LITELLM_HERMES_API_KEY: "{{ .LITELLM_HERMES_API_KEY }}"
        # The `home-assistant` profile's key (CR `hermes-ha`, item litellm-consumer-hermes-ha): chat-local and
        # the go-* models only, and the only key whose team (mcp-home) may call the Home Assistant MCP.
        LITELLM_HERMES_HA_API_KEY: "{{ .LITELLM_HERMES_HA_API_KEY }}"
        # Hindsight tenant key (item `hindsight`), read by the memory provider plugin. Admin-equivalent on
        # every bank, and the agent's terminal can read it: see ai/hindsight README.md.
        HINDSIGHT_API_KEY: "{{ .HINDSIGHT_TENANT_API_KEY }}"
  data:
    - secretKey: LITELLM_HERMES_API_KEY
      remoteRef:
        key: litellm-consumer-hermes
        property: key
    - secretKey: LITELLM_HERMES_HA_API_KEY
      remoteRef:
        key: litellm-consumer-hermes-ha
        property: key
    # A named entry, so the item's database password is not pulled into this template.
    - secretKey: HINDSIGHT_TENANT_API_KEY
      remoteRef:
        key: hindsight
        property: HINDSIGHT_TENANT_API_KEY
  dataFrom:
    - extract:
        key: hermes
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Git credentials for the agent, rendered as a `.git-credentials` file that the
# git `store` helper reads (the raw token never appears in a remote URL or env).
#
# Scope: use a GitHub *fine-grained* PAT restricted to "Only select
# repositories" -> the single repo Hermes should touch, with Contents:
# Read/Write. This is what keeps every other repo invisible - a classic PAT
# would expose all repos the account can see.
#
# 1Password item `hermes` field:
#   GITHUB_LLM_WIKI_TOKEN - github_pat_... (fine-grained, single-repo, Contents: R/W)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-git
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        # Host-level entry. The token is repo-scoped server-side by GitHub, so
        # even though git may offer it for any github.com URL, GitHub rejects it
        # for anything outside the selected repo.
        .git-credentials: "https://x-access-token:{{ .GITHUB_LLM_WIKI_TOKEN }}@github.com"
  dataFrom:
    - extract:
        key: hermes
