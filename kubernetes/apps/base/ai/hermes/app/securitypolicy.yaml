---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Gates the hermes-codeserver route (code-server runs with --auth none) with Pocket ID at Envoy
# (native OIDC). The dashboard route (hermes-app) keeps its own basic auth and is not gated here.
# A policy that fails to translate (e.g. the operator has not written
# hermes-codeserver-oidc-credentials yet) makes the route answer 500, not pass through; a policy
# whose targetRef matches no route leaves that route open.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hermes-code-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hermes-codeserver
  oidc:
    provider:
      issuer: https://id.sklab.dev
      # Explicit endpoints skip discovery: without them the Envoy Gateway controller fetches
      # the issuer's openid-configuration on every translation, and a failed fetch turns the
      # route into a 500 until the next one.
      authorizationEndpoint: https://id.sklab.dev/authorize
      tokenEndpoint: https://id.sklab.dev/api/oidc/token
      endSessionEndpoint: https://id.sklab.dev/api/oidc/end-session
    # Both from the Secret pocketidoidcclient.yaml generates.
    clientIDRef:
      name: hermes-codeserver-oidc-credentials
    clientSecret:
      name: hermes-codeserver-oidc-credentials
    redirectURL: https://hermes-code.sklab.dev/oauth2/callback
    logoutPath: /oauth2/logout
