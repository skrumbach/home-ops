---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "sklab-dev-production"
spec:
  secretName: "sklab-dev-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "sklab.dev"
  dnsNames:
    - "sklab.dev"
    - "*.sklab.dev"
