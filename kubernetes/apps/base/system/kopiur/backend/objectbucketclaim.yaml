---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/objectbucket.io/objectbucketclaim_v1alpha1.json
# The ceph-bucket class has reclaimPolicy Delete: deleting this claim deletes the bucket and every object in it (the Ceph copy of all backups).
# prune: disabled stops Flux from deleting it when this manifest leaves Git or the Kustomization is removed. It does NOT
# stop `kubectl delete obc` or a namespace delete.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: kopiur
spec:
  bucketName: kopiur
  storageClassName: ceph-bucket
  # additionalConfig is the only OBC field Rook updates in place; nothing else here may change on a live claim.
  additionalConfig:
    # 500G headroom (peak ~37 GB). Do not copy volsync's 20G quota; that quota was already exceeded.
    # A quota on the user Rook generates for this claim, which Rook limits to this one bucket, so it caps the bucket.
    # Not bucketMaxSize: the operator allows only maxObjects and maxSize by default (obcAllowAdditionalConfigFields).
    # Never bucketOwner: it re-links the bucket to another user and hands the claim that user's keys.
    maxSize: 500G
