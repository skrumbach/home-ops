---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-gpu
spec:
  interval: 1h
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.37.1
      sourceRef:
        kind: HelmRepository
        name: intel
  values:
    name: xe
    # Chart default nodeSelector (intel.feature.node.kubernetes.io/gpu=true) is a hand-set Talos nodeLabel, not NFD (talos/machineconfig.yaml.j2).
    nodeFeatureRule: false
    sharedDevNum: 99
    # This pool is the iGPU only (allowIDs 0xa7a0). B70 consumers use devic.es/b70 and devic.es/b70-vaapi.
    allowIDs: "0xa7a0"
    # Toleration is hygiene under PreferNoSchedule.
    tolerations:
      - key: home-operations.com/dedicated
        operator: Exists
        effect: PreferNoSchedule
