---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Internal only: envoy-internal is the sole parentRef and external-dns only
# publishes the internal record. Nothing public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app konflate
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Rendered Flux PR diffs
    gethomepage.dev/group: Platform
    gethomepage.dev/name: Konflate
    gethomepage.dev/app: *app
    gethomepage.dev/pod-selector: app.kubernetes.io/name=konflate
    gethomepage.dev/icon: konflate.svg
    external-dns.kubernetes.io/target: "internal.sklab.dev"
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - "konflate.sklab.dev"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: *app
          namespace: flux-system
          port: 8080
