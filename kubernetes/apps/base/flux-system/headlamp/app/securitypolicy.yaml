---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Gates the headlamp route with Pocket ID at Envoy (native OIDC). Headlamp's own sign-in (the
# headlamp-admin ServiceAccount token, pushsecret.yaml) stays the inner layer and is what the
# Kubernetes API sees. Never set forwardAccessToken here: it would replace that token with the
# Pocket ID access token in the Authorization header.
# A policy that fails to translate (e.g. the operator has not written headlamp-oidc-credentials yet)
# makes the route answer 500, not pass through; a policy whose targetRef matches no route leaves
# that route open.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: headlamp-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: headlamp
  oidc:
    provider:
      issuer: https://id.sklab.dev
      # Explicit endpoints skip discovery: without them the Envoy Gateway controller fetches
      # the issuer's openid-configuration on every translation, and a failed fetch turns the
      # route into a 500 until the next one.
      authorizationEndpoint: https://id.sklab.dev/authorize
      tokenEndpoint: https://id.sklab.dev/api/oidc/token
      endSessionEndpoint: https://id.sklab.dev/api/oidc/end-session
    # Both from the Secret pocketidoidcclient.yaml generates.
    clientIDRef:
      name: headlamp-oidc-credentials
    clientSecret:
      name: headlamp-oidc-credentials
    redirectURL: https://headlamp.sklab.dev/oauth2/callback
    logoutPath: /oauth2/logout
