---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app headlamp
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Kubernetes dashboard
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: headlamp.svg
    gethomepage.dev/name: Headlamp
    gethomepage.dev/app: *app
    # securitypolicy.yaml gates this route, so a route check would measure the Pocket ID
    # sign-in page it redirects to. Probe the Service in-cluster instead (the chart's own
    # readiness probe path is /).
    gatus.home-operations.com/endpoint: |-
      url: http://headlamp.flux-system.svc.cluster.local/
      conditions: ["[STATUS] == 200"]
      ui:
        hide-url: true
spec:
  hostnames:
    - "headlamp.sklab.dev"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: headlamp
          namespace: flux-system
          port: 80
