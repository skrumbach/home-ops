---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: "${APP}-r2"
spec:
  policyRef:
    name: "${APP}-r2"
  schedule:
    # Daily at hour 4. Do not hand-assign the H minute.
    cron: "${KOPIUR_SCHEDULE_R2:-H 4 * * *}"
    jitter: 5m
    # kopiur reads cron as UTC unless timezone is set; the pin keeps the slot hours fixed across DST.
    timezone: "${KOPIUR_SCHEDULE_TIMEZONE:-America/New_York}"
  deletion:
    onScheduleDelete: Retain
