---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# The one required PR check: `CI Success`. Every job runs on GitHub-hosted runners, so the
# gate reports while the cluster and its ARC runners are down. Image Pull and Terraform Diff
# need the cluster and stay advisory in their own files.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ci-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned exactly: the action's SHA-ref lookup falls back to "latest" when the tags API
  # call fails. Keep in step with the action pin on the `uses:` lines and image-pull.yaml.
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: 0.6.5

jobs:
  changes:
    # The only fork guard: a fork PR skips this job and, through `needs`, every job below;
    # `CI Success` then fails it on purpose (push the branch to this repo to run CI).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kubernetes: ${{ steps.kubernetes.outputs.changed_files }}
      versions: ${{ steps.versions.outputs.changed_files }}
      bootstrap: ${{ steps.bootstrap.outputs.changed_files }}
      renovate: ${{ steps.renovate.outputs.changed_files }}
      terraform: ${{ steps.terraform.outputs.changed_files }}
    steps:
      - name: Kubernetes Changes
        id: kubernetes
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            kubernetes/**/*
            .github/workflows/ci.yaml

      - name: Version Pin Changes
        id: versions
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            talos/**
            kubernetes/apps/base/system-upgrade/**
            kubernetes/apps/main/system-upgrade/**
            .github/workflows/ci.yaml
            .mise.toml
            scripts/ci/version-consistency.sh

      - name: Bootstrap Changes
        id: bootstrap
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            bootstrap/**
            .github/workflows/ci.yaml
            .mise.toml

      - name: Renovate Config Changes
        id: renovate
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            .renovaterc.json5
            .renovate/**
            .github/workflows/ci.yaml

      - name: Terraform Changes
        id: terraform
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            terraform/**
            .github/workflows/ci.yaml
            .mise.toml
            scripts/ci/tofu-validate.sh

  flate-test:
    if: ${{ needs.changes.outputs.kubernetes != '[]' }}
    needs: changes
    name: Flate - Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Empty base: otherwise the action exports FLATE_BASE and `flate test all` goes changed-only.
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          base: ""

      - name: Run flate test
        run: flate test all --path kubernetes/clusters/main --no-progress

  flate-diff:
    if: ${{ needs.changes.outputs.kubernetes != '[]' }}
    needs: changes
    name: Flate - Diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource:
          - hr
          - ks
      fail-fast: false
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      # fetch-depth: 0 makes origin/<default> resolvable for --base.
      - name: Checkout Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          base: ""

      # --strip-attr is omitted on purpose: passing any value REPLACES flate's default set.
      - name: Run flate diff
        env:
          RESOURCE: ${{ matrix.resource }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          flate diff "${RESOURCE}" \
            --path kubernetes/clusters/main \
            --base "origin/${DEFAULT_BRANCH}" \
            --no-progress \
            --output diff > diff.patch

      # 60000 bytes stays under GitHub's 65536-character comment limit.
      - name: Truncate Diff
        id: diff
        run: |-
          if [ "$(wc -c < diff.patch)" -gt 60000 ]; then
            head -c 60000 diff.patch > diff.patch.tmp
            mv diff.patch.tmp diff.patch
          fi
          if [ -s diff.patch ]; then
            echo 'has-diff=true' >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.diff.outputs.has-diff == 'true' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
          path: diff.patch
          message: |-
            ```diff
            {{{content}}}
            ```

  versions:
    if: ${{ needs.changes.outputs.versions != '[]' }}
    needs: changes
    name: Versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: aqua:mikefarah/yq
          cache: false

      - name: Check Machineconfig Versions Against tuppr CRs
        run: ./scripts/ci/version-consistency.sh

  bootstrap:
    if: ${{ needs.changes.outputs.bootstrap != '[]' }}
    needs: changes
    name: Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: aqua:kubernetes-sigs/kustomize aqua:yannh/kubeconform
          cache: false

      # Kustomize half only: bootstrap/helmfile/ renders through vals against 1Password,
      # which CI has no credentials for. `just bootstrap cluster` is DR-only, so this is
      # the only place a broken kustomization shows up before a disaster.
      - name: Validate Bootstrap Kustomize Output
        run: |
          kustomize build bootstrap/kustomize/apps \
            | kubeconform -strict -summary -schema-location default

  renovate-config:
    if: ${{ needs.changes.outputs.renovate != '[]' }}
    needs: changes
    name: Renovate Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # renovate requires node ^24

      # Unpinned on purpose: the in-cluster Renovate runs a current release, so the config
      # must validate against current Renovate, not a frozen one.
      - name: Validate Renovate Config
        run: npx --yes --package renovate renovate-config-validator .renovaterc.json5 .renovate/*.json5

  terraform:
    if: ${{ needs.changes.outputs.terraform != '[]' }}
    needs: changes
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: opentofu
          cache: false

      # Credential-less fmt + validate. Live read-only plans are terraform-diff.yaml.
      - name: Format and Validate OpenTofu Stacks
        run: ./scripts/ci/tofu-validate.sh

  # Whole tree, no path filter. Tool versions come from .mise.toml, so install_args names
  # the tools only.
  lint:
    needs: changes
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python uv aqua:rhysd/actionlint pipx:zizmor aqua:koalaman/shellcheck pipx:yamllint
          cache: false

      - name: yamllint
        run: yamllint -s .

      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor --offline --min-severity medium .github/workflows

      # xargs -0 instead of `shellcheck $(git ls-files ...)`: unquoted expansion is itself SC2046.
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  # Every scripts/ci/*-test.py blocks the PR. Each needs only python3 and PyYAML.
  tests:
    needs: changes
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python uv
          cache: false

      - name: Install Python Test Dependencies
        run: uv pip install --system pyyaml

      # nullglob + count check: an empty glob must fail, not run zero tests and pass.
      - name: Run tests
        run: |
          shopt -s nullglob
          tests=(scripts/ci/*-test.py)
          if (( ${#tests[@]} == 0 )); then
            echo "FAILED: no scripts/ci/*-test.py files found"
            exit 1
          fi
          fail=0
          for f in "${tests[@]}"; do
            echo "::group::${f}"
            if ! python3 "${f}" </dev/null; then
              echo "FAILED: ${f}"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "${fail}"

  success:
    # always(), not !cancelled(): GitHub counts a skipped required check as passing, so a
    # cancelled run must post red here, never skip. Skipped jobs (no matching changes) pass.
    if: ${{ always() }}
    # List every other job here: CI Success is the only required check.
    needs:
      - changes
      - flate-test
      - flate-diff
      - versions
      - bootstrap
      - renovate-config
      - terraform
      - lint
      - tests
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fork PRs skip every job, so a green result would mean nothing ran.
      - name: Fork PR?
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "Fork PRs are not tested here; push the branch to this repo to run CI."
          exit 1

      - name: Any job failed or cancelled?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          exit 1

      - name: All jobs passed or skipped
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo '${{ toJSON(needs.*.result) }}'
