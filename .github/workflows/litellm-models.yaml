---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Refreshes the generated LiteLLM model catalogs (kubernetes/apps/base/ai/litellm/app/models-generated) from each
# provider's public model list and opens ONE rolling PR when anything changed. No provider key is involved: every
# listed provider publishes its catalog and prices without authentication. The PR is never auto-merged.
name: LiteLLM Models

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: litellm-models
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A provider is enabled by listing it here AND its file in models-generated/kustomization.yaml.
      PROVIDERS: venice openrouter
      BRANCH: automation/litellm-models
      PATHSPEC: kubernetes/apps/base/ai/litellm/app/models-generated
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: python uv
          cache: false

      # The script refuses to write on a failed fetch or a catalog under half the current size, so an
      # upstream outage fails this job instead of opening a PR that deletes models.
      - name: Generate
        run: |
          for provider in ${PROVIDERS}; do
            uv run --script scripts/litellm-models/generate.py --provider "${provider}"
          done

      # Compare with main (nothing to do) and with the rolling branch (the open PR already carries exactly this
      # refresh): without the second check an unmerged PR would get a new commit and a CI rerun every day.
      # The repository is public, so the fetch needs no credentials.
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- "${PATHSPEC}"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          elif git fetch --quiet --depth=1 origin "${BRANCH}" 2>/dev/null && git diff --quiet FETCH_HEAD -- "${PATHSPEC}"; then
            echo "::notice::${BRANCH} already carries this refresh"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      # Pushes made with the default GITHUB_TOKEN do not start pull_request workflows, so the required
      # `CI Success` check would never run. The bot app's token does.
      - name: Generate Token
        if: ${{ steps.diff.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request
        if: ${{ steps.diff.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          added="$(git diff -U0 -- "${PATHSPEC}" | grep -c '^+  modelName:' || true)"
          removed="$(git diff -U0 -- "${PATHSPEC}" | grep -c '^-  modelName:' || true)"
          title="chore(litellm): refresh generated ${PROVIDERS// /, } models"
          {
            echo "Generated by \`.github/workflows/litellm-models.yaml\` from the providers' public model lists."
            echo
            echo "- Models added: ${added}, removed: ${removed} (a price or limit change shows in the diff only)."
            echo "- Registration and USD prices only: no key's allow-list or the AI Hub list changes."
            echo "- Review the diff, then merge. Never edit \`models-generated/\` by hand."
          } > "${RUNNER_TEMP}/pr-body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${BRANCH}"
          git add -- "${PATHSPEC}"
          git commit -m "${title}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${BRANCH}"

          if gh pr view "${BRANCH}" --json state --jq '.state' 2>/dev/null | grep -q '^OPEN$'; then
            gh pr edit "${BRANCH}" --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"
          else
            gh pr create --base main --head "${BRANCH}" --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"
          fi
